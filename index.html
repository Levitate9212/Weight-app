<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weight Tracker</title>
  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #f1f4f9;
      touch-action: pan-y;
    }
    #splashScreen {
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
  </style>
</head>
<body class="text-slate-900 font-sans antialiased min-h-screen pb-12 selection:bg-blue-600 selection:text-white relative flex flex-col items-center">

  <!-- СТИЛЬНАЯ ЗАСТАВКА (SPLASH SCREEN) -->
  <div id="splashScreen" class="fixed inset-0 z-50 bg-[#f1f4f9] flex flex-col items-center justify-center">
    <div class="relative flex items-center justify-center">
      <div class="absolute w-24 h-24 bg-blue-500/20 rounded-full animate-ping"></div>
      <div class="w-16 h-16 rounded-[24px] bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center text-2xl shadow-xl shadow-blue-500/30 text-white relative z-10">🏆</div>
    </div>
    <h2 class="mt-5 font-bold text-slate-800 text-sm tracking-tight">Weight Tracker AI</h2>
    <p class="text-slate-400 text-xs mt-1 font-medium">Загрузка дашборда...</p>
  </div>

  <!-- Фоновые мягкие Mesh Gradient сферы (в стиле референса) -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-blue-400/20 rounded-full blur-[140px] pointer-events-none"></div>
  <div class="absolute top-1/4 right-5 w-[400px] h-[400px] bg-purple-400/15 rounded-full blur-[140px] pointer-events-none"></div>
  <div class="absolute top-2/3 left-5 w-[400px] h-[400px] bg-pink-400/10 rounded-full blur-[140px] pointer-events-none"></div>

  <main class="w-full max-w-lg mx-auto px-4 pt-5 space-y-4 relative z-10">

    <!-- Выбор человека по центру вверху -->
    <div id="userSelectorContainer" class="hidden flex justify-center mb-1">
      <div id="userTabs" class="flex items-center space-x-1 bg-white/80 backdrop-blur-md p-1 rounded-full border border-slate-200/80 shadow-sm">
        <!-- Заполняется динамически -->
      </div>
    </div>

    <!-- Ошибка -->
    <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-2xl text-xs font-medium"></div>

    <!-- Основной контент (Bento Grid) -->
    <div id="dashboardContent" class="hidden space-y-4">

      <!-- Карточка 1: Главная градиентная карточка (в стиле Performance Overview) -->
      <div class="bg-gradient-to-br from-[#1d4ed8] via-[#2563eb] to-[#0284c7] text-white rounded-[32px] p-6 relative overflow-hidden shadow-[0_20px_40px_rgba(37,99,235,0.25)]">
        <div class="absolute -right-10 -top-10 w-48 h-48 bg-white/15 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex justify-between items-start relative z-10">
          <div>
            <p class="text-[11px] font-bold uppercase tracking-widest text-blue-100/80">Текущий вес</p>
            <p id="currWeight" class="text-4xl font-extrabold tracking-tight mt-1 text-white">-</p>
          </div>
          <span id="currDiffBadge" class="text-[11px] font-semibold px-3.5 py-1.5 rounded-full border backdrop-blur-md">--</span>
        </div>

        <div class="grid grid-cols-3 gap-2 mt-7 pt-5 border-t border-white/15 relative z-10">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-blue-100/70">Тренд (SMA 7)</p>
            <p id="trendWeight" class="text-xs font-extrabold text-white mt-0.5">-</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-blue-100/70">Старт</p>
            <p id="startWeight" class="text-xs font-extrabold text-white/90 mt-0.5">-</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-blue-100/70">Цель</p>
            <p id="targetWeight" class="text-xs font-extrabold text-emerald-300 mt-0.5">-</p>
          </div>
        </div>
      </div>

      <!-- Карточка 2: Белая карточка с графиком и периодами -->
      <div class="bg-white/90 backdrop-blur-xl border border-slate-200/80 rounded-[32px] p-6 shadow-[0_15px_35px_rgba(0,0,0,0.05)] relative overflow-hidden">
        
        <!-- Шапка графика -->
        <div class="flex flex-col gap-3 mb-4">
          <div class="flex flex-wrap justify-between items-start gap-2">
            <div>
              <h2 class="text-xs font-bold tracking-tight text-slate-900">Динамика и тренд</h2>
              <p class="text-[10px] text-slate-500">Фактические замеры и линия скользящего среднего</p>
            </div>
            <div class="flex items-center space-x-2.5 text-[10px] font-medium text-slate-500">
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span> Факт</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Тренд</span>
            </div>
          </div>

          <!-- Выбор периода (14, 30, 90, 180, Год, Все) -->
          <div class="grid grid-cols-6 gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/80 text-center">
            <button onclick="setPeriod('14')" id="btn-14" class="period-btn py-1.5 rounded-lg transition text-slate-600 text-[11px] font-medium">14д</button>
            <button onclick="setPeriod('30')" id="btn-30" class="period-btn py-1.5 rounded-lg transition text-slate-600 text-[11px] font-medium">30д</button>
            <button onclick="setPeriod('90')" id="btn-90" class="period-btn py-1.5 rounded-lg transition text-slate-600 text-[11px] font-medium">90д</button>
            <button onclick="setPeriod('180')" id="btn-180" class="period-btn py-1.5 rounded-lg transition text-slate-600 text-[11px] font-medium">180д</button>
            <button onclick="setPeriod('365')" id="btn-365" class="period-btn py-1.5 rounded-lg transition text-slate-600 text-[11px] font-medium">Год</button>
            <button onclick="setPeriod('all')" id="btn-all" class="period-btn py-1.5 rounded-lg transition bg-white text-blue-600 shadow-sm font-semibold text-[11px]">Все</button>
          </div>
        </div>

        <!-- Область графика -->
        <div class="relative w-full h-[240px]">
          <canvas id="weightChart"></canvas>
        </div>
      </div>

      <!-- Bento-сетка снизу из двух красивых градиентных мини-карточек (в стиле Leadly AI) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Карточка Прогресса (Фиолетово-розовый градиент) -->
        <div class="bg-gradient-to-br from-purple-600/90 to-pink-600/90 text-white rounded-[24px] p-5 shadow-lg shadow-purple-500/15 relative overflow-hidden flex flex-col justify-between">
          <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
          <p class="text-[10px] font-bold uppercase tracking-wider text-purple-100/80">Прогресс цели</p>
          <div id="progressText" class="text-2xl font-extrabold mt-2 text-white">--%</div>
        </div>

        <!-- Карточка Прогноза (Голубо-бирюзовый градиент) -->
        <div class="bg-gradient-to-br from-cyan-600/90 to-blue-600/90 text-white rounded-[24px] p-5 shadow-lg shadow-cyan-500/15 relative overflow-hidden flex flex-col justify-between">
          <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
          <p class="text-[10px] font-bold uppercase tracking-wider text-cyan-100/80">🎯 Прогноз достижения</p>
          <div id="goalEtaText" class="text-lg font-extrabold mt-2 text-white truncate">--</div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // ⚠️ Вставьте ссылку на ваше развернутое веб-приложение Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;
    let currentPeriod = 'all';

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      fetchData();
    });

    function fetchData() {
      const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "";
      const url = `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(initData)}&callback=handleData`;

      const script = document.createElement('script');
      script.src = url;
      script.onerror = () => {
        showError("Не удалось подключиться к серверу скрипта.");
      };
      document.body.appendChild(script);
    }

    window.handleData = function(response) {
      const splash = document.getElementById('splashScreen');
      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';

      if (response.error) {
        showError(response.message || "Ошибка авторизации.");
        return;
      }

      globalData = response;
      const userIds = Object.keys(globalData);

      if (userIds.length === 0) {
        showError("В базе данных нет записей.");
        return;
      }

      let defaultUid = userIds[0];
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        const tgId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        if (globalData[tgId]) defaultUid = tgId;
      }

      activeUserId = defaultUid;

      const userTabs = document.getElementById('userTabs');
      userTabs.innerHTML = '';

      if (userIds.length > 1) {
        document.getElementById('userSelectorContainer').classList.remove('hidden');
        userIds.forEach(uid => {
          const user = globalData[uid];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `px-4 py-1.5 text-xs font-semibold rounded-full transition-all ${uid === activeUserId ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`;
          btn.textContent = user.name;
          btn.addEventListener('click', () => {
            activeUserId = uid;
            updateTabsUI(userIds);
            renderDashboard(globalData[activeUserId]);
          });
          userTabs.appendChild(btn);
        });
      }

      document.getElementById('dashboardContent').classList.remove('hidden');
      renderDashboard(globalData[activeUserId]);
    };

    function updateTabsUI(userIds) {
      const userTabs = document.getElementById('userTabs');
      const buttons = userTabs.children;
      userIds.forEach((uid, index) => {
        if (buttons[index]) {
          if (uid === activeUserId) {
            buttons[index].className = "px-4 py-1.5 text-xs font-semibold rounded-full transition-all bg-blue-600 text-white shadow-sm";
          } else {
            buttons[index].className = "px-4 py-1.5 text-xs font-semibold rounded-full transition-all text-slate-600 hover:text-slate-900";
          }
        }
      });
    }

    function showError(msg) {
      const splash = document.getElementById('splashScreen');
      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';

      const errBox = document.getElementById('errorBox');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    function setPeriod(period) {
      currentPeriod = period;
      document.querySelectorAll('.period-btn').forEach(btn => {
        btn.className = "period-btn py-1.5 rounded-lg transition text-slate-600 text-[11px] font-medium";
      });
      const activeBtn = document.getElementById(`btn-${period}`);
      if (activeBtn) {
        activeBtn.className = "period-btn py-1.5 rounded-lg transition bg-white text-blue-600 shadow-sm font-semibold text-[11px]";
      }
      if (globalData[activeUserId]) {
        renderDashboard(globalData[activeUserId]);
      }
    }

    function calculateSMA(entries, windowSize = 7) {
      return entries.map((entry, index, arr) => {
        const start = Math.max(0, index - windowSize + 1);
        const subset = arr.slice(start, index + 1);
        const sum = subset.reduce((acc, curr) => acc + curr.weight, 0);
        return parseFloat((sum / subset.length).toFixed(1));
      });
    }

    function calculateGoalETA(entries, target, currentWeight) {
      if (!target || entries.length < 2) return "Не задана цель";
      
      const recent = entries.slice(-14);
      const first = recent[0];
      const last = recent[recent.length - 1];
      const daysDiff = (last.timestamp - first.timestamp) / (1000 * 60 * 60 * 24);
      
      if (daysDiff <= 0) return "Расчет...";
      const weightDiff = last.weight - first.weight;
      const ratePerDay = weightDiff / daysDiff;
      
      if (ratePerDay >= 0 && currentWeight > target) return "Нужен дефицит";
      if (ratePerDay <= 0 && currentWeight < target) return "Нужен профицит";
      if (ratePerDay === 0) return "Вес стабилен";

      const remainingWeight = target - currentWeight;
      const daysToTarget = remainingWeight / ratePerDay;
      
      if (daysToTarget < 0 || isNaN(daysToTarget) || !isFinite(daysToTarget)) return "Недоступно";
      
      const targetDate = new Date(Date.now() + daysToTarget * 24 * 60 * 60 * 1000);
      return targetDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderDashboard(userData) {
      if (!userData || !userData.entries || userData.entries.length === 0) {
        showError("У пользователя нет данных о весе.");
        return;
      }

      let entries = userData.entries;
      
      if (currentPeriod !== 'all') {
        const daysLimit = parseInt(currentPeriod);
        const latestTimestamp = entries[entries.length - 1].timestamp;
        const cutoffTime = latestTimestamp - (daysLimit * 24 * 60 * 60 * 1000);
        entries = entries.filter(e => e.timestamp >= cutoffTime);
      }

      const allEntries = userData.entries;
      const latest = allEntries[allEntries.length - 1];
      const prev = allEntries.length > 1 ? allEntries[allEntries.length - 2] : latest;
      const start = userData.start || allEntries[0].weight;
      const target = userData.target;

      document.getElementById('currWeight').textContent = `${latest.weight} кг`;
      document.getElementById('startWeight').textContent = `${start} кг`;
      document.getElementById('targetWeight').textContent = target ? `${target} кг` : "—";

      const diffDay = parseFloat((latest.weight - prev.weight).toFixed(1));
      const badge = document.getElementById('currDiffBadge');
      if (diffDay < 0) {
        badge.textContent = `${diffDay} кг за сутки`;
        badge.className = "text-[11px] font-semibold px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-100 border border-emerald-400/30 backdrop-blur-md";
      } else if (diffDay > 0) {
        badge.textContent = `+${diffDay} кг за сутки`;
        badge.className = "text-[11px] font-semibold px-3 py-1 rounded-full bg-red-500/20 text-red-100 border border-red-400/30 backdrop-blur-md";
      } else {
        badge.textContent = `Без изменений`;
        badge.className = "text-[11px] font-semibold px-3 py-1 rounded-full bg-white/15 text-white/90 border border-white/20 backdrop-blur-md";
      }

      const smaValuesAll = calculateSMA(allEntries);
      document.getElementById('trendWeight').textContent = `${smaValuesAll[smaValuesAll.length - 1]} кг`;

      if (target) {
        const totalDist = Math.abs(target - start);
        const currentDist = Math.abs(latest.weight - start);
        let pct = totalDist > 0 ? Math.round((currentDist / totalDist) * 100) : 100;
        pct = Math.max(0, Math.min(100, pct));
        document.getElementById('progressText').textContent = `${pct}%`;
        
        const etaDateStr = calculateGoalETA(allEntries, target, latest.weight);
        document.getElementById('goalEtaText').textContent = etaDateStr;
      } else {
        document.getElementById('progressText').textContent = `0%`;
        document.getElementById('goalEtaText').textContent = `Нет цели`;
      }

      const labels = entries.map(e => e.dateStr);
      const weights = entries.map(e => e.weight);
      const smaValues = calculateSMA(entries);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('weightChart').getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 240);
      gradient.addColorStop(0, 'rgba(37, 99, 235, 0.15)');
      gradient.addColorStop(1, 'rgba(37, 99, 235, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Факт',
              data: weights,
              borderColor: '#2563eb',
              backgroundColor: gradient,
              borderWidth: 2.5,
              pointRadius: 0,
              pointHoverRadius: 5,
              pointHoverBackgroundColor: '#2563eb',
              pointHoverBorderColor: '#ffffff',
              pointHoverBorderWidth: 2,
              tension: 0.35,
              fill: true
            },
            {
              label: 'Тренд',
              data: smaValues,
              borderColor: '#059669',
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 0,
              borderDash: [4, 4],
              tension: 0.35,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              titleColor: '#ffffff',
              bodyColor: '#cbd5e1',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              padding: 10,
              cornerRadius: 12,
              boxPadding: 3
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#64748b', font: { size: 9, family: 'Inter' }, maxTicksLimit: 6 }
            },
            y: {
              grid: { color: 'rgba(0, 0, 0, 0.03)' },
              ticks: { color: '#64748b', font: { size: 9, family: 'Inter' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
