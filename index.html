<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Tracker</title>
  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            bentoBg: '#060812',
            bentoCard: '#101423',
            accentBlue: '#3b82f6',
            accentPurple: '#8b5cf6',
            accentGreen: '#10b981',
            accentRed: '#ef4444',
            mutedGray: '#94a3b8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bentoBg text-white font-sans antialiased min-h-screen pb-16 selection:bg-accentBlue selection:text-white relative overflow-x-hidden">

  <!-- Фоновые градиентные свечения ( Glow эффекты в стиле референса ) -->
  <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute top-1/3 right-10 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Шапка в стиле iOS / Bento -->
  <header class="sticky top-0 z-50 bg-bentoBg/70 backdrop-blur-2xl border-b border-white/5 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center text-base shadow-lg shadow-blue-500/20">🏆</div>
      <h1 class="font-bold text-base tracking-tight text-white/90">Weight Tracker</h1>
    </div>
    <!-- Селектор пользователя -->
    <div id="userSelectorContainer" class="hidden">
      <select id="userSelect" class="bg-white/5 text-xs font-semibold border border-white/10 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white cursor-pointer transition hover:bg-white/10">
        <!-- Заполняется динамически -->
      </select>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-4 relative z-10">

    <!-- Лоадер -->
    <div id="loader" class="flex flex-col items-center justify-center py-32">
      <div class="animate-spin rounded-full h-10 w-10 border-2 border-blue-500 border-t-transparent mb-3 shadow-lg shadow-blue-500/30"></div>
      <p class="text-mutedGray text-xs font-medium tracking-wide">Загрузка данных...</p>
    </div>

    <!-- Ошибка -->
    <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-2xl text-xs font-medium backdrop-blur-xl"></div>

    <!-- Основной дашборд (Bento Grid) -->
    <div id="dashboardContent" class="hidden space-y-4">

      <!-- Карточка 1: Текущий вес и ключевые показатели (Блок Bento) -->
      <div class="bg-bentoCard/80 backdrop-blur-2xl border border-white/10 rounded-[28px] p-6 relative overflow-hidden shadow-2xl">
        <!-- Внутренний подсвет -->
        <div class="absolute -right-12 -top-12 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex justify-between items-start">
          <div>
            <p class="text-[11px] font-bold uppercase tracking-widest text-mutedGray">Текущий вес</p>
            <p id="currWeight" class="text-4xl font-extrabold tracking-tight mt-1.5 text-white">-</p>
          </div>
          <span id="currDiffBadge" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-white/5">--</span>
        </div>

        <div class="grid grid-cols-3 gap-3 mt-6 pt-5 border-t border-white/5">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-mutedGray">Тренд (SMA 7)</p>
            <p id="trendWeight" class="text-sm font-bold text-blue-400 mt-1">-</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-mutedGray">Старт</p>
            <p id="startWeight" class="text-sm font-bold text-white/90 mt-1">-</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-mutedGray">Цель</p>
            <p id="targetWeight" class="text-sm font-bold text-emerald-400 mt-1">-</p>
          </div>
        </div>
      </div>

      <!-- Карточка 2: График и прогноз (Блок Bento) -->
      <div class="bg-bentoCard/80 backdrop-blur-2xl border border-white/10 rounded-[28px] p-6 shadow-2xl relative overflow-hidden">
        <div class="flex justify-between items-center mb-5">
          <div>
            <h2 class="text-sm font-bold tracking-tight text-white">Динамика и тренд</h2>
            <p class="text-[11px] text-mutedGray mt-0.5">Фактические замеры и линия скользящего среднего</p>
          </div>
          <div class="flex items-center space-x-3 text-[11px] font-medium text-mutedGray">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500 inline-block shadow-[0_0_8px_#3b82f6]"></span> Факт</span>
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 inline-block shadow-[0_0_8px_#34d399]"></span> Тренд</span>
          </div>
        </div>

        <!-- Область графика -->
        <div class="relative w-full h-[260px]">
          <canvas id="weightChart"></canvas>
        </div>

        <!-- Подвал карточки: Прогресс и дата достижения цели -->
        <div class="mt-5 pt-4 border-t border-white/5 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs">
          <div id="progressText" class="font-medium text-mutedGray">
            Выполнение цели: <span class="text-white font-bold">--%</span>
          </div>
          <div id="goalEtaText" class="font-medium text-mutedGray bg-white/5 px-3 py-1 rounded-xl border border-white/5">
            🎯 Прогноз цели: <span class="text-emerald-400 font-bold">--</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // ⚠️ Вставьте ссылку на ваше развернутое веб-приложение Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      fetchData();
    });

    function fetchData() {
      const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "";
      const url = `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(initData)}&callback=handleData`;

      const script = document.createElement('script');
      script.src = url;
      script.onerror = () => {
        showError("Не удалось подключиться к серверу скрипта.");
      };
      document.body.appendChild(script);
    }

    window.handleData = function(response) {
      document.getElementById('loader').classList.add('hidden');

      if (response.error) {
        showError(response.message || "Ошибка авторизации.");
        return;
      }

      globalData = response;
      const userIds = Object.keys(globalData);

      if (userIds.length === 0) {
        showError("В базе данных нет записей.");
        return;
      }

      const userSelect = document.getElementById('userSelect');
      userSelect.innerHTML = '';
      
      userIds.forEach(uid => {
        const user = globalData[uid];
        const opt = document.createElement('option');
        opt.value = uid;
        opt.textContent = user.name;
        userSelect.appendChild(opt);
      });

      if (userIds.length > 1) {
        document.getElementById('userSelectorContainer').classList.remove('hidden');
      }

      let defaultUid = userIds[0];
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        const tgId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        if (globalData[tgId]) defaultUid = tgId;
      }

      userSelect.value = defaultUid;
      activeUserId = defaultUid;

      userSelect.addEventListener('change', (e) => {
        activeUserId = e.target.value;
        renderDashboard(globalData[activeUserId]);
      });

      document.getElementById('dashboardContent').classList.remove('hidden');
      renderDashboard(globalData[activeUserId]);
    };

    function showError(msg) {
      document.getElementById('loader').classList.add('hidden');
      const errBox = document.getElementById('errorBox');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    function calculateSMA(entries, windowSize = 7) {
      return entries.map((entry, index, arr) => {
        const start = Math.max(0, index - windowSize + 1);
        const subset = arr.slice(start, index + 1);
        const sum = subset.reduce((acc, curr) => acc + curr.weight, 0);
        return parseFloat((sum / subset.length).toFixed(1));
      });
    }

    // Расчет даты достижения целевого веса
    function calculateGoalETA(entries, target, currentWeight) {
      if (!target || entries.length < 2) return "Не задана цель";
      
      // Берем последние до 14 записей для оценки свежего темпа
      const recent = entries.slice(-14);
      const first = recent[0];
      const last = recent[recent.length - 1];
      const daysDiff = (last.timestamp - first.timestamp) / (1000 * 60 * 60 * 24);
      
      if (daysDiff <= 0) return "Расчет...";
      const weightDiff = last.weight - first.weight; // кг за период (минус если худеет)
      const ratePerDay = weightDiff / daysDiff; // кг в день
      
      // Если вес идет не в ту сторону
      if (ratePerDay >= 0 && currentWeight > target) return "Нужен дефицит веса";
      if (ratePerDay <= 0 && currentWeight < target) return "Нужен профицит веса";
      if (ratePerDay === 0) return "Вес стабилен";

      const remainingWeight = target - currentWeight; // отрицательное число при похудении
      const daysToTarget = remainingWeight / ratePerDay; // дней до цели
      
      if (daysToTarget < 0 || isNaN(daysToTarget) || !isFinite(daysToTarget)) return "Недоступно";
      
      const targetDate = new Date(Date.now() + daysToTarget * 24 * 60 * 60 * 1000);
      return targetDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderDashboard(userData) {
      if (!userData || !userData.entries || userData.entries.length === 0) {
        showError("У пользователя нет данных о весе.");
        return;
      }

      const entries = userData.entries;
      const latest = entries[entries.length - 1];
      const prev = entries.length > 1 ? entries[entries.length - 2] : latest;
      const start = userData.start || entries[0].weight;
      const target = userData.target;

      document.getElementById('currWeight').textContent = `${latest.weight} кг`;
      document.getElementById('startWeight').textContent = `${start} кг`;
      document.getElementById('targetWeight').textContent = target ? `${target} кг` : "—";

      // Бейдж изменения за сутки
      const diffDay = parseFloat((latest.weight - prev.weight).toFixed(1));
      const badge = document.getElementById('currDiffBadge');
      if (diffDay < 0) {
        badge.textContent = `${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
      } else if (diffDay > 0) {
        badge.textContent = `+${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/20";
      } else {
        badge.textContent = `Без изменений`;
        badge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-white/5 text-mutedGray border border-white/5";
      }

      const smaValues = calculateSMA(entries);
      document.getElementById('trendWeight').textContent = `${smaValues[smaValues.length - 1]} кг`;

      // Процент выполнения цели
      if (target) {
        const totalDist = Math.abs(target - start);
        const currentDist = Math.abs(latest.weight - start);
        let pct = totalDist > 0 ? Math.round((currentDist / totalDist) * 100) : 100;
        pct = Math.max(0, Math.min(100, pct));
        document.getElementById('progressText').innerHTML = `Выполнение цели: <span class="text-white font-bold">${pct}%</span>`;
        
        // Дата достижения цели
        const etaDateStr = calculateGoalETA(entries, target, latest.weight);
        document.getElementById('goalEtaText').innerHTML = `🎯 Прогноз цели: <span class="text-emerald-400 font-bold">${etaDateStr}</span>`;
      } else {
        document.getElementById('progressText').innerHTML = `Цель не установлена (<code class="text-blue-400">/goal</code>)`;
        document.getElementById('goalEtaText').innerHTML = `🎯 Прогноз цели: <span class="text-mutedGray">нет цели</span>`;
      }

      const labels = entries.map(e => e.dateStr);
      const weights = entries.map(e => e.weight);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('weightChart').getContext('2d');
      
      // Создаем градиент для заливки под графиком
      const gradient = ctx.createLinearGradient(0, 0, 0, 260);
      gradient.addColorStop(0, 'rgba(59, 130, 246, 0.25)');
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Факт',
              data: weights,
              borderColor: '#3b82f6',
              backgroundColor: gradient,
              borderWidth: 3,
              pointRadius: 0,         // УБРАНЫ КВАДРАТИКИ/ТОЧКИ НА ДАТАХ
              pointHoverRadius: 6,    // Появляется аккуратная точка только при наведении
              pointHoverBackgroundColor: '#3b82f6',
              pointHoverBorderColor: '#ffffff',
              pointHoverBorderWidth: 2,
              tension: 0.4,           // Плавная кривая
              fill: true
            },
            {
              label: 'Тренд',
              data: smaValues,
              borderColor: '#34d399',
              borderWidth: 2.5,
              pointRadius: 0,         // Без точек на тренде
              pointHoverRadius: 0,
              borderDash: [5, 5],     // Пунктирная линия тренда
              tension: 0.4,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: 'rgba(18, 22, 36, 0.9)',
              titleColor: '#ffffff',
              bodyColor: '#cbd5e1',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              padding: 12,
              cornerRadius: 14,
              boxPadding: 4
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#64748b', font: { size: 10, family: 'Inter' } }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.03)' },
              ticks: { color: '#64748b', font: { size: 10, family: 'Inter' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
