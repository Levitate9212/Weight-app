<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Фитнес Трекер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #08090a;
      --card-bg: #111317;
      --text-main: #f3f4f6;
      --text-muted: #8b929a;
      --border-color: rgba(255, 255, 255, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 14px;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 12px;
    }

    /* Карточки атлетов */
    .cards-grid {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .user-card {
      background: var(--card-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, border-color 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
      opacity: 0.38;
      filter: grayscale(0.3);
    }
    .user-card:hover {
      transform: translateY(-2px);
    }
    .user-card.active {
      opacity: 1;
      filter: none;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .user-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .weight-display {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 2px;
    }
    .weight-display span {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 3px;
    }

    /* Прогресс-бар */
    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      height: 5px;
      overflow: hidden;
      margin: 8px 0 6px 0;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.6s ease;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Холст графика */
    .chart-card {
      background: var(--card-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 16px 14px 12px 10px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 260px;
    }

    .chart-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chart-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.2px;
      color: #e5e7eb;
    }

    /* Табы периодов */
    .filter-tabs {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
    }
    .tab-btn:focus {
      outline: none;
    }
    .tab-btn.active {
      background: #1e2229;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 180px;
    }

    #status-msg {
      text-align: center;
      margin-top: 60px;
      font-size: 15px;
      color: var(--text-muted);
    }
    .error-icon { font-size: 40px; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="status-msg">Синхронизация данных... ⏳</div>

    <div id="content" style="display: none;">
      <div id="cards-container" class="cards-grid"></div>

      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">Динамика веса</span>
          
          <div id="period-tabs" class="filter-tabs">
            <button class="tab-btn" data-period="7d" onclick="switchPeriod('7d')">7</button>
            <button class="tab-btn" data-period="14d" onclick="switchPeriod('14d')">14</button>
            <button class="tab-btn" data-period="30d" onclick="switchPeriod('30d')">30</button>
            <button class="tab-btn" data-period="90d" onclick="switchPeriod('90d')">90</button>
            <button class="tab-btn" data-period="180d" onclick="switchPeriod('180d')">180</button>
            <button class="tab-btn active" data-period="all" onclick="switchPeriod('all')">Все время</button>
          </div>
        </div>

        <div class="chart-wrapper">
          <canvas id="weightChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let rawData = null;
    let chartInstance = null;
    let selectedUsers = new Set();
    let currentPeriod = 'all';

    // Мягкая палитра: фисташковый лайм, небесный аквамарин, пастельный коралл
    const USER_COLORS = [
      { border: '#9fe62e', glow: 'rgba(159, 230, 46, 0.16)' },
      { border: '#38bdf8', glow: 'rgba(56, 189, 248, 0.16)' },
      { border: '#fb7185', glow: 'rgba(251, 113, 133, 0.16)' }
    ];

    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const cb = 'gasCb_' + Math.round(100000 * Math.random());
        let script;
        const timeout = setTimeout(() => { cleanup(); reject(new Error('Таймаут')); }, 10000);

        function cleanup() {
          if (window[cb]) delete window[cb];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          clearTimeout(timeout);
        }

        window[cb] = (data) => { cleanup(); resolve(data); };
        script = document.createElement('script');
        script.src = `${url}&callback=${cb}`;
        script.onerror = () => { cleanup(); reject(new Error('Ошибка загрузки')); };
        document.body.appendChild(script);
      });
    }

    async function loadData() {
      const statusEl = document.getElementById('status-msg');
      const contentEl = document.getElementById('content');
      const userId = tg?.initDataUnsafe?.user?.id;

      if (!userId) {
        statusEl.innerHTML = `<span class="error-icon">🔒</span><b>Приватный доступ</b><br>Запустите через Telegram-бота.`;
        return;
      }

      const cacheKey = 'wt_data_' + userId;
      const cachedRaw = localStorage.getItem(cacheKey);

      if (cachedRaw) {
        try {
          rawData = JSON.parse(cachedRaw);
          selectedUsers.clear();
          for (const uid in rawData) selectedUsers.add(uid);

          statusEl.style.display = 'none';
          contentEl.style.display = 'flex';
          renderCards(rawData);
          renderChart();
        } catch (e) {}
      }

      try {
        const data = await fetchJSONP(`${API_URL}?userId=${userId}`);
        if (data.error) {
          if (!cachedRaw) statusEl.innerHTML = `<span class="error-icon">⛔️</span>${data.message || 'Ошибка доступа'}`;
          return;
        }

        rawData = data;
        localStorage.setItem(cacheKey, JSON.stringify(data));

        if (selectedUsers.size === 0) {
          for (const uid in data) selectedUsers.add(uid);
        }

        statusEl.style.display = 'none';
        contentEl.style.display = 'flex';
        renderCards(data);
        renderChart();

      } catch (err) {
        if (!cachedRaw) {
          statusEl.innerHTML = `<span class="error-icon">⚠️</span>Ошибка подключения к базе данных.`;
        }
      }
    }

    function toggleUser(uid) {
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

      if (selectedUsers.has(uid)) {
        if (selectedUsers.size > 1) {
          selectedUsers.delete(uid);
        } else {
          for (const id in rawData) selectedUsers.add(id);
        }
      } else {
        selectedUsers.add(uid);
      }

      updateCardsVisual();
      renderChart();
    }

    function updateCardsVisual() {
      document.querySelectorAll('.user-card').forEach(card => {
        const uid = card.dataset.uid;
        const color = card.dataset.color;
        const glow = card.dataset.glow;
        const isActive = selectedUsers.has(uid);

        card.classList.toggle('active', isActive);
        if (isActive) {
          card.style.borderColor = color;
          card.style.boxShadow = `0 4px 16px ${glow}`;
        } else {
          card.style.borderColor = 'rgba(255, 255, 255, 0.05)';
          card.style.boxShadow = 'none';
        }
      });
    }

    function switchPeriod(periodKey) {
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
      currentPeriod = periodKey;

      document.querySelectorAll('#period-tabs .tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.period === String(periodKey));
      });

      renderChart();
    }

    function renderCards(users) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      let colorIdx = 0;

      for (const uid in users) {
        const u = users[uid];
        if (!u.entries || u.entries.length === 0) continue;

        const colorCfg = USER_COLORS[colorIdx % USER_COLORS.length];
        const currentWeight = u.entries[u.entries.length - 1].weight;
        const startWeight = u.start || u.entries[0].weight;
        const target = u.target;

        let percent = 0;
        let diffStr = '';

        if (target) {
          const isLosing = startWeight >= target;
          const totalDist = Math.abs(startWeight - target);
          const doneDist = isLosing ? (startWeight - currentWeight) : (currentWeight - startWeight);
          percent = totalDist > 0 ? (doneDist / totalDist) * 100 : 100;
          percent = Math.max(0, Math.min(100, Math.round(percent)));

          const leftKg = Math.abs(currentWeight - target).toFixed(1);
          diffStr = currentWeight === target ? '🎉 Цель взята!' : `Осталось ${leftKg} кг`;
        }

        const card = document.createElement('div');
        card.className = 'user-card';
        card.dataset.uid = uid;
        card.dataset.color = colorCfg.border;
        card.dataset.glow = colorCfg.glow;
        card.onclick = () => toggleUser(uid);

        card.innerHTML = `
          <div class="card-top">
            <span class="user-name">
              <span class="status-dot" style="background: ${colorCfg.border}; box-shadow: 0 0 6px ${colorCfg.glow};"></span>
              ${u.name}
            </span>
            <span style="font-size: 11px; color: var(--text-muted);">${target ? 'Цель: ' + target + ' кг' : 'Без цели'}</span>
          </div>
          <div class="weight-display">${currentWeight}<span>кг</span></div>
          ${target ? `
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percent}%; background: ${colorCfg.border};"></div>
            </div>
            <div class="card-footer">
              <span>${diffStr}</span>
              <span>Прогресс: <b>${percent}%</b></span>
            </div>
          ` : `
            <div class="card-footer" style="margin-top: 6px;">
              <span>Команда: /цель [кг]</span>
            </div>
          `}
        `;
        container.appendChild(card);
        colorIdx++;
      }

      updateCardsVisual();
    }

    function renderChart() {
      const ctx = document.getElementById('weightChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      let maxTs = 0;
      for (const uid in rawData) {
        if (rawData[uid].entries) {
          rawData[uid].entries.forEach(e => {
            if (e.timestamp > maxTs) maxTs = e.timestamp;
          });
        }
      }
      if (maxTs === 0) maxTs = Date.now();

      let minTs = 0;
      if (currentPeriod === '7d')   minTs = maxTs - 7 * 86400000;
      if (currentPeriod === '14d')  minTs = maxTs - 14 * 86400000;
      if (currentPeriod === '30d')  minTs = maxTs - 30 * 86400000;
      if (currentPeriod === '90d')  minTs = maxTs - 90 * 86400000;
      if (currentPeriod === '180d') minTs = maxTs - 180 * 86400000;

      const dateEntries = [];
      for (const uid in rawData) {
        if (selectedUsers.has(uid) && rawData[uid].entries) {
          rawData[uid].entries.forEach(e => {
            if (currentPeriod === 'all' || e.timestamp >= minTs) {
              dateEntries.push({ dateStr: e.dateStr, ts: e.timestamp });
            }
          });
        }
      }
      dateEntries.sort((a, b) => a.ts - b.ts);

      const labels = [];
      const seenDates = new Set();
      dateEntries.forEach(d => {
        if (!seenDates.has(d.dateStr)) {
          seenDates.add(d.dateStr);
          labels.push(d.dateStr);
        }
      });

      const datasets = [];
      let cIdx = 0;

      for (const uid in rawData) {
        if (!selectedUsers.has(uid)) {
          cIdx++;
          continue;
        }

        const u = rawData[uid];
        if (!u.entries || u.entries.length === 0) {
          cIdx++;
          continue;
        }

        const colorCfg = USER_COLORS[cIdx % USER_COLORS.length];

        datasets.push({
          label: u.name,
          data: labels.map(l => {
            const match = u.entries.find(e => e.dateStr === l);
            return match ? match.weight : null;
          }),
          borderColor: colorCfg.border,
          borderWidth: 3.5,
          borderCapStyle: 'round',
          borderJoinStyle: 'round',
          tension: 0.42,
          fill: false,
          pointRadius: 0,
          pointHoverRadius: 6,
          pointHoverBackgroundColor: colorCfg.border,
          pointHoverBorderColor: '#ffffff',
          pointHoverBorderWidth: 2,
          spanGaps: true
        });

        if (selectedUsers.size === 1 && u.target) {
          datasets.push({
            label: `Цель (${u.target} кг)`,
            data: labels.map(() => u.target),
            borderColor: 'rgba(255, 255, 255, 0.22)',
            borderDash: [5, 5],
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false
          });
        }

        cIdx++;
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          resizeDelay: 0,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#16191f',
              titleColor: '#8b929a',
              bodyColor: '#ffffff',
              padding: 11,
              cornerRadius: 10,
              borderColor: 'rgba(255, 255, 255, 0.08)',
              borderWidth: 1,
              titleFont: { size: 11, weight: '600' },
              bodyFont: { size: 13, weight: '700' },
              usePointStyle: true,
              boxWidth: 6,
              boxHeight: 6,
              boxPadding: 6,
              callbacks: {
                labelColor: function(ctx) {
                  const col = ctx.dataset.borderColor || '#ffffff';
                  return {
                    borderColor: col,
                    backgroundColor: col,
                    borderWidth: 0,
                    borderRadius: 3
                  };
                },
                label: (ctx) => ` ${ctx.dataset.label}: ${Number(Number(ctx.parsed.y).toFixed(1))} кг`
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(255, 255, 255, 0.04)',
                drawBorder: false
              },
              ticks: {
                color: '#555d67',
                font: { size: 11, weight: '600' },
                padding: 8
              }
            },
            y: {
              grid: {
                display: false,
                drawBorder: false
              },
              ticks: {
                color: '#555d67',
                font: { size: 11, weight: '600' },
                padding: 10,
                callback: (val) => Number(Number(val).toFixed(1)) + ' кг'
              },
              grace: selectedUsers.size === 1 ? '15%' : '8%'
            }
          }
        }
      });
    }

    window.addEventListener('resize', () => {
      if (chartInstance) chartInstance.resize();
    });

    loadData();
  </script>
</body>
</html>
