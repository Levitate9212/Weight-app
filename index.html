<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weight Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =====================================================================
       Стиль «Спорт-ночь»: графит, один лаймовый акцент, узкие жирные цифры.
       Тёмный всегда — так задумано, медали на графите смотрятся сильнее.
       ===================================================================== */
    :root {
      --bg:      #121315;   /* графит */
      --panel:   #1B1C1F;   /* карточки */
      --panel2:  #24262A;
      --ink:     #F2F3F0;
      --muted:   #83868D;
      --rule:    #26282C;
      --volt:    #C6FF3D;   /* лайм */
      --volt-dim: rgba(198, 255, 61, .12);
      --volt-ink:#121315;
      --down:    #C6FF3D;   /* вес ушёл */
      --up:      #FF7A66;   /* вес прибавился */
      --num:     'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
      --display: 'Golos Text', system-ui, -apple-system, sans-serif;
      --text:    'Golos Text', system-ui, -apple-system, sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      touch-action: pan-y;
      overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
    .hidden { display: none !important; }
    .num { font-family: var(--num); font-variant-numeric: tabular-nums; }

    /* ---------- ЗАСТАВКА ---------- */
    #splash {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #splash.gone { opacity: 0; visibility: hidden; }
    .sp-mark {
      font-family: var(--num); font-weight: 800; text-transform: uppercase;
      font-size: clamp(64px, 21vw, 86px); line-height: .84; letter-spacing: .01em;
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }
    .sp-mark span { display: block; }
    .sp-mark span:last-child { color: var(--volt); animation: spIn .7s cubic-bezier(.2, .8, .2, 1) .1s both; }
    .sp-mark span:first-child { animation: spIn .7s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes spIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    /* ритм-полоски: волна бежит слева направо, один проход = минимум показа */
    .sp-bars { display: flex; gap: 5px; align-items: flex-end; height: 34px; margin-top: 26px; }
    .sp-bars i { width: 7px; height: 100%; border-radius: 2px; background: var(--rule); transform-origin: bottom; transform: scaleY(.25);
      animation: spBar 1.5s ease-in-out infinite; animation-delay: calc(var(--k) * 50ms); }
    @keyframes spBar {
      0%, 100% { transform: scaleY(.25); background: var(--rule); }
      25% { transform: scaleY(1); background: var(--volt); }
      50%, 99% { transform: scaleY(.25); background: var(--rule); }
    }
    .splash-note {
      position: absolute; left: 24px; right: 24px; bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      text-align: center; font-size: 15px; line-height: 1.35; color: var(--muted);
      animation: spNote .6s ease .35s both;
      transition: opacity .3s ease, transform .4s ease;
    }
    @keyframes spNote { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #splash.gone .sp-mark { transform: scale(1.06); }
    #splash.gone .splash-note { opacity: 0; transform: translateY(6px); }
    @media (prefers-reduced-motion: reduce) {
      .sp-bars i { animation: none; transform: none; }
      .sp-bars i:nth-child(-n+4) { background: var(--volt); }
    }

    /* ---------- КАРКАС ---------- */
    /* Вся страница = ровно высота окна Telegram; график забирает остаток */
    main {
      max-width: 440px; margin: 0 auto;
      min-height: var(--tg-viewport-stable-height, 100dvh);
      height: var(--tg-viewport-stable-height, 100dvh);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
    }
    #dashboard { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #dashboard > * { flex-shrink: 0; }
    #dashboard > .chart-panel { flex: 1 1 auto; }

    /* Переключатель людей: по центру, две «таблетки» */
    .who { display: flex; justify-content: center; gap: 8px; margin-bottom: 4px; }
    #dashboard { position: relative; }

    /* ===== Итоги месяца: кружок и «сторис» по неделям ===== */
    #storyRing { position: absolute; left: 0; top: -2px; width: 38px; height: 38px; border-radius: 50%; padding: 2px; z-index: 2;
      background: conic-gradient(var(--volt), #6FE0B8, var(--volt)); }
    #storyRing.seen { background: var(--rule); }
    #storyRing span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--bg); border: 2px solid var(--bg);
      font-family: var(--text); font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--ink); letter-spacing: .02em; }
    #story { position: fixed; inset: 0; z-index: 45; background: #0D0E10; color: var(--ink); display: flex; flex-direction: column;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      opacity: 0; pointer-events: none; transform: scale(.96); transition: opacity .25s ease, transform .3s cubic-bezier(.3,.8,.3,1); touch-action: none; user-select: none; -webkit-user-select: none; }
    #story.open { opacity: 1; pointer-events: auto; transform: none; }
    .st-bars { display: flex; gap: 4px; }
    .st-bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(242,243,240,.22); overflow: hidden; }
    .st-bars i b { display: block; height: 100%; width: 0; background: var(--ink); }
    .st-bars i.done b { width: 100%; }
    .st-head { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .st-head .t { font-size: 13px; font-weight: 600; color: var(--muted); }
    .st-head .t b { color: var(--ink); }
    .st-x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); font-size: 22px; line-height: 1; }
    .st-page { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 10px 4px; }
    .st-page.in > * { animation: stIn .5s cubic-bezier(.3,.8,.3,1) both; }
    .st-page.in > *:nth-child(2) { animation-delay: .07s; } .st-page.in > *:nth-child(3) { animation-delay: .14s; }
    .st-page.in > *:nth-child(4) { animation-delay: .21s; } .st-page.in > *:nth-child(5) { animation-delay: .28s; }
    @keyframes stIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .st-k { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--volt); }
    .st-month { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 12vw, 54px); line-height: .95; text-transform: uppercase; letter-spacing: -.01em; }
    .st-big { font-family: var(--num); font-weight: 800; font-size: 84px; line-height: .9; font-variant-numeric: tabular-nums; }
    .st-big small { font-size: 26px; color: var(--muted); font-weight: 600; }
    .st-big.down { color: var(--down); } .st-big.up { color: var(--up); }
    .st-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .st-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .st-chip { background: var(--panel); border-radius: 12px; padding: 9px 12px; font-size: 13px; color: var(--muted); }
    .st-chip b { display: block; font-family: var(--num); font-size: 24px; color: var(--ink); font-weight: 700; line-height: 1.05; }
    .st-chart { background: var(--panel); border-radius: 18px; padding: 12px; }
    .st-chart svg { display: block; width: 100%; height: 120px; overflow: visible; }
    .st-chart .ln { fill: none; stroke: var(--volt); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .st-page.in .st-chart .ln { animation: stDraw 1.1s .25s ease-out both; }
    @keyframes stDraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
    .st-chart text { fill: var(--muted); font-size: 11px; font-family: var(--text); }
    .st-medals { display: flex; gap: 10px; flex-wrap: wrap; }
    .st-medals .md { width: 76px; text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.2; }
    .st-medals svg { width: 76px; height: 76px; display: block; margin-bottom: 4px; }
    .st-coach { position: relative; background: var(--panel); border-radius: 16px; padding: 14px 16px 14px 46px; font-size: 16px; line-height: 1.4; min-height: 52px; }
    .st-coach::before { content: ""; position: absolute; left: 14px; top: 15px; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #E9FF9E, var(--volt) 60%, #8FBF1A); }
    .st-coach.wait { color: transparent; }
    .st-coach.wait::after { content: ""; position: absolute; left: 46px; right: 16px; top: 18px; height: 12px; border-radius: 6px;
      background: linear-gradient(90deg, var(--panel2), #34373D, var(--panel2)); background-size: 200% 100%; animation: stShim 1.2s linear infinite; }
    @keyframes stShim { to { background-position: -200% 0; } }
    .st-close { align-self: stretch; height: 52px; border-radius: 16px; background: var(--volt); color: #121315; font-weight: 700; font-size: 16px; }
    @media (prefers-reduced-motion: reduce) { .st-page.in > *, .st-page.in .st-chart .ln { animation: none; } }
    .who-name {
      font-size: 14px; font-weight: 600; padding: 7px 18px; border-radius: 999px;
      color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule);
      transition: background .25s ease, color .25s ease, box-shadow .25s ease;
      max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .who-name.active { background: var(--ink); color: var(--bg); box-shadow: inset 0 0 0 1px var(--ink); }

    /* Вес */
    .hero { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px; gap: 10px; }
    .cap { font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
    .big { display: flex; align-items: baseline; gap: 6px; line-height: .86; margin-top: 6px; white-space: nowrap; }
    .big b { font-family: var(--num); font-weight: 700; font-size: clamp(70px, 23vw, 92px); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    .big i { font-style: normal; font-family: var(--num); font-size: 22px; font-weight: 600; color: var(--muted); }
    .chg { text-align: right; padding-bottom: 6px; flex-shrink: 0; }
    #currDiffBadge { font-family: var(--num); font-size: 30px; font-weight: 600; line-height: 1; display: flex; align-items: center; gap: 3px; justify-content: flex-end; white-space: nowrap; }
    #currDiffBadge svg { width: 18px; height: 18px; }
    #currDiffBadge.down { color: var(--down); } #currDiffBadge.up { color: var(--up); } #currDiffBadge.flat { color: var(--muted); }
    #diffGap { font-size: 12px; color: var(--muted); display: block; margin-top: 4px; }

    /* Путь к цели: 30 сегментов */
    .goal { margin-top: 16px; }
    .goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .goal-top b { font-family: var(--num); font-size: 18px; color: var(--ink); font-weight: 600; letter-spacing: .02em; }
    .ticks { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; margin-top: 8px; }
    .ticks i { height: 10px; border-radius: 1.5px; background: var(--panel2); transition: background .2s ease; }
    .ticks i.on { background: var(--volt); }
    .eta { margin-top: 7px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .eta b { color: var(--ink); font-weight: 600; }

    /* Неделя */
    .week-block { margin-top: 12px; overflow: hidden; }
    .week-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; min-height: 22px; }
    #todayBtn { font-size: 12.5px; font-weight: 600; color: var(--volt); }
    #todayBtn.hidden { display: block; visibility: hidden; }
    #mtBtn { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 2px 8px 2px 6px; border-radius: 8px; transition: color .2s ease, background .2s ease; }
    #mtBtn svg { width: 15px; height: 15px; }
    #mtBtn.on { color: var(--volt); background: var(--volt-dim); }

    /* Восхождение: гора под графиком */
    .mt-panel { margin-top: 10px; background: var(--panel); border-radius: 20px; overflow: hidden; position: relative; height: 172px; transition: height .35s cubic-bezier(.3,.8,.3,1), margin .35s ease, opacity .25s ease; }
    .mt-panel.closed { height: 0; margin-top: 0; opacity: 0; }
    .mt-panel svg { display: block; width: 100%; height: 100%; }
    .mt-info { position: absolute; left: 14px; top: 10px; pointer-events: none; }
    .mt-info.r { left: auto; top: auto; right: 14px; bottom: 9px; text-align: right; }
    .mt-info .k { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .mt-info .v { font-family: var(--num); font-size: 24px; font-weight: 700; line-height: 1.05; color: var(--ink); }
    .mt-info .v small { font-size: 14px; color: var(--muted); font-weight: 600; }
    .mt-next { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .mt-next b { color: var(--ink); font-weight: 600; }
    .mt-open .chart-box { min-height: 96px; }
    /* на невысоких экранах гора встаёт на место графика, чтобы оба не сплющились */
    @media (max-height: 780px) {
      .mt-open #dashboard > .chart-panel { display: none; }
      .mt-open .mt-panel { flex: 1 1 auto; height: auto; min-height: 140px; }
      .mt-panel.closed { flex: 0 0 0; min-height: 0; }
    }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; touch-action: pan-y; }
    .day {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 7px 0 6px; border-radius: 12px; background: var(--panel);
      transition: background .2s ease, color .2s ease;
    }
    .day .dw { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .day .dn { font-family: var(--num); font-weight: 600; font-size: 20px; line-height: 1.1; }
    .day .dd { font-family: var(--num); font-size: 13px; font-weight: 600; min-height: 15px; color: var(--muted); }
    .day.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
    .day.empty .dn { color: #55585E; }
    .day.future { opacity: .4; }
    .day.today .dw { color: var(--ink); }
    .day.today .dw::after { content: ""; display: inline-block; width: 4px; height: 4px; margin-left: 3px; border-radius: 50%; background: var(--volt); vertical-align: 2px; }
    .day.sel { background: var(--volt); color: var(--volt-ink); box-shadow: none; }
    .day.sel .dw, .day.sel .dd { color: var(--volt-ink); opacity: .7; }
    .day.sel.today .dw::after { background: var(--volt-ink); }
    .dd.down { color: var(--down); } .dd.up { color: var(--up); }
    .days { will-change: transform; }
    #emptyWeekNote { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }

    /* Плашки: тренировки и серия */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .st { background: var(--panel); border-radius: 16px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; text-align: left; }
    .st .k { font-size: 12px; color: var(--muted); }
    .st .v { font-family: var(--num); font-size: 28px; font-weight: 700; line-height: 1; margin-top: 3px; }
    .st .v small { font-size: 16px; color: var(--muted); font-weight: 600; }
    .st svg { width: 22px; height: 22px; color: var(--volt); flex-shrink: 0; }
    .st:active { opacity: .7; }

    /* Кнопка достижений */
    .achbtn { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 6px 6px 6px 16px; min-height: 56px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--rule); text-align: left; width: 100%; }
    .achbtn .l { min-width: 0; }
    .achbtn .l b { display: block; font-size: 15px; font-weight: 600; }
    .achbtn .l small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .achbtn .r { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .achbtn .n { font-family: var(--num); font-size: 20px; color: var(--muted); }
    .achbtn .pill { width: 42px; height: 42px; border-radius: 12px; background: var(--volt); color: var(--volt-ink); display: grid; place-items: center; }
    .achbtn:active { opacity: .75; }

    /* Нижняя карточка с описанием медали */
    #sheetBack {
      position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 18, .45);
      opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease;
    }
    #sheetBack.open { opacity: 1; visibility: visible; }
    #sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      max-width: 460px; margin: 0 auto;
      background: var(--bg); border-radius: 16px 16px 0 0;
      padding: 8px 20px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
      touch-action: none;
    }
    #sheet.open { transform: translateY(0); }
    #sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto 14px; }
    #sheet h3 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; }
    #sheet .s-desc { font-size: 15px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    #sheet .s-lane { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; margin: 14px 0 4px; }
    #sheet .s-lane i { display: block; height: 100%; background: var(--volt); }
    #sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin-top: 12px; font-size: 15px; }
    #sheet dt { color: var(--muted); }
    #sheet dd { text-align: right; font-weight: 600; }
    #sheet dd.need { color: var(--ink); font-weight: 700; }
    /* ===== Экран достижений ===== */
    .ach-head { cursor: pointer; }
    .ach-head:active { opacity: .6; }
    .ach-head span::after { content: " ›"; color: var(--muted); }
    .screen {
      position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateX(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }
    .screen.open { transform: translateX(0); }
    .screen-inner { max-width: 460px; margin: 0 auto; padding: 14px 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
    .screen-top { display: flex; align-items: baseline; justify-content: space-between; }
    .screen-top h2 { font-family: var(--display); font-weight: 700; font-size: 30px; }
    .screen-top span { color: var(--muted); font-size: 14px; }
    .back-btn { font-size: 15px; font-weight: 600; padding: 4px 0 10px; color: var(--ink); }
    html.in-tg .back-btn { display: none; }               /* в Telegram — системная «Назад» */
    .m-sec h3 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 20px 0 8px; display: flex; gap: 8px; align-items: center; }
    .m-sec h3 small { font-family: var(--text); font-weight: 500; font-size: 13px; color: var(--muted); }
    .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 6px; }
    .m-tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
    .m-tile svg { width: 100%; max-width: 104px; aspect-ratio: 1; filter: drop-shadow(0 5px 7px rgba(23,33,43,.22)); transition: transform .15s ease; }
    .m-tile:active svg { transform: scale(.94); }
    /* блик от наклона телефона на полученных медалях витрины (включается, только когда есть данные датчика) */
    .m-tile .mw { position: relative; display: block; width: 100%; max-width: 104px; }
    .m-tile .mw svg { max-width: none; }
    .tilt-on .m-tile:not(.locked) .mw::after { content: ""; position: absolute; inset: 7%; border-radius: 50%; pointer-events: none;
      background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.34) 48%, rgba(255,255,255,.08) 53%, transparent 62%);
      background-size: 260% 260%; background-position: calc(50% - var(--tiltX, 0) * 42%) calc(50% - var(--tiltY, 0) * 42%); }
    .m-tile.locked svg { opacity: .8; filter: none; }
    .m-tile b { font-size: 13.5px; line-height: 1.15; }
    .m-tile small { font-size: 12px; color: var(--muted); }
    .m-tile .mini { width: 74px; height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; }
    .m-tile .mini i { display: block; height: 100%; background: var(--volt); }

    /* ===== Медаль крупно (3D-монета) ===== */
    #coinView { z-index: 35; display: flex; flex-direction: column; }
    #coinView .screen-inner { flex: 1; display: flex; flex-direction: column; width: 100%; }
    .stage { flex: 1; min-height: 300px; display: flex; align-items: center; justify-content: center; perspective: 1200px; touch-action: none; position: relative; }
    .coin { position: relative; width: 240px; height: 240px; transform-style: preserve-3d; will-change: transform; }
    .coin .face, .coin .edge { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .coin .face { width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; overflow: hidden; }
    .coin .face svg { width: 100%; height: 100%; display: block; }
    .coin .edge { backface-visibility: visible; -webkit-backface-visibility: visible; }
    .sheen-mask { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none; }
    /* лучистый ободок: лучи не обрезаем кругом, блик — только внутри */
    .coin .face.grand { border-radius: 0; overflow: visible; }
    .coin .face.grand svg { overflow: visible; }
    .coin .face.grand .sheen-mask { inset: 12px; }
    /* по лучам особых медалей бежит отблеск: лучи вспыхивают по очереди, вслед за наклоном и поворотом */
    .ray-glint { position: absolute; inset: -4px; pointer-events: none;
      background: conic-gradient(from var(--ga, 0deg), rgba(255,246,214,.8), rgba(255,246,214,0) 55deg, rgba(255,246,214,0) 305deg, rgba(255,246,214,.8));
      -webkit-mask: radial-gradient(circle, transparent 107px, #000 109px); mask: radial-gradient(circle, transparent 107px, #000 109px); }
    .sheen { position: absolute; top: 0; bottom: 0; left: -100%; width: 300%; will-change: transform;
      background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.28) 48%, rgba(255,255,255,.08) 52%, transparent 60%); }
    .coin-shadow { position: absolute; left: 50%; bottom: 4%; width: 170px; height: 22px; margin-left: -85px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(23,33,43,.28), rgba(23,33,43,0) 70%); }
    html.dark .coin-shadow { background: radial-gradient(ellipse, rgba(0,0,0,.65), rgba(0,0,0,0) 70%); }
    .coin-info { text-align: center; padding-bottom: 6px; }
    .coin-info h3 { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; }
    .coin-info p { color: var(--muted); font-size: 15px; margin-top: 6px; line-height: 1.4; }
    .coin-info .when { color: var(--ink); font-weight: 600; }
    .coin-info .hint { font-size: 13px; margin-top: 10px; }

    /* ===== Вручение новой медали ===== */
    #coinView.award-mode { transform: none; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
    #coinView.award-mode.open { opacity: 1; pointer-events: auto; }
    .coin-info .award-tag { display: none; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--volt-ink); background: var(--volt); padding: 3px 10px 2px; border-radius: 4px;
      margin: 0 auto 10px; width: max-content; }
    .award-btn { display: none; margin: 18px auto 0; min-width: 200px; padding: 13px 22px; border-radius: 10px; border: 0;
      background: var(--volt); color: var(--volt-ink); font: 600 16px var(--text); }
    .award-btn:active { opacity: .8; }
    #coinView.award-mode .coin-info .award-tag, #coinView.award-mode .award-btn { display: block; }
    #coinView.award-mode .back-btn { visibility: hidden; }
    .award-info { opacity: 1; transition: opacity .4s ease, transform .4s ease; }
    #coinView.award-mode .award-info.wait { opacity: 0; transform: translateY(10px); }
    .burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
    .burst .glow { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,194,26,.55), rgba(255,194,26,0) 65%); opacity: 0; }
    .burst .ray { position: absolute; left: -2px; top: -150px; width: 4px; height: 44px; border-radius: 2px; background: var(--volt);
      transform-origin: 2px 150px; opacity: 0; }
    .burst.go .glow { animation: awGlow 1.1s ease-out forwards; }
    .burst.go .ray { animation: awRay .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
    @keyframes awGlow { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
    @keyframes awRay { 0% { opacity: 0; transform: rotate(var(--a)) translateY(60px) scaleY(.3); }
                       30% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-26px) scaleY(1); } }

    #sheet .s-note { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.35; border-top: 1px solid var(--rule); padding-top: 10px; }

    /* График */
    .chart-panel {
      margin-top: 14px; background: var(--panel); border-radius: 20px; padding: 10px 12px 8px;
      min-height: 0; display: flex; flex-direction: column;
    }
    .periods { display: flex; gap: 2px; margin-bottom: 4px; flex-shrink: 0; }
    .period-btn { flex: 1; padding: 6px 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background .2s ease, color .2s ease; }
    .period-btn.active { background: var(--volt-dim); color: var(--volt); }
    .chart-box { position: relative; flex: 1; min-height: 130px; }
    #chartNote { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 14px; color: var(--muted); padding: 0 12px; }

    /* Невысокие экраны: ужимаем, чтобы график сохранил место */
    @media (max-height: 760px) {
      .hero { margin-top: 8px; }
      .big b { font-size: clamp(60px, 19vw, 76px); }
      .goal { margin-top: 12px; }
      .chart-panel { margin-top: 10px; }
      .day { padding: 5px 0 4px; }
      .st { padding: 8px 12px; }
      .st .v { font-size: 24px; }
      .achbtn { min-height: 48px; }
      .achbtn .pill { width: 36px; height: 36px; }
    }
    @media (max-height: 660px) {
      .eta { display: none; }
      .chart-box { min-height: 100px; }
    }
    /* Очень низкие экраны: график фиксированной высоты, страница прокручивается */
    @media (max-height: 600px) {
      main { height: auto; }
      .chart-box { flex: none; height: 150px; min-height: 0; }
    }

    /* Появление экрана после заставки: блоки поднимаются по очереди */
    #dashboard.enter > * { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
    #dashboard.enter > *:nth-child(2) { animation-delay: .05s; }
    #dashboard.enter > *:nth-child(3) { animation-delay: .1s; }
    #dashboard.enter > *:nth-child(4) { animation-delay: .15s; }
    #dashboard.enter > *:nth-child(5) { animation-delay: .2s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Обновление потягиванием вниз */
    #ptr {
      position: fixed; left: 50%; top: 0; z-index: 20; width: 36px; height: 36px; margin-left: -18px;
      border-radius: 50%; background: var(--panel); color: var(--ink);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .16), inset 0 0 0 1px var(--rule);
      display: grid; place-items: center;
      transform: translateY(-48px); opacity: 0; pointer-events: none;
    }
    #ptr svg { width: 18px; height: 18px; }
    #ptr.back { transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s ease; }
    #ptr.spin svg { animation: ptrSpin .8s linear infinite; }
    @keyframes ptrSpin { to { transform: rotate(360deg); } }
    main.pulling { transition: none; }
    main.settle { transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
    #toast {
      position: fixed; left: 50%; top: 12px; z-index: 60; transform: translate(-50%, -70px);
      max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 10px;
      background: var(--ink); color: var(--bg); font-size: 14px; text-align: center;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }
    #toast.show { transform: translate(-50%, 0); }

    /* Сцена медали: свечение цвета медали за монетой и конфетти у особых */
    .stage .coin-shadow { bottom: auto; top: calc(50% + 150px); }
    .coin-zoom { position: relative; transform-style: preserve-3d; transform: scale(1.18); }
    @media (max-width: 370px) { .coin-zoom { transform: scale(1.06); } }
    @media (max-height: 640px) { .coin-zoom { transform: scale(1); } }
    .halo {
      position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; margin: -200px 0 0 -200px;
      border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, var(--halo, rgba(255, 194, 26, .4)) 0%, transparent 62%);
      animation: haloBreath 4s ease-in-out infinite;
    }
    @keyframes haloBreath { 0%, 100% { opacity: .75; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
    #confetti { position: fixed; inset: 0; z-index: 36; pointer-events: none; overflow: hidden; }
    #confetti i {
      position: absolute; top: -16px; width: 8px; height: 13px; border-radius: 2px;
      animation: fall var(--t) cubic-bezier(.25, .4, .5, 1) var(--d) forwards;
      opacity: 0;
    }
    @keyframes fall {
      0% { opacity: 1; transform: translate(0, 0) rotate(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--x), 105vh) rotate(var(--r)); }
    }
    @media (prefers-reduced-motion: reduce) {
      #dashboard.enter > * { animation: none; }
      .halo { animation: none; }
      #confetti { display: none; }
    }

    /* Ошибка */
    #errorBox { margin: 40px 0; border-left: 4px solid var(--up); padding: 4px 0 4px 14px; }
    #errorText { font-size: 15px; line-height: 1.4; }
    #retryBtn { margin-top: 12px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 7px; }
  </style>
</head>
<body>

  <!-- ЗАСТАВКА: узкий логотип, ритм-полоски и каждый раз новая фраза -->
  <div id="splash">
    <div class="sp-mark" aria-label="Weight Tracker"><span>Weight</span><span>Tracker</span></div>
    <div class="sp-bars" aria-hidden="true"><i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i><i style="--k:4"></i><i style="--k:5"></i><i style="--k:6"></i><i style="--k:7"></i><i style="--k:8"></i></div>
    <p class="splash-note" id="splashNote"></p>
  </div>

  <div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></div>
  <div id="toast" role="status"></div>
  <div id="confetti" aria-hidden="true"></div>
  <div id="story" role="dialog" aria-label="Итоги месяца" aria-hidden="true">
    <div class="st-bars" id="stBars"></div>
    <div class="st-head"><span class="t" id="stTitle"></span><button class="st-x" onclick="closeStory()" aria-label="Закрыть">×</button></div>
    <div class="st-page" id="stPage"></div>
  </div>

  <main>
    <div id="errorBox" class="hidden">
      <p id="errorText"></p>
      <button id="retryBtn" onclick="retryFetch()">Повторить попытку</button>
    </div>

    <div id="dashboard" class="hidden">
      <button id="storyRing" class="hidden" onclick="openStory()" aria-label="Итоги месяца"><span id="storyRingTxt">сен</span></button>
      <nav id="userTabs" class="who hidden"></nav>

      <section class="hero">
        <div>
          <p class="cap" id="currWeightLabel">Вес сегодня</p>
          <div class="big"><b id="currWeight">—</b><i>кг</i></div>
        </div>
        <div class="chg">
          <div id="currDiffBadge" class="flat">—</div>
          <span id="diffGap"></span>
        </div>
      </section>

      <section class="goal">
        <div class="goal-top">
          <span>Путь к цели <b id="laneGoal">—</b></span>
          <span><b id="progressText">—</b> · тренд <b id="trendWeight">—</b></span>
        </div>
        <div class="ticks" id="ticks"></div>
        <p class="eta"><span id="goalEtaLabel">Цель будет взята:</span> <b id="goalEtaText">—</b></p>
      </section>

      <section class="chart-panel">
        <div class="periods">
          <button class="period-btn" data-p="14" onclick="setPeriod('14')">14 дн</button>
          <button class="period-btn" data-p="30" onclick="setPeriod('30')">Месяц</button>
          <button class="period-btn" data-p="90" onclick="setPeriod('90')">3 мес</button>
          <button class="period-btn" data-p="180" onclick="setPeriod('180')">Полгода</button>
          <button class="period-btn" data-p="365" onclick="setPeriod('365')">Год</button>
          <button class="period-btn active" data-p="all" onclick="setPeriod('all')">Всё</button>
        </div>
        <div class="chart-box"><canvas id="weightChart"></canvas><p id="chartNote" class="hidden">График не загрузился. Закройте и откройте приложение ещё раз.</p></div>
      </section>

      <section class="mt-panel closed" id="mtPanel" aria-label="Восхождение к цели">
        <svg id="mtSvg" viewBox="0 -14 360 186" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Гора: тропа от стартового веса к цели"></svg>
        <div class="mt-info"><div class="k">Поднялся</div><div class="v" id="mtUp">—</div><p class="mt-next" id="mtNext"></p></div>
        <div class="mt-info r"><div class="k">До вершины</div><div class="v" id="mtLeft">—</div></div>
      </section>

      <section class="week-block">
        <div class="week-head">
          <button id="mtBtn" onclick="toggleMountain()" aria-controls="mtPanel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6.5-11 4 6.5 2.5-4L21 20z"/><path d="M9.5 9l1.8 3"/></svg>Гора</button>
          <button id="todayBtn" class="hidden" onclick="resetToToday()">К этой неделе ›</button>
        </div>
        <div id="days" class="days"></div>
        <p id="emptyWeekNote" class="hidden">На этой неделе замеров нет</p>
      </section>

      <section class="stats" id="statsRow">
        <button class="st" onclick="explainStat('wo')">
          <span><span class="k">Тренировки</span><span class="v" style="display:block"><span id="woWeek">0</span><small>/3 в нед.</small></span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        </button>
        <button class="st" onclick="explainStat('streak')">
          <span><span class="k">Серия замеров</span><span class="v" style="display:block"><span id="streakN">0</span><small> дн</small></span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.5 3.2 5 5.6 5 9.5A5 5 0 0 1 7 12.5c0-1.9.8-3.3 1.8-4.5.3 1.6 1.2 2.6 2.4 2.8C10.9 8.3 11 5.6 12 3z"/></svg>
        </button>
      </section>

      <button class="achbtn" id="achRow" onclick="openAchScreen()">
        <span class="l"><b>Достижения</b><small id="achNextLine"></small></span>
        <span class="r"><span class="n" id="achCount">0</span><span class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></span>
      </button>
    </div>
  </main>

  <!-- Экран всех медалей -->
  <div id="achScreen" class="screen" role="dialog" aria-label="Достижения">
    <div class="screen-inner">
      <button class="back-btn" onclick="navBack()">‹ Назад</button>
      <div class="screen-top"><h2>Достижения</h2><span id="achScreenCount"></span></div>
      <div id="achSections"></div>
    </div>
  </div>

  <!-- Одна медаль крупно: 3D-монета, которую можно крутить -->
  <div id="coinView" class="screen" role="dialog" aria-label="Медаль">
    <div class="screen-inner">
      <button class="back-btn" onclick="navBack()">‹ Назад</button>
      <div class="stage" id="coinStage"><div class="halo" id="coinHalo"></div><div class="burst" id="coinBurst"></div><div class="coin-shadow"></div><div class="coin-zoom"><div class="coin" id="coin"></div></div></div>
      <div class="coin-info award-info" id="cInfo">
        <p class="award-tag" id="cTag">Новая медаль</p>
        <h3 id="cTitle"></h3>
        <p id="cDesc"></p>
        <p class="when" id="cWhen"></p>
        <p class="hint">Покрути пальцем, на обороте твой путь</p>
        <button class="award-btn" id="cNext" onclick="navBack()">Забрать</button>
      </div>
    </div>
  </div>

  <div id="sheetBack" onclick="closeMedalSheet()"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="grip"></div>
    <h3 id="sTitle"></h3>
    <p class="s-desc" id="sDesc"></p>
    <div class="s-lane"><i id="sLane"></i></div>
    <dl id="sList"></dl>
    <p class="s-note" id="sNote"></p>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    // Запрос данных уходит сразу, не дожидаясь библиотеки графика и шрифтов
    const dataUrl = () => `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(window.Telegram?.WebApp?.initData || "")}`;
    let earlyRequest = fetch(dataUrl()).then(r => r.text());
    earlyRequest.catch(() => {});

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;
    let currentPeriod = 'all';
    let selectedDateTimestamp = null;
    let currentWeekOffset = 0;
    let intro = false;          // первая отрисовка после заставки: вес и дорожка набегают с нуля
    let chartReveal = false;    // график рисуется слева направо (открытие, смена периода, человека)
    const calm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    const $ = id => document.getElementById(id);
    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const fmt = n => String(n).replace('.', ',');

    function safeHaptic(type = 'light') {
      try {
        const hf = window.Telegram?.WebApp?.HapticFeedback;
        if (!hf) return;
        if (type === 'selection') hf.selectionChanged();
        else if (['light', 'medium', 'heavy', 'rigid', 'soft'].includes(type)) hf.impactOccurred(type);
        else hf.notificationOccurred(type);
      } catch (e) {}
    }

    // Тема Telegram: тёмная или светлая
    function applyTelegramTheme() {
      document.documentElement.classList.add('dark');      // стиль «Спорт-ночь» всегда тёмный
      // шапка и фон Telegram в цвет приложения, без белой полосы сверху
      try {
        const tg = window.Telegram?.WebApp, bg = cssVar('--bg');
        if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
        if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('7.10')) tg.setBottomBarColor(bg);
      } catch (e) {}
      if (chartInstance) renderDashboard();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        // Свайп вниз по карточке медали или экрану достижений не должен сворачивать приложение
        try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
        try { tg.onEvent('themeChanged', applyTelegramTheme); } catch (e) {}
      }
      applyTelegramTheme();
      initSwipe();
      initPullToRefresh();
      fetchData();
    });

    // Неделя листается за пальцем: тянешь — дни едут следом, отпустил — неделя
    // уезжает, а новая въезжает с другой стороны. В будущее не листается (пружинит).
    let weekAnim = false;
    function initSwipe() {
      const el = $('days');
      let x0 = 0, y0 = 0, dx = 0, mode = null, moved = false;
      el.addEventListener('touchstart', e => {
        if (weekAnim) { mode = 'skip'; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = null; moved = false;
        el.style.transition = 'none';
      }, { passive: true });
      el.addEventListener('touchmove', e => {
        if (mode === 'skip') return;
        const ddx = e.touches[0].clientX - x0, ddy = e.touches[0].clientY - y0;
        if (!mode) {
          if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
          mode = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'skip';
          if (mode !== 'x') return;
        }
        moved = true;
        dx = ddx < 0 && currentWeekOffset >= 0 ? ddx * .25 : ddx;
        el.style.transform = `translateX(${dx}px)`;
        el.style.opacity = String(1 - Math.min(.5, Math.abs(dx) / el.offsetWidth));
      }, { passive: true });
      const end = () => {
        if (mode !== 'x') return;
        mode = null;
        const go = Math.abs(dx) > 50 && !(dx < 0 && currentWeekOffset >= 0);
        if (go) { turnWeek(dx > 0 ? -1 : 1); return; }
        el.style.transition = 'transform .28s cubic-bezier(.2, .8, .2, 1), opacity .28s ease';
        el.style.transform = ''; el.style.opacity = '';
      };
      el.addEventListener('touchend', end, { passive: true });
      el.addEventListener('touchcancel', end, { passive: true });
      // после перетаскивания отпущенный палец не должен «нажать» на день
      el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    }

    // dir: -1 — прошлая неделя (старая уезжает вправо), +1 — следующая
    function turnWeek(dir, apply) {
      apply = apply || (() => { currentWeekOffset += dir; selectedDateTimestamp = null; });
      const el = $('days');
      safeHaptic('light');
      if (calm()) { apply(); renderDashboard(); el.style.transform = ''; el.style.opacity = ''; return; }
      weekAnim = true;
      const w = el.offsetWidth + 24;
      el.style.transition = 'transform .17s cubic-bezier(.4, 0, 1, 1), opacity .17s ease';
      el.style.transform = `translateX(${dir < 0 ? w : -w}px)`; el.style.opacity = '0';
      setTimeout(() => {
        apply();
        renderDashboard();
        el.style.transition = 'none';
        el.style.transform = `translateX(${dir < 0 ? -w : w}px)`;
        el.offsetWidth;
        el.style.transition = 'transform .32s cubic-bezier(.2, .8, .2, 1), opacity .32s ease';
        el.style.transform = ''; el.style.opacity = '';
        setTimeout(() => { weekAnim = false; }, 320);
      }, 170);
    }

    // Потянуть вниз — обновить. Закрытие свайпом выключено через disableVerticalSwipes.
    function initPullToRefresh() {
      const main = document.querySelector('main'), ptr = $('ptr'), LIMIT = 70;
      let y0 = null, x0 = 0, dy = 0, mode = null, busy = false;
      const blocked = () => busy || $('dashboard').classList.contains('hidden') ||
        document.querySelector('.screen.open, #sheet.open') || window.scrollY > 0;
      const place = (d) => {
        const k = Math.min(1, d / LIMIT);
        main.style.transform = d ? `translateY(${d * .5}px)` : '';
        ptr.style.opacity = k;
        ptr.style.transform = `translateY(${Math.min(d, LIMIT * 1.3) - 40}px) rotate(${d * 3}deg)`;
      };
      main.addEventListener('touchstart', e => {
        if (blocked()) { y0 = null; return; }
        y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; mode = null;
      }, { passive: true });
      main.addEventListener('touchmove', e => {
        if (y0 === null) return;
        const ddy = e.touches[0].clientY - y0, ddx = e.touches[0].clientX - x0;
        if (!mode) {
          if (Math.abs(ddy) < 8 && Math.abs(ddx) < 8) return;
          mode = ddy > 0 && Math.abs(ddy) > Math.abs(ddx) * 1.2 ? 'pull' : 'skip';
          if (mode === 'pull') { main.classList.remove('settle'); ptr.classList.remove('back'); main.classList.add('pulling'); }
        }
        if (mode !== 'pull') return;
        const was = dy >= LIMIT;
        dy = Math.max(0, ddy) * .9;
        if (!was && dy >= LIMIT) safeHaptic('light');
        place(dy);
      }, { passive: true });
      const end = () => {
        if (y0 === null || mode !== 'pull') { y0 = null; return; }
        y0 = null;
        main.classList.remove('pulling'); main.classList.add('settle'); ptr.classList.add('back');
        if (dy < LIMIT) { place(0); return; }
        busy = true;
        safeHaptic('medium');
        main.style.transform = '';
        ptr.style.opacity = 1; ptr.style.transform = 'translateY(14px)';
        ptr.classList.add('spin');
        const t0 = performance.now();
        fetchData(true).finally(() => {
          setTimeout(() => {                                   // крутилка видна хотя бы полсекунды
            ptr.classList.remove('spin'); place(0); busy = false;
          }, Math.max(0, 500 - (performance.now() - t0)));
        });
      };
      main.addEventListener('touchend', end, { passive: true });
      main.addEventListener('touchcancel', end, { passive: true });
    }

    function changeWeek(dir) {
      if (dir === 1 && currentWeekOffset >= 0) return;
      turnWeek(dir);
    }

    function resetToToday() {
      if (currentWeekOffset >= 0) return;

    async function fetchData(refresh) {
      try {
        const req = !refresh && earlyRequest ? earlyRequest : fetch(dataUrl()).then(r => r.text());
        earlyRequest = null;
        const text = await req;
        let data;
        try { data = JSON.parse(text); }
        catch (e) { throw new Error("Сервер Google ещё просыпается. Нажмите «Повторить попытку» через несколько секунд."); }
        if (refresh) { refreshData(data); return; }
        hideSplash(() => handleData(data));
      } catch (err) {
        // Сбой сети приходит как TypeError с английским текстом — показываем по-русски
        const netFail = err instanceof TypeError || !err.message;
        if (refresh) { toast(netFail ? "Нет связи, данные не обновились" : "Не удалось обновить, попробуйте ещё раз"); return; }
        const msg = netFail ? "Не удалось подключиться к серверу. Проверьте интернет и повторите попытку." : err.message;
        hideSplash(() => showError(msg));

    // Заставка показывается всегда: ждём, пока плашка хотя бы раз пролетит целиком,
    // и убираем её, когда плашка ушла за край, а не посреди пролёта.
    const SLAB_CYCLE = 1500, SLAB_OUT = 1170;              // период волны полосок и момент, когда волна прошла целиком
    function hideSplash(then) {
      const sp = $('splash');
      if (sp.classList.contains('gone')) { if (then) then(); return; }
      let t = performance.now();
      try { const a = sp.querySelector('.sp-bars i').getAnimations()[0]; if (a && a.currentTime != null) t = a.currentTime; } catch (e) {}
      const phase = t % SLAB_CYCLE;
      let wait = phase <= SLAB_OUT ? SLAB_OUT - phase : 0;      // полоски стоят — можно убирать сразу
      if (t < SLAB_OUT) wait = SLAB_OUT - t;
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) wait = Math.max(0, 600 - t);
      setTimeout(() => { if (then) then(); sp.classList.add('gone'); }, wait);
    }

    function calculateSMA(entries, w = 7) {
      return entries.map((_, i, arr) => {
        const sub = arr.slice(Math.max(0, i - w + 1), i + 1);
        return parseFloat((sub.reduce((s, e) => s + (parseFloat(e.weight) || 0), 0) / sub.length).toFixed(1));
      });
    }

    // Прогноз через линейную регрессию по всем замерам.
    // Нужно минимум 5 записей и 7 дней разброса, иначе прогноз не строится.
    function calculateGoalETA(entries, target, current) {
      if (!target) return "цель не задана";
      const win = entries;
      if (win.length < 5) return "нужно больше замеров";
      const t0 = win[0].timestamp, DAY = 86400000;
      if ((win[win.length - 1].timestamp - t0) / DAY < 7) return "нужна неделя замеров";
      let n = win.length, sx = 0, sy = 0, sxy = 0, sxx = 0;
      win.forEach(e => { const x = (e.timestamp - t0) / DAY, y = e.weight; sx += x; sy += y; sxy += x * y; sxx += x * x; });
      const den = n * sxx - sx * sx;
      if (den === 0) return "вес стабилен";
      const slope = (n * sxy - sx * sy) / den;
      const left = current - target;
      if (Math.abs(slope) < 0.005) return "вес стабилен";
      if (left > 0 && slope >= 0) return "нужен дефицит калорий";
      if (left < 0 && slope <= 0) return "нужен профицит калорий";
      const days = Math.abs(left / slope);
      if (!isFinite(days)) return "недоступно";
      return new Date(Date.now() + days * DAY).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Точки графика по календарным дням от первого до последнего замера периода
    function buildDailySeries(entries, smaByTs) {
      const dayStart = ts => new Date(ts).setHours(0, 0, 0, 0);
      const byDay = new Map(entries.map(e => [dayStart(e.timestamp), e]));
      const out = [];
      if (!entries.length) return out;
      const last = dayStart(entries[entries.length - 1].timestamp);
      for (let d = new Date(dayStart(entries[0].timestamp)); d.getTime() <= last; d.setDate(d.getDate() + 1)) {
        const e = byDay.get(d.getTime());
        out.push({
          label: `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`,
          weight: e ? e.weight : null,
          sma: e ? smaByTs.get(e.timestamp) : null,
          ts: e ? e.timestamp : null
        });
      }
      return out;
    }

    function renderWeek(all) {
      const box = $('days');
      box.innerHTML = '';
      const names = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const dow = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() + (dow === 0 ? -6 : 1 - dow) + currentWeekOffset * 7);
      const days = [...Array(7)].map((_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });

      $('todayBtn').classList.toggle('hidden', currentWeekOffset >= 0);

      const ws = days[0].getTime(), we = days[6].getTime() + 86400000 - 1;
      const inWeek = all.filter(e => e.timestamp >= ws && e.timestamp <= we);
      $('emptyWeekNote').classList.toggle('hidden', inWeek.length > 0);

      if (!inWeek.some(e => e.timestamp === selectedDateTimestamp)) {
        if (inWeek.length) selectedDateTimestamp = inWeek[inWeek.length - 1].timestamp;
        else if (currentWeekOffset === 0 && all.length) selectedDateTimestamp = all[all.length - 1].timestamp;
      }

      days.forEach((d, i) => {
        const idx = all.findIndex(e => { const x = new Date(e.timestamp); return x.toDateString() === d.toDateString(); });
        const entry = idx !== -1 ? all[idx] : null;
        let delta = '', cls = '';
        if (entry && idx > 0) {
          const diff = parseFloat((entry.weight - all[idx - 1].weight).toFixed(1));
          delta = diff > 0 ? `+${fmt(diff)}` : diff < 0 ? `−${fmt(Math.abs(diff))}` : '0';
          cls = diff < 0 ? 'down' : diff > 0 ? 'up' : '';
        }
        const isFuture = d.getTime() > today.getTime();
        const b = document.createElement('button');
        b.className = 'day' +
          (entry ? ' has' : ' empty') +
          (d.toDateString() === new Date().toDateString() ? ' today' : '') +
          (isFuture ? ' future' : '') +
          (entry && entry.timestamp === selectedDateTimestamp ? ' sel' : '');
        b.innerHTML = `<span class="dw">${names[i]}</span><span class="dn">${d.getDate()}</span><span class="dd ${cls}">${delta}</span>`;
        if (entry) b.onclick = () => { selectedDateTimestamp = entry.timestamp; safeHaptic('light'); renderDashboard(); };
        else b.disabled = true;
        box.appendChild(b);
      });
    }

    const MedalArt = (function () {

      const rings = ringsOp ? [...Array(26)].map((_, i) =>
        `<circle cx="120" cy="120" r="${8 + i * 3.4}" fill="none" stroke="${ringsColor}" stroke-width=".8" opacity="${ringsOp}"/>`).join('') : '';

      const defs = `<defs>

    const HABIT_ENAMEL = { fire: '#167C8C', steps: '#5E43A8', sunmoon: '#245F9E', scale: '#7B5E3B', bird: '#C9577E' };

      // скрытые: у каждой своя эмаль
      hidden:   (m, art) => ({ rim: 'gold', relief: 'nickel', field: { enamel: HIDDEN_ENAMEL[art] || '#F2B705' } })

    // =====================================================================
    // НАВИГАЦИЯ «НАЗАД»: стек открытых окон (окошко → медаль → экран)
    // =====================================================================
    const navStack = [];
    function syncBack() {
      try {
        const bb = window.Telegram?.WebApp?.BackButton;
        if (!bb) return;
        navStack.length ? bb.show() : bb.hide();
      } catch (e) {}
    }
    function navPush(closeFn) { navStack.push(closeFn); syncBack(); }
    function navForget(closeFn) { const i = navStack.lastIndexOf(closeFn); if (i !== -1) navStack.splice(i, 1); syncBack(); }
    function navBack() { const fn = navStack[navStack.length - 1]; if (fn) fn(); }

    // =====================================================================
    // ЭКРАН ДОСТИЖЕНИЙ
    // =====================================================================
    const MEDAL_SERIES_TAIL = { streak_365: ['habit', 'streak_'], count_1000: ['habit', 'count_'], work_250: ['training', 'workouts_'] };
    const MEDAL_SECTIONS_UI = [
      ['weight', 'Вес'], ['habit', 'Привычка'], ['sleep', 'Сон'], ['training', 'Тренировки'],
      ['main', 'Главные'], ['seasonal', 'Сезонные'], ['hidden', 'Скрытые']
    ];
    let medalCache = {};

    // Параметры рисования медали по данным с сервера
    function medalOpts(m, forCoin) {
      const locked = m.status !== 'earned';
      const style = locked ? { rim: 'locked', relief: 'locked', field: 'oxid' } : MedalArt.STYLE[m.art === 'belt' ? 'body' : m.section](m.metal, m.art);
      const art = m.art && MedalArt.ART[m.art] ? MedalArt.ART[m.art] : {};
      return { label: m.title, ...style, ...art, big: m.big || '', caption: m.caption || '', band: false };
    }
    function medalSVG(m) {
      const k = m.key + ':' + m.status;
      if (!medalCache[k]) medalCache[k] = MedalArt.medal(medalOpts(m));
      return medalCache[k];
    }

    // Экран достижений собирается заранее, в паузе после открытия главного экрана,
    // и переиспользуется, пока не сменились данные или человек — открывается мгновенно
    let achBuiltFor = null, achIdle = 0;
    function prebuildAchScreen() {
      const run = () => { const u = globalData[activeUserId]; if (u && u.medals && u.medals.catalog && achBuiltFor !== u) buildAchScreen(u); };
      if (window.cancelIdleCallback && achIdle) cancelIdleCallback(achIdle); else clearTimeout(achIdle);
      achIdle = window.requestIdleCallback ? requestIdleCallback(run, { timeout: 2500 }) : setTimeout(run, 1200);
    }
    function openAchScreen() {
      const u = globalData[activeUserId];
      if (!u || !u.medals || !u.medals.catalog) return;
      safeHaptic('light');
      if (achBuiltFor !== u) buildAchScreen(u);
      $('achScreen').scrollTop = 0;
      $('achScreen').classList.add('open');
      navPush(closeAchScreen);
      tiltStart();
    }
    function buildAchScreen(u) {
      achBuiltFor = u;
      const cat = u.medals.catalog;
      const earnedN = cat.filter(m => m.status === 'earned').length;
      $('achScreenCount').textContent = `${earnedN} из ${cat.length}`;
      const box = $('achSections');
      box.innerHTML = '';
      // старшие ступени из «Главных» показываем в конце своей серии: 7 → 30 → 100 → 365 дней
      const placed = (key) => {
        const items = cat.filter(m => m.section === key && !MEDAL_SERIES_TAIL[m.key]);
        Object.entries(MEDAL_SERIES_TAIL).forEach(([k, [sec, prefix]]) => {
          const m = cat.find(x => x.key === k);
          if (!m || sec !== key) return;
          let at = -1;
          items.forEach((x, i) => { if (x.key.startsWith(prefix)) at = i; });
          items.splice(at + 1 || items.length, 0, m);
        });
        return items;
      };
      MEDAL_SECTIONS_UI.forEach(([key, name]) => {
        const items = placed(key);
        if (!items.length) return;
        const got = items.filter(m => m.status === 'earned').length;
        const sec = document.createElement('section');
        sec.className = 'm-sec';
        sec.innerHTML = `<h3>${name} <small>${got} из ${items.length}</small></h3><div class="m-grid"></div>`;
        const grid = sec.querySelector('.m-grid');
        items.forEach(m => {
          const b = document.createElement('button');
          b.className = 'm-tile' + (m.status === 'earned' ? '' : ' locked');
          let sub;
          if (m.status === 'earned') sub = `<small>${dayMonth(m.date)}</small>`;
          else if (m.status === 'next') sub = `<span class="mini"><i style="width:${Math.round(m.progress * 100)}%"></i></span><small>${m.progressText}</small>`;
          else sub = `<small>${m.hidden ? 'секрет' : 'впереди'}</small>`;
          b.innerHTML = `<span class="mw">${medalSVG(m)}</span><b>${m.title}</b>` + sub;
          b.onclick = () => m.status === 'earned' ? openCoin(m) : openMedalSheet(m);
          grid.appendChild(b);
        });
        box.appendChild(sec);
      });
    }
    function closeAchScreen() {
      $('achScreen').classList.remove('open');
      navForget(closeAchScreen);
      tiltStop();
    }

    // =====================================================================
    // ИТОГИ МЕСЯЦА: «сторис» за прошлый месяц, по страничке на неделю.
    // Вес и медали берём из уже загруженных данных, тренировки и фразы тренера
    // приходят с сервера (фразы каждый раз новые).
    // =====================================================================
    const ST_MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
    const ST_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const ST = { u: null, pages: [], i: 0, timer: 0, t0: 0, left: 0, paused: false, srv: null, req: 0 };
    const ST_DUR = 8000;
    function storyMonth() { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return { y: d.getFullYear(), m: d.getMonth() }; }
    const stYm = ({ y, m }) => `${y}-${String(m + 1).padStart(2, '0')}`;
    const stSeenKey = u => `story_seen_${u.id || activeUserId}_${stYm(storyMonth())}`;
    function stDay(ts) { const d = new Date(ts); if (d.getHours() < 4) d.setDate(d.getDate() - 1); d.setHours(0, 0, 0, 0); return d; }
    function stWeeks(y, m) {
      const last = new Date(y, m + 1, 0), out = [];
      let from = new Date(y, m, 1);
      while (from <= last) {
        const to = new Date(from); to.setDate(to.getDate() + ((7 - to.getDay()) % 7));
        if (to > last) to.setTime(last.getTime());
        out.push({ from: new Date(from), to: new Date(to) });
        from = new Date(to); from.setDate(from.getDate() + 1);
      }
      return out;
    }
    function renderStoryRing(u) {
      const mo = storyMonth(), ring = $('storyRing');
      const has = (u.entries || []).some(e => { const d = stDay(e.timestamp); return d.getFullYear() === mo.y && d.getMonth() === mo.m; });
      ring.classList.toggle('hidden', !has);
      if (!has) return;
      $('storyRingTxt').textContent = ST_MONTHS[mo.m].slice(0, 3);
      let seen = false; try { seen = localStorage.getItem(stSeenKey(u)) === '1'; } catch (e) {}
      ring.classList.toggle('seen', seen);
    }
    function stBuild(u) {
      const { y, m } = storyMonth(), losing = !u.target || u.target < (u.start || u.entries[0].weight);
      const E = u.entries.map(e => ({ d: stDay(e.timestamp), w: e.weight }));
      const inR = (d, a, b) => d >= a && d <= b;
      const cat = (u.medals && u.medals.catalog) || [];
      const before = d => E.filter(e => e.d < d);
      const weeks = stWeeks(y, m).map((wk, i) => {
        const ws = E.filter(e => inR(e.d, wk.from, wk.to)), b = before(wk.from);
        const base = b.length ? b[b.length - 1].w : (ws[0] ? ws[0].w : null), end = ws.length ? ws[ws.length - 1].w : null;
        return { i, ...wk, ws, days: Math.round((wk.to - wk.from) / DAY_MS) + 1,
          change: base != null && end != null ? +(end - base).toFixed(1) : null,
          medals: cat.filter(md => md.status === 'earned' && md.date && inR(stDay(new Date(md.date).getTime()), wk.from, wk.to)) };
      });
      const mFirst = new Date(y, m, 1), mLast = new Date(y, m + 1, 0);
      const mw = E.filter(e => inR(e.d, mFirst, mLast)), bm = before(mFirst);
      const startW = bm.length ? bm[bm.length - 1].w : (mw[0] ? mw[0].w : null), endW = mw.length ? mw[mw.length - 1].w : null;
      const good = c => c != null && (losing ? c < 0 : c > 0);
      const best = weeks.filter(w => good(w.change)).sort((a, b) => losing ? a.change - b.change : b.change - a.change)[0];
      // путь к цели: где был в начале месяца и где в конце
      let path = null;
      if (u.target && u.start && startW != null && endW != null && u.start !== u.target) {
        const pc = w => Math.max(0, Math.min(100, Math.round((u.start - w) / (u.start - u.target) * 100)));
        path = [pc(startW), pc(endW)];
      }
      return { y, m, losing, weeks, change: startW != null && endW != null ? +(endW - startW).toFixed(1) : null,
               weighIns: mw.length, medals: weeks.reduce((s, w) => s + w.medals.length, 0), best, path, good };
    }
    const stKg = c => c == null ? '—' : (c > 0 ? '+' : c < 0 ? '−' : '') + fmt(Math.abs(c).toFixed(1));
    const stRange = (a, b) => a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${ST_GEN[b.getMonth()]}` : `${a.getDate()} ${ST_GEN[a.getMonth()]} – ${b.getDate()} ${ST_GEN[b.getMonth()]}`;
    function stCoach(text) { return text ? `<div class="st-coach">${esc(text)}</div>` : `<div class="st-coach wait">…</div>`; }

      if (w.ws.length < 2) return w.ws.length ? `<div class="st-chart"><svg viewBox="0 0 300 120"><circle cx="150" cy="60" r="6" fill="var(--volt)"/><text x="150" y="92" text-anchor="middle">${fmt(w.ws[0].w)} кг</text></svg></div>` : '';
      const n = w.days, ws = w.ws, lo = Math.min(...ws.map(e => e.w)), hi = Math.max(...ws.map(e => e.w)), pad = Math.max(.3, (hi - lo) * .15);
      const X = e => 16 + (e.d - w.from) / DAY_MS / Math.max(1, n - 1) * 268, Y = v => 14 + (hi + pad - v) / (hi - lo + 2 * pad) * 84;
      const pts = ws.map(e => [X(e), Y(e.w)]);

    }
    function stPages(u, b) {
      const srv = ST.srv, ph = srv && srv.phrases, wo = i => srv && srv.weeks && srv.weeks[i] ? srv.weeks[i].workouts : null;
      const cls = c => c == null ? '' : b.good(c) ? 'down' : c === 0 ? '' : 'up';
      const totalWo = srv && srv.summary ? srv.summary.workouts : null, dots = srv && srv.failed ? '—' : '…';
      const pages = [() => `

        ${w.medals.length ? `<div class="st-medals">${w.medals.slice(0, 4).map(md => `<div class="md">${medalSVG(md)}${esc(md.title)}</div>`).join('')}</div>` : ''}
        ${stCoach(ph && ph.weeks && ph.weeks[w.i])}`));
      pages.push(() => `
        <p class="st-k">Итог ${ST_GEN[b.m].replace(/я$/, 'я')}</p>
        <div><div class="st-big ${cls(b.change)}">${stKg(b.change)} <small>кг</small></div><p class="st-sub">за ${ST_MONTHS[b.m]}${b.best ? ` · лучшая неделя ${b.best.i + 1}-я (${stKg(b.best.change)} кг)` : ''}</p></div>
        ${b.path ? `<div class="st-chips"><span class="st-chip"><b>${b.path[0]}% → ${b.path[1]}%</b>путь к цели за месяц</span></div>` : ''}

    }
    function stShow(i, anim) {
      ST.i = Math.max(0, Math.min(ST.pages.length - 1, i));
      const pg = $('stPage');
      pg.classList.remove('in'); void pg.offsetWidth;

      if (anim !== false) pg.classList.add('in');
      [...$('stBars').children].forEach((el, k) => { el.classList.toggle('done', k < ST.i); el.firstElementChild.style.width = k < ST.i ? '100%' : '0'; });

    }
    function stTick(now) {
      if (!$('story').classList.contains('open')) return;
      if (!ST.paused) {
        const k = Math.min(1, 1 - (ST.left - (now - ST.t0)) / ST_DUR);
        const bar = $('stBars').children[ST.i];
        if (bar) bar.firstElementChild.style.width = (k * 100).toFixed(1) + '%';

    }
    function openStory() {
      const u = globalData[activeUserId];

      $('storyRing').classList.add('seen');
      // тренировки и свежие фразы тренера
      const req = ++ST.req;
      fetch(`${dataUrl()}&action=story&uid=${encodeURIComponent(u.id || activeUserId)}&month=${stYm(storyMonth())}`)
        .then(r => r.json()).then(j => {
          if (req !== ST.req || !j || j.error) throw 0;
          ST.srv = j; ST.pages = stPages(u, b);

    // тап справа — дальше, слева — назад, удержание — пауза, свайп вниз — закрыть
    (() => {

      });

    })();

    // =====================================================================
    // ВОСХОЖДЕНИЕ: подножие — стартовый вес, вершина — цель. Лагеря на тропе —
    // медали «Путь к цели» (10, 25, 50, 75, 90%). Открывается кнопкой «Гора».
    // =====================================================================
    const MT_CAMPS = [10, 25, 50, 75, 90];
    const MT_TRAIL = [[30, 160], [92, 150], [66, 132], [140, 120], [114, 102], [186, 90], [160, 72], [222, 62], [204, 46], [246, 36], [236, 24], [258, 16]];
    const MT = { t: null, user: null, raf: 0, open: false };
    (() => { try { MT.open = localStorage.getItem('mt_open') === '1'; } catch (e) {} })();
    const mtSeg = MT_TRAIL.slice(1).map((p, i) => Math.hypot(p[0] - MT_TRAIL[i][0], p[1] - MT_TRAIL[i][1]));
    const mtLen = mtSeg.reduce((a, b) => a + b, 0);
    function mtAt(t) {
      let d = Math.max(0, Math.min(1, t)) * mtLen;
      for (let i = 0; i < mtSeg.length; i++) {
        if (d <= mtSeg[i]) { const k = d / mtSeg[i], a = MT_TRAIL[i], b = MT_TRAIL[i + 1]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
        d -= mtSeg[i];
      }
      return MT_TRAIL[MT_TRAIL.length - 1];
    }
    function mtBuild() {
      const svg = $('mtSvg');
      if (svg.dataset.built) return;
      svg.dataset.built = '1';
      let stars = '';
      for (let i = 0; i < 22; i++) stars += `<circle cx="${(i * 67 + 13) % 360}" cy="${(i * 29 + 7) % 70}" r="${i % 5 ? .6 : 1}" fill="#F2F3F0" opacity=".3"/>`;
      const camps = MT_CAMPS.map(c => { const [x, y] = mtAt(c / 100);
        return `<g class="mt-camp" data-c="${c}"><path d="M${x - 6} ${y + 2}L${x} ${y - 8}L${x + 6} ${y + 2}Z" stroke-width="1.2"/><text x="${x + 9}" y="${y + 1}" font-size="11" font-weight="700" font-family="Barlow Condensed, Arial Narrow, sans-serif">${c}%</text></g>`; }).join('');
      const [fx, fy] = MT_TRAIL[MT_TRAIL.length - 1];
      svg.innerHTML = `<defs>
          <linearGradient id="mtSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2030"/><stop offset="1" stop-color="#1B1C1F"/></linearGradient>
          <linearGradient id="mtRock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3E46"/><stop offset="1" stop-color="#202226"/></linearGradient>
          <linearGradient id="mtRock2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2F35"/><stop offset="1" stop-color="#18191C"/></linearGradient>
        </defs>
        <rect y="-14" width="360" height="186" fill="url(#mtSky)"/>${stars}
        <path d="M-10 172L60 96L104 122L168 60L206 92L262 10L318 84L370 70V172Z" fill="url(#mtRock2)"/>
        <path d="M-10 172L28 150L96 112L132 126L186 78L214 92L258 12L292 70L330 104L370 128V172Z" fill="url(#mtRock)"/>
        <path d="M258 12L272 40L262 35L252 46L246 32Z" fill="#E9ECEF" opacity=".9"/>
        <path d="M${MT_TRAIL.map(p => p.join(' ')).join('L')}" fill="none" stroke="#4A4E56" stroke-width="2.6" stroke-dasharray="1 6" stroke-linecap="round"/>
        <path id="mtDone" d="" fill="none" stroke="#C6FF3D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        ${camps}
        <line x1="${fx}" y1="${fy}" x2="${fx}" y2="${fy - 14}" stroke="#F2F3F0" stroke-width="1.4"/>
        <path id="mtFlag" d="M${fx} ${fy - 14}L${fx + 13} ${fy - 10}L${fx} ${fy - 6}Z" fill="#F2B53A"/>
        <g id="mtMe"><circle r="9" fill="#C6FF3D" opacity=".18"/><circle r="4.8" fill="#C6FF3D" stroke="#1B1C1F" stroke-width="2"/></g>`;
    }
    function mtDraw(t, reached) {
      const pts = [];
      for (let k = 0; k <= 50; k++) pts.push(mtAt(t * k / 50).map(v => v.toFixed(1)).join(' '));
      $('mtDone').setAttribute('d', 'M' + pts.join('L'));
      const [x, y] = mtAt(t);
      $('mtMe').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
      document.querySelectorAll('.mt-camp').forEach(g => {
        const on = reached(+g.dataset.c, t), tri = g.firstElementChild, txt = g.lastElementChild;
        tri.setAttribute('fill', on ? '#C6FF3D' : '#24262A'); tri.setAttribute('stroke', on ? '#C6FF3D' : '#4A4E56');
        txt.setAttribute('fill', on ? '#F2F3F0' : '#83868D');

    }
    const fmt1 = v => fmt(parseFloat((+v).toFixed(1)));
    function renderMountain(u, start, goal, current) {

        $('mtUp').innerHTML = '—'; $('mtLeft').innerHTML = '—';
        $('mtNext').textContent = 'Задай цель в боте, и тропа появится';

        return;
      }
      const down = start > goal, total = Math.abs(start - goal);
      const done = down ? start - current : current - start;
      const t = Math.max(0, Math.min(1, done / total));
      // лагерь горит, если медаль «Путь к цели» уже получена, или тропа до него дошла
      const earned = new Set(((u.medals && u.medals.catalog) || []).filter(m => m.status === 'earned').map(m => m.key));
      const reached = (c, tt) => earned.has('path_' + c) || tt * 100 >= c - 1e-6;
      $('mtUp').innerHTML = (done > 0 ? (down ? '−' : '+') : '') + fmt1(Math.max(0, done)) + ' <small>кг</small>';
      $('mtLeft').innerHTML = t >= 1 ? 'Цель!' : fmt1(Math.max(0, total - Math.max(0, done))) + ' <small>кг</small>';

        ? `До лагеря ${next}%: <b>${fmt1((next / 100 - t) * total)} кг</b>`

    function toggleMountain() {

    // =====================================================================
    // НАКЛОН ТЕЛЕФОНА: блики на медалях следуют за наклоном.
    // Датчик работает, только пока открыты медали. Без датчика блик ходит сам, как раньше.
    // =====================================================================
    const Tilt = { x: 0, y: 0, tx: 0, ty: 0, users: 0, b0: null, g0: 0, src: null, raf: 0, wx: 9, wy: 9 };
    function tiltSample(beta, gamma) {               // градусы
      if (beta == null || gamma == null || isNaN(beta) || isNaN(gamma)) return;
      if (Tilt.b0 == null) { Tilt.b0 = beta; Tilt.g0 = gamma; document.documentElement.classList.add('tilt-on'); }
      Tilt.b0 += (beta - Tilt.b0) * 0.004;            // если держишь телефон по-новому, центр медленно подстраивается
      Tilt.g0 += (gamma - Tilt.g0) * 0.004;
      Tilt.tx = Math.max(-1, Math.min(1, (gamma - Tilt.g0) / 22));
      Tilt.ty = Math.max(-1, Math.min(1, (beta - Tilt.b0) / 22));
    }
    function tiltLoop() {
      Tilt.x += (Tilt.tx - Tilt.x) * 0.18; Tilt.y += (Tilt.ty - Tilt.y) * 0.18;
      if (Math.abs(Tilt.x - Tilt.wx) > 0.004 || Math.abs(Tilt.y - Tilt.wy) > 0.004) {
        Tilt.wx = Tilt.x; Tilt.wy = Tilt.y;
        const st = document.documentElement.style;
        st.setProperty('--tiltX', Tilt.x.toFixed(3)); st.setProperty('--tiltY', Tilt.y.toFixed(3));
      }
      Tilt.raf = requestAnimationFrame(tiltLoop);
    }
    const onTgTilt = () => { const d = window.Telegram.WebApp.DeviceOrientation; tiltSample(d.beta * 180 / Math.PI, d.gamma * 180 / Math.PI); };
    const onWinTilt = e => tiltSample(e.beta, e.gamma);
    function tiltStart() {
      if (Tilt.users++ || calm()) return;
      const tg = window.Telegram?.WebApp;
      try {
        if (tg?.DeviceOrientation && tg.isVersionAtLeast?.('8.0')) {
          Tilt.src = 'tg'; tg.onEvent('deviceOrientationChanged', onTgTilt); tg.DeviceOrientation.start({ refresh_rate: 40 });
        } else if (window.DeviceOrientationEvent) {
          Tilt.src = 'win';

    // =====================================================================
    // 3D-МОНЕТА: лицо, оборот с кривой веса, ребро, вращение пальцем
    // =====================================================================
    function coinBack(m) {
      const u = globalData[activeUserId];
      const until = m.date ? new Date(m.date + 'T23:59:59').getTime() : Infinity;
      const pts = u.entries.filter(e => e.timestamp <= until).map(e => e.weight);
      let curve = '';
      if (pts.length > 1) {
        const lo = Math.min(...pts), hi = Math.max(...pts), span = Math.max(0.5, hi - lo);
        const xy = pts.map((w, i) => [52 + 136 * i / (pts.length - 1), 92 + 46 * (hi - w) / span]);
        curve = `<path d="${xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                 <circle cx="${xy[xy.length - 1][0]}" cy="${xy[xy.length - 1][1]}" r="6"/>`;
      }
      const title = `<text x="120" y="70" text-anchor="middle" font-size="20" stroke-width="0" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700">${m.title}</text>`;
      // оборот в тех же цветах, что лицо: тот же ободок (у главных — золотые лучи), то же поле
      const { art, cut, paint, ...face } = medalOpts(m);
      return MedalArt.medal(Object.assign(face, { label: 'оборот', art: title + curve,
        big: dayMonth(m.date), caption: (u.medals.owner || u.name || '').toUpperCase(), band: false }));
    }

    const C = { scale: 1, landed: null, angle: 0, vel: 0, tilt: 0, dragging: false, lastX: 0, startY: 0, lastT: 0, mode: 'idle', tween: null, base: 0, idleT0: 0, raf: 0, sheens: null };
    // контур звезды особых медалей (24 луча, как burst(24) в MedalArt) в пикселях блока 248×248
    const STAR_CLIP = [...Array(48)].map((_, i) => { const a = i * Math.PI / 24, r = i % 2 ? 110 : 122.5;
      return `${(124 + r * Math.sin(a)).toFixed(1)}px ${(124 - r * Math.cos(a)).toFixed(1)}px`; }).join(',');
    function buildCoin(m) {
      const coin = $('coin');
      coin.innerHTML = '';
      C.sheens = null; C.glints = null;
      const style = MedalArt.STYLE[m.section](m.metal, m.art);
      // у особых медалей ободок — золотая звезда: ребро монеты золотое и прячется под впадинами лучей
      const grand = !!(style.grand || (MedalArt.ART[m.art] || {}).grand);
      const met = grand ? MedalArt.M.gold : (MedalArt.M[style.rim] || MedalArt.M.gunmetal);
      // ребро: у обычных — круг из 72 узких граней, у лучистых — повторяет каждый луч звезды (24 луча, как на лице)
      const T = 14;
      const rgb = hex => [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16));
      const lo = rgb(met.lo), mid = rgb(met.mid), hi = rgb(met.hi);
      const tone = (lit, k) => 'rgb(' + mid.map((c, j) => Math.max(0, Math.min(255, Math.round((c + (hi[j] - c) * lit) * k)))).join(',') + ')';
      const dark = k => 'rgb(' + lo.map(c => Math.round(c * k)).join(',') + ')';
      const facets = [];   // центр грани, длина, поворот и куда смотрит (для света)
      if (grand) {
        const n = 24, pt = i => { const a = i * Math.PI / n, r = (i % 2 ? 110 : 122) - 0.5; return [r * Math.sin(a), -r * Math.cos(a)]; };
        for (let i = 0; i < n * 2; i++) {
          const [x1, y1] = pt(i), [x2, y2] = pt(i + 1), dx = x2 - x1, dy = y2 - y1;
          facets.push({ x: (x1 + x2) / 2, y: (y1 + y2) / 2, len: Math.hypot(dx, dy) + 0.8,
            rot: Math.atan2(dy, dx) * 180 / Math.PI, face: Math.atan2(dy, dx) * 180 / Math.PI });
        }
      } else {
        const R = 119.4, N = 72, len = 2 * Math.PI * R / N + 1.5;
        for (let i = 0; i < N; i++) { const a = 360 / N * i, r = a * Math.PI / 180; facets.push({ x: R * Math.sin(r), y: -R * Math.cos(r), len, rot: a, face: a }); }
      }
      for (const f of facets) {
        const lit = (Math.cos((f.face - 25) * Math.PI / 180) + 1) / 2, sm = lit * lit * (3 - 2 * lit);
        const e = document.createElement('div');
        e.className = 'edge';
        e.style.cssText = `width:${f.len}px;height:${T}px;margin:${-T / 2}px 0 0 ${-f.len / 2}px;
          background:linear-gradient(180deg, ${dark(0.8 + sm * 0.3)}, ${tone(sm, 0.72 + sm * 0.4)} 50%, ${dark(0.8 + sm * 0.3)});
          transform:translate(${f.x.toFixed(2)}px,${f.y.toFixed(2)}px) rotateZ(${f.rot.toFixed(2)}deg) rotateX(90deg)`;
        coin.appendChild(e);
      }
      const face = (svg, back) => {
        const f = document.createElement('div');
        f.className = 'face' + (grand ? ' grand' : '');
        f.style.transform = back ? `rotateY(180deg) translateZ(${T / 2}px)` : `translateZ(${T / 2}px)`;
        f.innerHTML = svg.replace('viewBox="-4 -4 248 248"', 'viewBox="0 0 240 240"') + '<div class="sheen-mask"><div class="sheen"></div></div>' +
          (grand ? `<div class="ray-glint" style="clip-path:polygon(${STAR_CLIP})"></div>` : '');
        coin.appendChild(f);
      };
      face(MedalArt.medal(medalOpts(m)), false);
      face(coinBack(m), true);
      // свечение за монетой — в цвет медали
      const o = medalOpts(m), f = (grand && o.grandField) || o.field;
      const col = grand ? '#F2B53A' : (f && f.enamel) || (MedalArt.M[o.rim] || MedalArt.M.gunmetal).mid;
      $('coinHalo').style.setProperty('--halo', hexA(col, document.documentElement.classList.contains('dark') ? .5 : .42));
      return grand;
    }
    // Конфетти для особых медалей при вручении
    function confetti(colors) {
      const box = $('confetti');
