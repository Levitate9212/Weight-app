<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Фитнес Трекер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181b22;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.07);
    }

    @media (prefers-color-scheme: light) {
      body.tg-light {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: rgba(0, 0, 0, 0.08);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, var(--bg-color));
      color: var(--tg-theme-text-color, var(--text-main));
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 12px;
    }

    .cards-grid {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    .user-card {
      background: var(--tg-theme-secondary-bg-color, var(--card-bg));
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .user-card:hover {
      transform: translateY(-2px);
    }
    .user-card.active {
      border-color: #3b82f6;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .user-name {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    .weight-display {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
    }
    .weight-display span {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .progress-bar-bg {
      background: rgba(125, 125, 125, 0.15);
      border-radius: 6px;
      height: 5px;
      overflow: hidden;
      margin: 8px 0 5px 0;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.6s ease;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .chart-card {
      background: var(--tg-theme-secondary-bg-color, var(--card-bg));
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 14px 12px 10px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 260px;
    }

    .chart-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 6px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chart-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
    }

    .filter-tabs {
      display: flex;
      background: rgba(125, 125, 125, 0.12);
      border-radius: 9px;
      padding: 3px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 180px;
    }

    #status-msg {
      text-align: center;
      margin-top: 60px;
      font-size: 15px;
      color: var(--text-muted);
    }
    .error-icon { font-size: 40px; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="status-msg">Синхронизация данных... ⏳</div>

    <div id="content" style="display: none;">
      <div id="cards-container" class="cards-grid"></div>

      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">Динамика веса</span>
          <div id="filter-tabs" class="filter-tabs">
            <button class="tab-btn active" onclick="switchView('all')">Все</button>
          </div>
        </div>
        <div class="chart-wrapper">
          <canvas id="weightChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.colorScheme === 'light') document.body.classList.add('tg-light');
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let rawData = null;
    let chartInstance = null;
    let currentView = 'all';

    const USER_COLORS = [
      { border: '#10b981', bg: 'rgba(16, 185, 129, 0.15)' },
      { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.15)' },
      { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.15)' }
    ];

    function fetchJSONP(url) {
      return new Promise((resolve, reject) => {
        const cb = 'gasCb_' + Math.round(100000 * Math.random());
        let script;
        const timeout = setTimeout(() => { cleanup(); reject(new Error('Таймаут')); }, 10000);

        function cleanup() {
          if (window[cb]) delete window[cb];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          clearTimeout(timeout);
        }

        window[cb] = (data) => { cleanup(); resolve(data); };
        script = document.createElement('script');
        script.src = `${url}&callback=${cb}`;
        script.onerror = () => { cleanup(); reject(new Error('Ошибка загрузки')); };
        document.body.appendChild(script);
      });
    }

    async function loadData() {
      const statusEl = document.getElementById('status-msg');
      const userId = tg?.initDataUnsafe?.user?.id;

      if (!userId) {
        statusEl.innerHTML = `<span class="error-icon">🔒</span><b>Приватный доступ</b><br>Запустите через Telegram-бота.`;
        return;
      }

      try {
        const data = await fetchJSONP(`${API_URL}?userId=${userId}`);
        if (data.error) {
          statusEl.innerHTML = `<span class="error-icon">⛔️</span>${data.message || 'Ошибка доступа'}`;
          return;
        }

        rawData = data;
        statusEl.style.display = 'none';

        const contentEl = document.getElementById('content');
        contentEl.style.display = 'flex';

        buildTabs(data);
        renderCards(data);
        renderChart();

      } catch (err) {
        statusEl.innerHTML = `<span class="error-icon">⚠️</span>Ошибка подключения к базе данных.`;
      }
    }

    function buildTabs(users) {
      const tabsContainer = document.getElementById('filter-tabs');
      tabsContainer.innerHTML = '<button class="tab-btn active" onclick="switchView(\'all\')">Все</button>';

      for (const uid in users) {
        const u = users[uid];
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.innerText = u.name;
        btn.onclick = () => switchView(uid);
        tabsContainer.appendChild(btn);
      }
    }

    function switchView(viewKey) {
      currentView = viewKey;

      const btns = document.querySelectorAll('.tab-btn');
      btns.forEach(b => {
        const isMatch = (viewKey === 'all' && b.innerText === 'Все') || 
                        (rawData[viewKey] && b.innerText === rawData[viewKey].name);
        b.classList.toggle('active', isMatch);
      });

      const cards = document.querySelectorAll('.user-card');
      cards.forEach(c => {
        c.classList.toggle('active', c.dataset.uid === viewKey);
      });

      renderChart();
    }

    function renderCards(users) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      let colorIdx = 0;

      for (const uid in users) {
        const u = users[uid];
        if (!u.entries || u.entries.length === 0) continue;

        const color = USER_COLORS[colorIdx % USER_COLORS.length].border;
        const currentWeight = u.entries[u.entries.length - 1].weight;
        const startWeight = u.start || u.entries[0].weight;
        const target = u.target;

        let percent = 0;
        let diffStr = '';

        if (target) {
          const isLosing = startWeight >= target;
          const totalDist = Math.abs(startWeight - target);
          const doneDist = isLosing ? (startWeight - currentWeight) : (currentWeight - startWeight);
          percent = totalDist > 0 ? (doneDist / totalDist) * 100 : 100;
          percent = Math.max(0, Math.min(100, Math.round(percent)));

          const leftKg = Math.abs(currentWeight - target).toFixed(1);
          diffStr = currentWeight === target ? '🎉 Цель взята!' : `Осталось ${leftKg} кг`;
        }

        const card = document.createElement('div');
        card.className = 'user-card';
        card.dataset.uid = uid;
        card.onclick = () => switchView(uid);

        card.innerHTML = `
          <div class="card-top">
            <span class="user-name">
              <span class="status-dot" style="background: ${color}"></span>
              ${u.name}
            </span>
            <span style="font-size: 11px; color: var(--text-muted);">${target ? 'Цель: ' + target + ' кг' : 'Без цели'}</span>
          </div>
          <div class="weight-display">${currentWeight}<span>кг</span></div>
          ${target ? `
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percent}%; background: ${color}"></div>
            </div>
            <div class="card-footer">
              <span>${diffStr}</span>
              <span>Прогресс: <b>${percent}%</b></span>
            </div>
          ` : `
            <div class="card-footer" style="margin-top: 6px;">
              <span>Команда: /цель [кг]</span>
            </div>
          `}
        `;
        container.appendChild(card);
        colorIdx++;
      }
    }

    function renderChart() {
      const ctx = document.getElementById('weightChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const allTimestamps = new Set();
      for (const uid in rawData) {
        if (rawData[uid].entries) {
          rawData[uid].entries.forEach(e => allTimestamps.add(e.dateStr));
        }
      }
      const labels = Array.from(allTimestamps);

      const datasets = [];
      let cIdx = 0;

      for (const uid in rawData) {
        if (currentView !== 'all' && currentView !== uid) {
          cIdx++;
          continue;
        }

        const u = rawData[uid];
        if (!u.entries || u.entries.length === 0) {
          cIdx++;
          continue;
        }

        const colorCfg = USER_COLORS[cIdx % USER_COLORS.length];

        const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.clientHeight || 300);
        gradient.addColorStop(0, colorCfg.bg);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');

        datasets.push({
          label: u.name,
          data: labels.map(l => {
            const match = u.entries.find(e => e.dateStr === l);
            return match ? match.weight : null;
          }),
          borderColor: colorCfg.border,
          backgroundColor: gradient,
          fill: true,
          tension: 0.35,
          borderWidth: 3,
          pointRadius: 5,
          pointHoverRadius: 7,
          pointBackgroundColor: colorCfg.border,
          pointBorderColor: '#ffffff',
          pointBorderWidth: 1.5,
          spanGaps: true
        });

        if (currentView === uid && u.target) {
          datasets.push({
            label: `Цель (${u.target} кг)`,
            data: labels.map(() => u.target),
            borderColor: colorCfg.border,
            borderDash: [6, 6],
            borderWidth: 2,
            pointRadius: 0,
            fill: false
          });
        }

        cIdx++;
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          resizeDelay: 0,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              display: (currentView === 'all'),
              position: 'top',
              labels: {
                boxWidth: 10,
                boxHeight: 10,
                usePointStyle: true,
                color: '#9ca3af',
                font: { size: 12, weight: '600' }
              }
            },
            tooltip: {
              backgroundColor: '#1f2937',
              titleColor: '#f9fafb',
              bodyColor: '#f3f4f6',
              padding: 10,
              cornerRadius: 10,
              callbacks: {
                label: (ctx) => ` ${ctx.dataset.label}: ${ctx.parsed.y} кг`
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#6b7280', font: { size: 11, weight: '500' } }
            },
            y: {
              grid: { color: 'rgba(125, 125, 125, 0.08)', drawBorder: false },
              ticks: {
                color: '#6b7280',
                font: { size: 11, weight: '500' },
                callback: (val) => val + ' кг'
              },
              grace: currentView !== 'all' ? '15%' : '5%'
            }
          }
        }
      });
    }

    window.addEventListener('resize', () => {
      if (chartInstance) {
        chartInstance.resize();
      }
    });

    loadData();
  </script>
</body>
</html>
