<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Tracker | Дашборд</title>
  <!-- Telegram WebApp Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js для красивых графиков -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts & Tailwind CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            darkBg: '#0b0f19',
            cardBg: '#131c2e',
            accentGreen: '#10b981',
            accentRed: '#ef4444',
            accentBlue: '#3b82f6',
            accentNeon: '#22c55e'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen pb-12">

  <!-- Шапка -->
  <header class="bg-cardBg border-b border-gray-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🏆</span>
      <h1 class="font-bold text-lg tracking-wide text-white">WEIGHT TRACKER</h1>
    </div>
    <!-- Переключатель атлетов (если пользователей несколько) -->
    <div id="userSelectorContainer" class="hidden">
      <select id="userSelect" class="bg-darkBg text-sm border border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-accentBlue text-white font-medium">
        <!-- Заполняется динамически -->
      </select>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- Статус загрузки / Ошибки -->
    <div id="loader" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-accentBlue mb-4"></div>
      <p class="text-gray-400 text-sm">Загружаем данные атлетов...</p>
    </div>

    <div id="errorBox" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-xl mb-6 text-sm"></div>

    <!-- Основной контент (скрыт до загрузки) -->
    <div id="dashboardContent" class="hidden space-y-6">

      <!-- Карточки метрик -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-cardBg border border-gray-800/80 rounded-2xl p-4 shadow-md">
          <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Текущий вес</p>
          <p id="currWeight" class="text-2xl font-extrabold text-white mt-1">-</p>
          <span id="currDiffBadge" class="text-xs font-semibold px-2 py-0.5 rounded-md mt-2 inline-block">--</span>
        </div>

        <div class="bg-cardBg border border-gray-800/80 rounded-2xl p-4 shadow-md">
          <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Тренд (SMA 7)</p>
          <p id="trendWeight" class="text-2xl font-extrabold text-accentBlue mt-1">-</p>
          <span class="text-xs text-gray-400 mt-2 inline-block">Истинный baseline</span>
        </div>

        <div class="bg-cardBg border border-gray-800/80 rounded-2xl p-4 shadow-md">
          <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Старт</p>
          <p id="startWeight" class="text-2xl font-extrabold text-gray-200 mt-1">-</p>
          <span class="text-xs text-gray-400 mt-2 inline-block">Точка отсчета</span>
        </div>

        <div class="bg-cardBg border border-gray-800/80 rounded-2xl p-4 shadow-md">
          <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Цель</p>
          <p id="targetWeight" class="text-2xl font-extrabold text-accentNeon mt-1">-</p>
          <span id="progressText" class="text-xs text-gray-400 mt-2 inline-block">Цель: --%</span>
        </div>
      </div>

      <!-- Блок графика -->
      <div class="bg-cardBg border border-gray-800/80 rounded-2xl p-5 shadow-xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-2">
          <div>
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <span>📈</span> Динамика веса и линия тренда
            </h2>
            <p class="text-xs text-gray-400">Фактические замеры и сглаженная кривая скользящего среднего</p>
          </div>
          <div class="flex items-center space-x-3 text-xs font-medium">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> Факт</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span> Тренд (SMA)</span>
          </div>
        </div>

        <div class="relative w-full h-[320px]">
          <canvas id="weightChart"></canvas>
        </div>
      </div>

      <!-- Последние заметки и чек-ины -->
      <div class="bg-cardBg border border-gray-800/80 rounded-2xl p-5 shadow-xl">
        <h3 class="text-base font-bold text-white mb-3 flex items-center gap-2">
          <span>📝</span> Последние отметки и сон
        </h3>
        <div id="notesContainer" class="space-y-3">
          <!-- Заполняется динамически -->
        </div>
      </div>

    </div>
  </main>

  <script>
    // ⚠️ ВСТАВЬТЕ СЮДУ ССЫЛКУ НА ВАШЕ РАЗВЕРНУТОЕ WEB-ПРИЛОЖЕНИЕ GOOGLE APPS SCRIPT (заканчивается на /exec)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;

    // Инициализация при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
      // Инициализация Telegram WebApp
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      fetchData();
    });

    function fetchData() {
      const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "";
      
      // Формируем запрос с передачей initData для проверки прав
      const url = `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(initData)}&callback=handleData`;

      // Используем JSONP для обхода CORS ограничений Google Apps Script
      const script = document.createElement('script');
      script.src = url;
      script.onerror = () => {
        showError("⚠️ Не удалось загрузить данные с сервера. Проверьте правильность URL скрипта.");
      };
      document.body.appendChild(script);
    }

    // Глобальный callback для JSONP
    window.handleData = function(response) {
      document.getElementById('loader').classList.add('hidden');

      if (response.error) {
        showError(response.message || "Ошибка авторизации или доступа.");
        return;
      }

      globalData = response;
      const userIds = Object.keys(globalData);

      if (userIds.length === 0) {
        showError("⚠️ В базе пока нет данных по атлетам.");
        return;
      }

      // Настраиваем переключатель пользователей
      const userSelect = document.getElementById('userSelect');
      userSelect.innerHTML = '';
      
      userIds.forEach(uid => {
        const user = globalData[uid];
        const opt = document.createElement('option');
        opt.value = uid;
        opt.textContent = user.name;
        userSelect.appendChild(opt);
      });

      if (userIds.length > 1) {
        document.getElementById('userSelectorContainer').classList.remove('hidden');
      }

      // По умолчанию берем первого атлета или текущего пользователя из Telegram
      let defaultUid = userIds[0];
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        const tgId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        if (globalData[tgId]) {
          defaultUid = tgId;
        }
      }

      userSelect.value = defaultUid;
      activeUserId = defaultUid;

      userSelect.addEventListener('change', (e) => {
        activeUserId = e.target.value;
        renderDashboard(globalData[activeUserId]);
      });

      document.getElementById('dashboardContent').classList.remove('hidden');
      renderDashboard(globalData[activeUserId]);
    };

    function showError(msg) {
      document.getElementById('loader').classList.add('hidden');
      const errBox = document.getElementById('errorBox');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    // Расчет скользящей средней (SMA / Линия тренда) за 7 точек
    function calculateSMA(entries, windowSize = 7) {
      return entries.map((entry, index, arr) => {
        const start = Math.max(0, index - windowSize + 1);
        const subset = arr.slice(start, index + 1);
        const sum = subset.reduce((acc, curr) => acc + curr.weight, 0);
        return parseFloat((sum / subset.length).toFixed(1));
      });
    }

    function renderDashboard(userData) {
      if (!userData || !userData.entries || userData.entries.length === 0) {
        showError("У выбранного атлета пока нет записей о весе.");
        return;
      }

      const entries = userData.entries; // уже отсортированы по времени
      const latest = entries[entries.length - 1];
      const prev = entries.length > 1 ? entries[entries.length - 2] : latest;
      const start = userData.start || entries[0].weight;
      const target = userData.target;

      // Метрики
      document.getElementById('currWeight').textContent = `${latest.weight} кг`;
      document.getElementById('startWeight').textContent = `${start} кг`;
      document.getElementById('targetWeight').textContent = target ? `${target} кг` : "Не задана";

      // Разница за сутки
      const diffDay = parseFloat((latest.weight - prev.weight).toFixed(1));
      const badge = document.getElementById('currDiffBadge');
      if (diffDay < 0) {
        badge.textContent = `${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-2 py-0.5 rounded-md mt-2 inline-block bg-emerald-500/20 text-emerald-400";
      } else if (diffDay > 0) {
        badge.textContent = `+${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-2 py-0.5 rounded-md mt-2 inline-block bg-red-500/20 text-red-400";
      } else {
        badge.textContent = `Без изменений`;
        badge.className = "text-xs font-semibold px-2 py-0.5 rounded-md mt-2 inline-block bg-gray-700 text-gray-300";
      }

      // Расчет тренда (SMA)
      const smaValues = calculateSMA(entries);
      const currentTrend = smaValues[smaValues.length - 1];
      document.getElementById('trendWeight').textContent = `${currentTrend} кг`;

      // Процент выполнения цели
      if (target) {
        const totalDist = Math.abs(target - start);
        const currentDist = Math.abs(latest.weight - start);
        let pct = totalDist > 0 ? Math.round((currentDist / totalDist) * 100) : 100;
        pct = Math.max(0, Math.min(100, pct));
        document.getElementById('progressText').textContent = `Выполнение цели: ${pct}%`;
      } else {
        document.getElementById('progressText').textContent = `Задайте цель через /goal`;
      }

      // Рендер графика Chart.js
      const labels = entries.map(e => e.dateStr);
      const weights = entries.map(e => e.weight);

      if (chartInstance) {
        chartInstance.destroy();
      }

      const ctx = document.getElementById('weightChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Фактический вес',
              data: weights,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              borderWidth: 2.5,
              pointRadius: 4,
              pointBackgroundColor: '#3b82f6',
              tension: 0.2,
              fill: true
            },
            {
              label: 'Линия тренда (SMA 7)',
              data: smaValues,
              borderColor: '#10b981',
              borderWidth: 2,
              pointRadius: 0,
              borderDash: [5, 5],
              tension: 0.3,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: '#1e293b',
              titleColor: '#f8fafc',
              bodyColor: '#cbd5e1',
              borderColor: '#334155',
              borderWidth: 1
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#94a3b8', font: { size: 11 } }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#94a3b8', font: { size: 11 } }
            }
          }
        }
      });

      // Рендер списка последних заметок
      const notesContainer = document.getElementById('notesContainer');
      notesContainer.innerHTML = '';
      
      const recentEntries = [...entries].reverse().slice(0, 5);
      recentEntries.forEach(ent => {
        if (!ent.note) return;
        const div = document.createElement('div');
        div.className = "bg-darkBg/60 border border-gray-800 rounded-xl p-3 text-xs";
        div.innerHTML = `
          <div class="flex justify-between items-center text-gray-400 mb-1">
            <span class="font-semibold text-gray-200">${ent.dateStr}</span>
            <span class="text-accentBlue font-bold">${ent.weight} кг</span>
          </div>
          <p class="text-gray-300">${ent.note}</p>
        `;
        notesContainer.appendChild(div);
      });

      if (notesContainer.innerHTML === '') {
        notesContainer.innerHTML = '<p class="text-gray-500 text-xs italic">Нет заметок за последнее время.</p>';
      }
    }
  </script>
</body>
</html>
