<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Weight Tracker</title>
  <!-- Пускач (14.11): ссылка в BotFather ведёт сюда и больше не меняется. Каждое открытие спрашивает version.json
       (без кэша) и открывает app.html?v=<версия>, поэтому Telegram всегда показывает свежее приложение.
       version.json пишет GitHub Action «Версия приложения» после каждого изменения app.html. -->
  <style>html, body { margin: 0; height: 100%; background: #17212B; } html.light, html.light body { background: #F4F1EA; }</style>
  <script>
    (function () {
      var h = location.hash, light = false;
      // фон как у заставки приложения: тёмный или светлый по теме Telegram (иначе по теме телефона)
      try {
        var m = /tgWebAppThemeParams=([^&]*)/.exec(h), bg = m && JSON.parse(decodeURIComponent(m[1])).bg_color;
        if (bg && /^#[0-9a-f]{6}$/i.test(bg)) { var n = parseInt(bg.slice(1), 16); light = ((n >> 16) * .299 + (n >> 8 & 255) * .587 + (n & 255) * .114) > 140; }
        else light = !!(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      } catch (e) {}
      if (light) document.documentElement.className = 'light';
      var done = false;
      function go(v) {
        if (done) return; done = true;
        // остальные параметры Telegram (если есть) и хэш с данными входа передаём как есть
        var q = location.search.replace(/^\?/, '').split('&').filter(function (p) { return p && !/^v=/.test(p); });
        q.unshift('v=' + encodeURIComponent(v || Math.floor(Date.now() / 36e5)));
        location.replace('app.html?' + q.join('&') + h);
      }
      setTimeout(function () { go(''); }, 2500);
      try {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : {}; })
          .then(function (j) { go(j && j.v); }, function () { go(''); });
      } catch (e) { go(''); }
    })();
  </script>
</head>
<body></body>
</html>
