<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Прогресс веса</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #181818);
      color: var(--tg-theme-text-color, #ffffff);
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #242424);
      border-radius: 12px; padding: 14px; margin-bottom: 16px;
    }
    #status-msg {
      text-align: center; margin-top: 60px; font-size: 16px; color: #888;
      line-height: 1.5; padding: 0 20px;
    }
    .error-icon { font-size: 40px; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>

  <div id="status-msg">Загрузка данных... ⏳</div>

  <div id="content" style="display: none;">
    <div class="card">
      <canvas id="weightChart"></canvas>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Твоя ссылка на скрипт Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxS18308NuajX-h0sop04MV3S30nQfyvfXbsNpD3vKsckGl2ibuggxrFDaQ/exec";

    async function loadData() {
      const statusEl = document.getElementById('status-msg');
      const userId = tg?.initDataUnsafe?.user?.id;

      // Если открыто в обычном браузере — блокируем
      if (!userId) {
        statusEl.innerHTML = `
          <span class="error-icon">🔒</span>
          <b>Приватное приложение</b><br>
          Откройте график через Telegram-бота.
        `;
        return;
      }

      // Запрос к Google Таблице с передачей твоего ID
      try {
        const res = await fetch(`${API_URL}?userId=${userId}`);
        const data = await res.json();

        if (data.error === "unauthorized") {
          statusEl.innerHTML = `
            <span class="error-icon">⛔️</span>
            <b>Доступ запрещен</b><br>
            Ваш ID (${userId}) не найден в списке участников.
          `;
          return;
        }

        statusEl.style.display = 'none';
        document.getElementById('content').style.display = 'block';
        renderChart(data);

      } catch (err) {
        statusEl.innerHTML = `
          <span class="error-icon">⚠️</span>
          Ошибка подключения к базе данных.
        `;
      }
    }

    function renderChart(users) {
      const ctx = document.getElementById('weightChart').getContext('2d');
      const datasets = [];
      let labels = [];

      const colors = ['#10b981', '#3b82f6', '#f59e0b'];
      let cIdx = 0;

      for (const uid in users) {
        const u = users[uid];
        if (labels.length === 0) {
          labels = u.entries.map(e => e.dateStr);
        }
        datasets.push({
          label: u.name,
          data: u.entries.map(e => e.weight),
          borderColor: colors[cIdx % colors.length],
          backgroundColor: colors[cIdx % colors.length],
          tension: 0.3,
          borderWidth: 2
        });
        cIdx++;
      }

      new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#aaa' } } },
          scales: {
            x: { ticks: { color: '#888' }, grid: { display: false } },
            y: { ticks: { color: '#888' }, grid: { color: '#333' } }
          }
        }
      });
    }

    loadData();
  </script>
</body>
</html>
