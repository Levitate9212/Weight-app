<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Tracker</title>
  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            iosBlack: '#000000',
            iosCard: '#1c1c1e',
            iosCardSecondary: '#2c2c2e',
            iosBlue: '#0a84ff',
            iosGreen: '#30d158',
            iosRed: '#ff453a',
            iosGray: '#8e8e93',
            iosBorder: 'rgba(255, 255, 255, 0.08)'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-iosBlack text-white font-sans antialiased min-h-screen pb-16 selection:bg-iosBlue selection:text-white">

  <!-- iOS Style Navigation Bar -->
  <header class="sticky top-0 z-50 bg-iosBlack/80 backdrop-blur-xl border-b border-iosBorder px-5 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-iosBlue to-indigo-500 flex items-center justify-center text-sm shadow-lg shadow-iosBlue/20">🏆</div>
      <h1 class="font-semibold text-lg tracking-tight">Weight Tracker</h1>
    </div>
    <!-- Селектор пользователя в стиле iOS Picker -->
    <div id="userSelectorContainer" class="hidden">
      <select id="userSelect" class="bg-iosCardSecondary text-sm font-medium border border-iosBorder rounded-full px-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-iosBlue text-white appearance-none pr-8 cursor-pointer">
        <!-- Заполняется динамически -->
      </select>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-5">

    <!-- Лоадер -->
    <div id="loader" class="flex flex-col items-center justify-center py-32">
      <div class="animate-spin rounded-full h-10 w-10 border-2 border-iosBlue border-t-transparent mb-3"></div>
      <p class="text-iosGray text-sm font-medium">Загрузка данных...</p>
    </div>

    <!-- Ошибка -->
    <div id="errorBox" class="hidden bg-iosRed/20 border border-iosRed/30 text-iosRed px-4 py-3 rounded-2xl text-sm font-medium"></div>

    <!-- Основной дашборд -->
    <div id="dashboardContent" class="hidden space-y-5">

      <!-- Главная карточка текущего веса (iOS Widget Style) -->
      <div class="bg-iosCard border border-iosBorder rounded-3xl p-6 relative overflow-hidden shadow-2xl">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-iosBlue/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="flex justify-between items-start">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-iosGray">Текущий вес</p>
            <p id="currWeight" class="text-4xl font-bold tracking-tight mt-1">-</p>
          </div>
          <span id="currDiffBadge" class="text-xs font-semibold px-3 py-1 rounded-full border border-iosBorder">--</span>
        </div>

        <div class="grid grid-cols-3 gap-3 mt-6 pt-5 border-t border-iosBorder/60">
          <div>
            <p class="text-[11px] font-medium text-iosGray">Тренд (SMA 7)</p>
            <p id="trendWeight" class="text-base font-semibold text-iosBlue mt-0.5">-</p>
          </div>
          <div>
            <p class="text-[11px] font-medium text-iosGray">Старт</p>
            <p id="startWeight" class="text-base font-semibold text-white mt-0.5">-</p>
          </div>
          <div>
            <p class="text-[11px] font-medium text-iosGray">Цель</p>
            <p id="targetWeight" class="text-base font-semibold text-iosGreen mt-0.5">-</p>
          </div>
        </div>
      </div>

      <!-- График (iOS Card Style) -->
      <div class="bg-iosCard border border-iosBorder rounded-3xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-5">
          <div>
            <h2 class="text-base font-semibold tracking-tight">Динамика и тренд</h2>
            <p class="text-xs text-iosGray mt-0.5">Фактические замеры и линия скользящего среднего</p>
          </div>
          <div class="flex items-center space-x-3 text-xs font-medium text-iosGray">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-iosBlue inline-block"></span> Факт</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-iosGreen inline-block"></span> Тренд</span>
          </div>
        </div>

        <div class="relative w-full h-[280px]">
          <canvas id="weightChart"></canvas>
        </div>
        
        <div id="progressText" class="mt-4 text-center text-xs font-medium text-iosGray">
          Прогресс цели: --%
        </div>
      </div>

    </div>
  </main>

  <script>
    // ⚠️ Вставьте ссылку на развернутое веб-приложение Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      fetchData();
    });

    function fetchData() {
      const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "";
      const url = `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(initData)}&callback=handleData`;

      const script = document.createElement('script');
      script.src = url;
      script.onerror = () => {
        showError("Не удалось подключиться к серверу скрипта.");
      };
      document.body.appendChild(script);
    }

    window.handleData = function(response) {
      document.getElementById('loader').classList.add('hidden');

      if (response.error) {
        showError(response.message || "Ошибка авторизации.");
        return;
      }

      globalData = response;
      const userIds = Object.keys(globalData);

      if (userIds.length === 0) {
        showError("В базе данных нет записей.");
        return;
      }

      const userSelect = document.getElementById('userSelect');
      userSelect.innerHTML = '';
      
      userIds.forEach(uid => {
        const user = globalData[uid];
        const opt = document.createElement('option');
        opt.value = uid;
        opt.textContent = user.name;
        userSelect.appendChild(opt);
      });

      if (userIds.length > 1) {
        document.getElementById('userSelectorContainer').classList.remove('hidden');
      }

      let defaultUid = userIds[0];
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        const tgId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        if (globalData[tgId]) defaultUid = tgId;
      }

      userSelect.value = defaultUid;
      activeUserId = defaultUid;

      userSelect.addEventListener('change', (e) => {
        activeUserId = e.target.value;
        renderDashboard(globalData[activeUserId]);
      });

      document.getElementById('dashboardContent').classList.remove('hidden');
      renderDashboard(globalData[activeUserId]);
    };

    function showError(msg) {
      document.getElementById('loader').classList.add('hidden');
      const errBox = document.getElementById('errorBox');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    function calculateSMA(entries, windowSize = 7) {
      return entries.map((entry, index, arr) => {
        const start = Math.max(0, index - windowSize + 1);
        const subset = arr.slice(start, index + 1);
        const sum = subset.reduce((acc, curr) => acc + curr.weight, 0);
        return parseFloat((sum / subset.length).toFixed(1));
      });
    }

    function renderDashboard(userData) {
      if (!userData || !userData.entries || userData.entries.length === 0) {
        showError("У пользователя нет данных о весе.");
        return;
      }

      const entries = userData.entries;
      const latest = entries[entries.length - 1];
      const prev = entries.length > 1 ? entries[entries.length - 2] : latest;
      const start = userData.start || entries[0].weight;
      const target = userData.target;

      document.getElementById('currWeight').textContent = `${latest.weight} кг`;
      document.getElementById('startWeight').textContent = `${start} кг`;
      document.getElementById('targetWeight').textContent = target ? `${target} кг` : "—";

      const diffDay = parseFloat((latest.weight - prev.weight).toFixed(1));
      const badge = document.getElementById('currDiffBadge');
      if (diffDay < 0) {
        badge.textContent = `${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-3 py-1 rounded-full bg-iosGreen/15 text-iosGreen border border-iosGreen/20";
      } else if (diffDay > 0) {
        badge.textContent = `+${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-3 py-1 rounded-full bg-iosRed/15 text-iosRed border border-iosRed/20";
      } else {
        badge.textContent = `Без изменений`;
        badge.className = "text-xs font-semibold px-3 py-1 rounded-full bg-iosCardSecondary text-iosGray border border-iosBorder";
      }

      const smaValues = calculateSMA(entries);
      document.getElementById('trendWeight').textContent = `${smaValues[smaValues.length - 1]} кг`;

      if (target) {
        const totalDist = Math.abs(target - start);
        const currentDist = Math.abs(latest.weight - start);
        let pct = totalDist > 0 ? Math.round((currentDist / totalDist) * 100) : 100;
        pct = Math.max(0, Math.min(100, pct));
        document.getElementById('progressText').textContent = `Выполнение цели: ${pct}%`;
      } else {
        document.getElementById('progressText').textContent = `Цель не установлена (/goal)`;
      }

      const labels = entries.map(e => e.dateStr);
      const weights = entries.map(e => e.weight);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('weightChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Факт',
              data: weights,
              borderColor: '#0a84ff',
              backgroundColor: 'rgba(10, 132, 255, 0.08)',
              borderWidth: 3,
              pointRadius: 4,
              pointBackgroundColor: '#0a84ff',
              tension: 0.35,
              fill: true
            },
            {
              label: 'Тренд',
              data: smaValues,
              borderColor: '#30d158',
              borderWidth: 2.5,
              pointRadius: 0,
              borderDash: [4, 4],
              tension: 0.35,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: '#2c2c2e',
              titleColor: '#ffffff',
              bodyColor: '#ebebf5',
              borderColor: 'rgba(255,255,255,0.1)',
              borderWidth: 1,
              padding: 10,
              cornerRadius: 12
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#8e8e93', font: { size: 11, family: 'Inter' } }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#8e8e93', font: { size: 11, family: 'Inter' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
