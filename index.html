    // MedalB.medal(opts, живая?) — SVG медали; живая двигается (SMIL), иначе стоит и идёт в картинку
    // =====================================================================
    const MedalB = (function () {
      // ===== Живые рисунки медалей (стиль Б): у каждой медали свой цвет рисунка и своё движение =====
      // L(A, C, x): A — рисунок, C — гравировка, x — помощники. Без анимации (x.anim = false) те же цвета, но всё стоит.
      const lRays = (cx, cy, r1, r2, n, w, a0 = 0) => [...Array(n)].map((_, i) => {
        const a = a0 + i * 2 * Math.PI / n, a1 = a - w, a2 = a + w;
        return `<polygon points="${(cx + r1 * Math.cos(a1)).toFixed(1)},${(cy + r1 * Math.sin(a1)).toFixed(1)} ${(cx + r2 * Math.cos(a)).toFixed(1)},${(cy + r2 * Math.sin(a)).toFixed(1)} ${(cx + r1 * Math.cos(a2)).toFixed(1)},${(cy + r1 * Math.sin(a2)).toFixed(1)}"/>`;
      }).join('');
      // элемент с дочерними анимациями: <polyline …/> → <polyline … attrs>kids</polyline>
      const kids = (el, attrs, inner) => el.replace(/^<(\w+)/, '<$1 ' + attrs).replace(/\/>$/, `>${inner}</${el.match(/^<(\w+)/)[1]}>`);
      const els = s => (s || '').match(/<(path|circle|rect|polygon|ellipse|polyline)\b[^>]*\/>/g) || [];
      function liveKit(id, anim) {
        const ease = n => Array(n).fill('.45 0 .55 1').join(';');
        const K = {
          anim,
          // покачивание вверх-вниз
          bob: (dy, dur, begin = 0) => anim ? `<animateTransform attributeName="transform" type="translate" values="0 0;0 ${dy};0 0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines="${ease(2)}" additive="sum"/>` : '',
          slide: (dx, dy, dur, begin = 0) => anim ? `<animateTransform attributeName="transform" type="translate" values="0 0;${dx} ${dy};0 0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines="${ease(2)}" additive="sum"/>` : '',
          swing: (deg, cx, cy, dur, begin = 0) => anim ? `<animateTransform attributeName="transform" type="rotate" values="${-deg} ${cx} ${cy};${deg} ${cx} ${cy};${-deg} ${cx} ${cy}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines="${ease(2)}" additive="sum"/>` : '',
          spin: (cx, cy, dur, dir = 1) => anim ? `<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="${360 * dir} ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite" additive="sum"/>` : '',
          // пульс вокруг точки: scale с переносом центра
          pulse: (body, cx, cy, vals, dur, begin = 0) => anim
            ? `<g transform="translate(${cx} ${cy})"><g><animateTransform attributeName="transform" type="scale" values="${vals}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/><g transform="translate(${-cx} ${-cy})">${body}</g></g></g>`
            : body,
          blink: (lo, hi, dur, begin = 0) => anim ? `<animate attributeName="opacity" values="${lo};${hi};${lo}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>` : '',
          // нить рисуется и стирается (обводка по длине)
          draw: (len, dur, begin = 0) => anim ? `<animate attributeName="stroke-dashoffset" values="${len};0;0;${-len}" keyTimes="0;.45;.7;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>` : '',
          dash: len => anim ? `stroke-dasharray="${len} ${len}"` : '',
          // искры-угольки поднимаются и гаснут
          embers: (pts, col) => anim ? pts.map(([x, y, r, d, b]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" opacity="0"><animate attributeName="cy" values="${y};${y - 46}" dur="${d}s" begin="${b}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="${d}s" begin="${b}s" repeatCount="indefinite"/><animate attributeName="cx" values="${x};${x + 6};${x - 4}" dur="${d}s" begin="${b}s" repeatCount="indefinite"/></circle>`).join('') : '',
          // флажок развевается от древка (cx, cy)
          flag: (body, cx, cy, dur) => `<g fill="#E8434B" filter="url(#${id}sh)"><g transform="translate(${cx} ${cy})"><g>${anim ? `<animateTransform attributeName="transform" type="skewY" values="0;-7;0;5;0" dur="${dur}s" repeatCount="indefinite"/>` : ''}<g transform="translate(${-cx} ${-cy})">${body}</g></g></g></g>`,
          twinkle: (body, cx, cy, dur, begin = 0) => anim
            ? `<g transform="translate(${cx} ${cy})"><g><animateTransform attributeName="transform" type="scale" values="1;.55;1.15;1" keyTimes="0;.4;.7;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/><g transform="translate(${-cx} ${-cy})">${body}</g></g></g>`

      }
      const LIVE = {

            <path d="M120 46 C140 72,152 90,144 114 C139 128,129 134,120 134 C107 134,96 126,95 111 C94 98,103 89,108 80 C110 93,116 98,121 98 C118 82,115 64,120 46 Z" fill="#FF8A1E" filter="url(#${id}fg)" opacity=".75">${x.blink(.55, .9, 1.3)}</path>
            ${x.pulse(`<path d="${e[0].match(/d="([^"]+)"/)[1]}" fill="url(#${id}fl)"/>`, 120, 132, '1 1;1.05 .93;.96 1.07;1.03 .97;1 1', 1.1)}
            ${x.pulse(`<path d="${C.match(/d="([^"]+)"/)[1]}" fill="url(#${id}fc)"/>`, 120, 124, '1 1;.92 1.1;1.06 .9;1 1', .8, .2)}
          </g>`;
          return x.raised(e.slice(1).join('')) + flame + x.embers([[112, 92, 1.8, 1.6, 0], [128, 86, 1.4, 1.9, .5], [120, 80, 1.6, 2.2, 1], [106, 98, 1.2, 1.7, 1.4]], '#FFC23A');
        },
        // сон: жёлтый месяц светится, облако бело-голубое плывёт, звёзды мерцают
        moon: (A, C, x) => {

          return `<defs><linearGradient id="${id}mn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3A6"/><stop offset="1" stop-color="#FFC531"/></linearGradient>

            <g fill="#FFD54A" filter="url(#${id}mg)" opacity=".55">${e[0]}${x.blink(.35, .75, 3.2)}</g>
            <g fill="url(#${id}mn)">${e[0]}${x.swing(4, 140, 72, 6)}</g>
            <g fill="url(#${id}cd)" filter="url(#${id}sh)">${e.slice(1, 5).join('')}${x.slide(5, 0, 7)}</g>
            ${x.twinkle(`<g fill="#FFF3A6">${e[5]}</g>`, 86, 76, 2.1)}${x.twinkle(`<g fill="#FFF3A6">${e[6]}</g>`, 105.5, 56, 2.6, .8)}`;

        sunmoon: (A, C, x) => {

        sun: (A, C, x) => { const e = els(A); return `<g fill="#FFC531" filter="url(#${x.id}sh)"><g>${e.slice(1).join('')}${x.spin(120, 106, 18)}</g>${e[0]}</g>` + x.engrave(C); },

        bird: (A, C, x) => {

        dawn: (A, C, x) => {

        tree: (A, C, x) => {

        runner: (A, C, x) => `${x.pulse(`<g fill="#E8434B" filter="url(#${x.id}sh)">${A}</g>`, 120, 110, '1;1.07;1;1.04;1', 1.1)}

        belt: (A, C, x) => { const e = els(A), c = els(C); return x.raised(e[0]) + x.raised(`<g>${e[1]}${x.bob(7, 1.6)}</g>`) + x.engrave(c[0] + c[2]) + `<g fill="${x.cutCol}">${c[1]}${x.swing(14, 94, 112, 2.4)}</g>`; },
        calendar: (A, C, x) => { const c = els(C); return x.raised(A) + x.engrave(c[0]) + `<g fill="${x.cutCol}">${c[1]}${x.bob(6, 1.6)}</g>`; },
        scale: (A, C, x) => { const c = els(C); return x.raised(A) + x.engrave(c[0] + c[2]) + `<g fill="${x.cutCol}">${c[1]}${x.swing(20, 120, 100, 2.6)}</g>`; },
        dumbbell: (A, C, x) => x.raised(`<g>${A}${x.bob(-9, 1.4)}</g>`),
        sneaker: (A, C, x) => { const e = els(A); return x.raised(`<g>${e[0] + e[4]}${x.bob(-5, .7)}</g>`) + x.engrave(`<g>${C}${x.bob(-5, .7)}</g>`) + x.raised(`<g>${e.slice(1, 4).join('')}${x.slide(-10, 0, .7)}${x.blink(.3, 1, .7)}</g>`); },
        // мишень: стрела подрагивает, будто только что вошла
        target: (A, C, x, o) => {

          return x.raised(ring) + (o.paint || '') + `<g>${x.raised(arrow)}${x.engrave(C)}${x.swing(2.5, 112, 118, .35)}</g>`;

        peak: (A, C, x) => { const e = els(A); return x.raised(e[0] + e[1]) + x.engrave(C) + x.flag(e[2], 147.4, 40, 1.5); },
        boomerang: (A, C, x) => { const e = els(A); return `<g fill="none" stroke="url(#${x.id}rel)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#${x.id}sh)">${kids(e[0], x.dash(260), x.draw(260, 3))}</g>` + x.pulse(x.raised(e[1]), 160, 128, '1;1.25;1', 1.5) + x.raised(e.slice(2).join('')); },

        steps: (A, C, x) => { const e = els(A); return e.slice(0, 7).map((s, i) => x.raised(`<g>${s}${x.blink(.35, 1, 2.8, i * .4)}</g>`)).join('') + x.pulse(x.raised(e[7]), 120, 106, '1;1;1.15;1', 2.8, 2.6); },

    // Вручение: цветные частицы (каждая — цвета своей точки на медали) слетаются и складываются в медаль,

    function awardParticles(tw) {
      if (PT.reduce) return false;
      const stage = $('coinStage'), zoom = stage.querySelector('.coin-zoom'), face = $('coin').querySelector('.face');
      const ready = face && face.querySelector('img'), svg = face && face.querySelector('svg');
      if (!ready && !svg) return false;

      // картинка медали: уже готовая или та же SVG, переведённая в картинку
      const load = ready ? Promise.resolve(ready) : new Promise((res, rej) => {
        const im = new Image(), url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
        im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(); };
        im.src = url;
      });
      const fallback = () => { zoom.style.opacity = ''; if (C.tween === tw) { tw.t0 = performance.now(); safeHaptic('medium'); } };
      load.then(img => { if (C.tween === tw) runAward(img); }, fallback);
      return true;
      function runAward(img) {
      try {
        let cv = $('coinPt');
        const view = $('coinView');
        if (!cv) { cv = document.createElement('canvas'); cv.id = 'coinPt'; cv.className = 'coin-pt'; cv.setAttribute('aria-hidden', 'true'); view.insertBefore(cv, view.firstChild); }
        const sr = view.getBoundingClientRect(), zr = zoom.getBoundingClientRect();
        const cx = zr.left + zr.width / 2 - sr.left, cy = zr.top + zr.height / 2 - sr.top, z = zr.width / 240, inK = PT.pick(PT.ARRIVE, 'aw_in');
        const T_FORM = 1.75;
        let shown = false;
        const reveal = () => {
          zoom.style.transition = 'opacity .3s ease'; zoom.style.opacity = '';
          tw.from = -360; tw.dur = 900; tw.scaleFrom = .9; tw.t0 = performance.now();
          safeHaptic('medium');
        };
        // пряди вихрем собираются в контур медали и её светлых частей, потом проявляется сама монета
        C.pt = SL.scene(cv, {
          fly: .4, form: 1.3, show: reveal,
          mask: (g, W, H) => {
            const x = cx - 124 * z, y = cy - 124 * z, sz = 248 * z;
            g.drawImage(img, x, y, sz, sz);
            const X = Math.max(0, Math.floor(x)), Y = Math.max(0, Math.floor(y)), w = Math.min(Math.ceil(sz), Math.floor(W) - X), h = Math.min(Math.ceil(sz), Math.floor(H) - Y);
            if (w < 2 || h < 2) return;
            // внутри монеты оставляем светлое: края тёмных деталей тоже становятся контурами
            const im = g.getImageData(X, Y, w, h), d = im.data, L = [];
            for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 128) L.push(d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11);
            L.sort((a, b) => a - b); const thr = L.length ? L[(L.length * .4) | 0] : 0;
            for (let i = 0; i < d.length; i += 4) d[i + 3] = d[i + 3] > 128 && d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11 >= thr ? 255 : 0;
            g.putImageData(im, X, Y);

          shape: (W, H, N) => PT.sample(W, H, g => g.drawImage(img, cx - 124 * z, cy - 124 * z, 248 * z, 248 * z), N, true, .18),
          spawn: (p, W, H) => PT.ARRIVE[inK](p, W, H, cx, cy),
          gather: t => t < T_FORM ? PT.clamp((t - .3) / 1.2) : 0,
          exit: (i, t, x, y, W, H, r1) => {

    function loadSeen() {
      return new Promise(resolve => {
        const local = () => { try { resolve(localStorage.getItem(SEEN_KEY)); } catch (e) { resolve(null); } };
        // Облако не ответило: если и в браузере пусто, это «неизвестно» (undefined),
        // а не первое открытие — иначе новые медали молча помечались показанными
        const fallback = () => { let v = null; try { v = localStorage.getItem(SEEN_KEY); } catch (e) {} resolve(v || undefined); };
        const cs = cloud();
        if (!cs) return local();
        const timer = setTimeout(fallback, 2500);
        try { cs.getItem(SEEN_KEY, (err, val) => { clearTimeout(timer); if (err) fallback(); else resolve(val || null); }); }
        catch (e) { clearTimeout(timer); fallback(); }
      });
    }
    function saveSeen(keys) {
      const v = JSON.stringify(keys);

    async function checkNewMedals() {
      if (awardChecked) return;

      if (!u || !u.medals || !u.medals.earned) return;      // свои медали показываем только себе
      const earned = u.medals.earned.map(m => m.key);
      const raw = await loadSeen();
      if (raw === undefined) { awardChecked = false; return; }   // не знаем, что уже показано — попробуем в другой раз
      let seen = null;
      try { seen = raw ? JSON.parse(raw) : null; } catch (e) {}
      if (!Array.isArray(seen)) { saveSeen(earned); return; }   // первое открытие: всё старое уже вручено ботом
      const fresh = u.medals.earned.filter(m => seen.indexOf(m.key) === -1)
        .sort((a, b) => a.date < b.date ? -1 : 1);
      saveSeen(seen.concat(fresh.map(m => m.key)));

      awardQueue = fresh.map(m => Object.assign({}, m, { status: 'earned' }));

      }

      const all = u.entries;
      renderWeek(all);

      let target = all[all.length - 1], past = false;
      if (selectedDateTimestamp) {
        const f = all.find(e => e.timestamp === selectedDateTimestamp);
        if (f) { target = f; past = f.timestamp !== all[all.length - 1].timestamp; }
      }
      const ti = all.findIndex(e => e.timestamp === target.timestamp);
      const prev = ti > 0 ? all[ti - 1] : target;
      const start = u.start || all[0].weight;

      const diff = parseFloat((target.weight - prev.weight).toFixed(1));
      // «За сутки» — только если прошлый замер был накануне, иначе «за N дн.»
      const gapDays = Math.max(1, Math.round((new Date(target.timestamp).setHours(0, 0, 0, 0) - new Date(prev.timestamp).setHours(0, 0, 0, 0)) / DAY_MS));
      const gapText = gapDays === 1 ? 'за сутки' : `за ${gapDays} ${plural(gapDays, 'день', 'дня', 'дней')}`;
      const badge = $('currDiffBadge');

      if (goal) {

        const done = (start >= goal) ? start - target.weight : target.weight - start;
        const pct = Math.max(0, Math.min(100, total > 0 ? Math.round(done / total * 100) : 100));
        $('progressText').textContent = `${pct}%`;
        fillTicks(pct);
        const leftKg = parseFloat(Math.abs(target.weight - goal).toFixed(1));
        $('laneGoal').textContent = `${fmt(goal)} кг`;
        // Цель взята, если вес дошёл до неё или прошёл дальше (раньше при весе ниже
        // цели писалось «нужен профицит калорий»)
        const reached = start >= goal ? target.weight <= goal : target.weight >= goal;
        const goalDone = reached || leftKg === 0;
        $('goalEtaLabel').textContent = goalDone ? 'Цель взята' : 'Цель будет взята:';
        if (goalDone) $('goalEtaText').innerHTML = GOAL_ICON;
        if (goalDone && !past) goalStrands(goal, target.weight);
        else $('goalEtaText').textContent = calculateGoalETA(all, goal, target.weight);
        renderMountain(u, start, goal, target.weight);
      } else {
        renderMountain(u, start, null, target.weight);
        $('progressText').textContent = '—';
        fillTicks(0);
        $('laneGoal').textContent = 'не задана';
        $('goalEtaLabel').textContent = 'Цель будет взята:';
        $('goalEtaText').textContent = 'цель не задана';
      }

      let chartEntries = all;
      if (currentPeriod !== 'all') {
        const cut = all[all.length - 1].timestamp - parseInt(currentPeriod) * 86400000;
        chartEntries = all.filter(e => e.timestamp >= cut);
      }
      // Ось по дням: пропущенные дни остаются пустыми, а не схлопываются,
      // иначе график выглядит так, будто взвешивания были каждый день.
      // Тренд считается по всей истории, чтобы в начале периода не «прыгал».
      const smaAll = calculateSMA(all);
      const smaByTs = new Map(all.map((e, i) => [e.timestamp, smaAll[i]]));
      const series = buildDailySeries(chartEntries, smaByTs);

      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      $('chartNote').classList.toggle('hidden', typeof Chart !== 'undefined');
      if (typeof Chart === 'undefined') return;

      const ink = cssVar('--ink'), volt = cssVar('--volt'), muted = cssVar('--muted'), rule = cssVar('--rule'), panel = cssVar('--panel');
      // Линия цели — пунктиром, если цель рядом с весами периода и не сплющит график
      const ws = series.map(p => p.weight).filter(v => v != null);
      const lo = Math.min(...ws), hi = Math.max(...ws), span = Math.max(1, hi - lo);
      const showGoal = goal && goal >= lo - span * .6 && goal <= hi + span * .6;
      const reveal = chartReveal && !calm();
      chartReveal = false;

      chartInstance = new Chart($('weightChart').getContext('2d'), {
        type: 'line',
        plugins: [revealPlugin, goalLinePlugin(showGoal ? goal : null, muted)],
        data: {
          labels: series.map(p => p.label),
          datasets: [
            {
              label: 'Тренд',
              data: series.map(p => p.sma),
              spanGaps: true,
              borderColor: volt,
              borderWidth: 3.5,
              pointRadius: 0,
              tension: 0.4,
              fill: 'start',
              backgroundColor: c => {                         // мягкая заливка под трендом
                const a = c.chart.chartArea;
                if (!a) return 'transparent';
                const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
                g.addColorStop(0, hexA(volt, .28)); g.addColorStop(1, hexA(volt, 0));
                return g;
              },
              order: 2
            },
            {
              label: 'Факт',
              data: series.map(p => p.weight),
              spanGaps: true,
              borderColor: hexA(ink, .55),
              borderWidth: 1.5,
              pointRadius: series.map(p => p.ts === target.timestamp ? 5 : 2),
              pointBackgroundColor: series.map(p => p.ts === target.timestamp ? volt : hexA(ink, .6)),
              pointBorderColor: cssVar('--bg'),
              pointBorderWidth: series.map(p => p.ts === target.timestamp ? 2 : 0),
              tension: 0.25,
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: ink,
              titleColor: panel,
              bodyColor: panel,
              titleFont: { family: 'Golos Text', weight: '600', size: 13 },
              bodyFont: { family: 'Golos Text', size: 13 },
              padding: 10,
              cornerRadius: 6,
              displayColors: false,
              callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)} кг` }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              border: { color: rule },
              ticks: { color: muted, font: { family: 'Barlow Condensed', size: 12, weight: '500' }, maxTicksLimit: 6, maxRotation: 0 }
            },
            y: {
              grid: { color: rule, drawTicks: false },
              border: { display: false },
              ticks: { color: muted, font: { family: 'Barlow Condensed', size: 12, weight: '500' }, padding: 6, maxTicksLimit: 5, callback: v => fmt(Number(v.toFixed(1))) },
              ...(showGoal ? { suggestedMin: Math.min(lo, goal) - .3, suggestedMax: Math.max(hi, goal) + .3 } : {})
            }
          }
        }
      });
      if (reveal) startReveal(chartInstance); else chartInstance.$reveal = 1;
      mainSilk(reveal);
    }

    // ===== Линия тренда на главном — тот же тонкий шёлк, что у пути к цели и в сторис (SVG поверх графика) =====
    const MS = { tm: 0, key: '' };
    function mainSilkLine(on) {
      const c = chartInstance; if (!c) return;
      const d = c.data.datasets[0], col = on ? cssVar('--volt') : 'transparent';
      if (d.borderColor !== col) { d.borderColor = col; c.update('none'); }
    }
    function msPts() {
      const ch = chartInstance; if (!ch) return null;
      const pts = ch.getDatasetMeta(0).data.filter(p => p && !p.skip && isFinite(p.x) && isFinite(p.y)).map(p => [p.x, p.y]);
      if (pts.length < 2) return null;
      // длинный период — не больше ~120 точек, тренд и так плавный
      const k = Math.ceil(pts.length / 120);
      const q = k > 1 ? pts.filter((p, i) => i % k === 0 || i === pts.length - 1) : pts;
      // тренд по дням идёт ступеньками — шёлку нужна плавная линия: лёгкое сглаживание по соседям, концы на месте
      let y = q.map(p => p[1]);
      for (let r = 0; r < 3; r++) y = y.map((v, i) => i && i < y.length - 1 ? (y[i - 1] + 2 * v + y[i + 1]) / 4 : v);
      return q.map((p, i) => [p[0], y[i]]);
    }
    // главный график — одна линия ровно по тренду (без покачивания, решение Вадима 24.10), по ней бежит блик
    const MAIN_SILK = anim => ({ n: 1, w: 4.2, px: 0, op: 1, gid: 'msG', full: !anim || calm() });
    function mainSilk(anim) {
      clearTimeout(MS.tm);
      const c = chartInstance, box = $('weightChart').parentNode, old = box.querySelector('.ms-svg'), pts = c && msPts();
      if (!pts) { if (old) old.remove(); MS.key = ''; if (c) mainSilkLine(true); return; }
      const W = c.width, H = c.height, key = W + 'x' + H + ':' + pts.map(p => p[0].toFixed(0) + ',' + p[1].toFixed(0)).join(' ');
      if (old && key === MS.key) return;
      MS.key = key;
      const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      sv.setAttribute('class', 'ms-svg'); sv.setAttribute('aria-hidden', 'true');
      sv.setAttribute('viewBox', `0 0 ${W} ${H}`); sv.style.width = W + 'px'; sv.style.height = H + 'px'; sv.style.left = c.canvas.offsetLeft + 'px'; sv.style.top = c.canvas.offsetTop + 'px';
      sv.innerHTML = `<defs>${silkGrad('msG', W)}</defs>` + silkRaw(silkCurve(pts, Math.max(2, Math.round(240 / pts.length))), MAIN_SILK(anim));
      if (old) old.replaceWith(sv); else box.appendChild(sv);
      silkStart(sv);
      mainSilkLine(false);
    }
    window.addEventListener('resize', () => { clearTimeout(MS.tm); MS.tm = setTimeout(() => mainSilk(false), 300); });

    // ===== Живое построение графика: линии прорисовываются слева направо =====
    const hexA = (hex, a) => {
      const h = hex.replace('#', ''), f = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      return `rgba(${parseInt(f.substr(0, 2), 16)},${parseInt(f.substr(2, 2), 16)},${parseInt(f.substr(4, 2), 16)},${a})`;
    };
    const revealPlugin = {
      id: 'reveal',
      beforeDatasetsDraw(chart) {
        const p = chart.$reveal == null ? 1 : chart.$reveal, a = chart.chartArea;
        if (p >= 1 || !a) return;
        const ctx = chart.ctx;
        ctx.save();
        ctx.beginPath();
        ctx.rect(a.left - 8, a.top - 10, (a.right - a.left + 16) * p, a.bottom - a.top + 20);
        ctx.clip();
        chart.$clipped = true;
      },
      afterDatasetsDraw(chart) {
        if (chart.$clipped) { chart.ctx.restore(); chart.$clipped = false; }
      }
    };
    const goalLinePlugin = (goal, color) => ({
      id: 'goalLine',
      beforeDatasetsDraw(chart) {
        if (goal == null) return;
        const y = chart.scales.y.getPixelForValue(goal), a = chart.chartArea, ctx = chart.ctx;
        if (y < a.top || y > a.bottom) return;
        ctx.save();
        ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color; ctx.font = '500 11px "Golos Text", system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(`цель ${fmt(goal)}`, a.left + 4, y - 5);
        ctx.restore();
      }
    });
    function startReveal(chart) {
      const t0 = performance.now(), dur = 1000;
      chart.$reveal = 0;
      const step = t => {
        if (chart !== chartInstance) return;
        const k = Math.min(1, (t - t0) / dur);
        chart.$reveal = 1 - Math.pow(1 - k, 3);
        chart.draw();
        if (k < 1) requestAnimationFrame(step);
      };
      chart.draw();
      requestAnimationFrame(step);
    }

    // Вес набегает до нового значения: с нуля при открытии, плавно при смене дня или человека
    function countTo(el, value, from) {
      const prev = from != null ? from : parseFloat(String(el.dataset.v || ''));
      el.dataset.v = value;
      cancelAnimationFrame(el.$raf);
      if (isNaN(prev) || prev === value || calm()) { el.textContent = fmt(value); return; }
      const t0 = performance.now(), dur = from != null ? 900 : 380;
      const step = t => {
        const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = k < 1 ? fmt((prev + (value - prev) * e).toFixed(1)) : fmt(value);
        if (k < 1) el.$raf = requestAnimationFrame(step);
      };
      el.$raf = requestAnimationFrame(step);
    }

    // Вес как табло: каждая цифра — свой барабан и докручивается вверх до нужной.
    // При открытии (from = стартовый вес) младшие цифры делают лишний круг, как настоящий счётчик.
    function odoTo(el, value, from) {
      const txt = fmt(value), prevTxt = from != null ? fmt(from) : (el.dataset.t || '');
      el.dataset.t = txt;
      if (calm() || !prevTxt || prevTxt === txt && from == null) { el.classList.remove('odo'); el.textContent = txt; return; }
      const cells = [...'0123456789'].map(c => `<span class="c">${c}</span>`).join('').repeat(3);
      // старые цифры выравниваем по правому краю (запятая к запятой), недостающие — нули
      const pad = (a, n) => a.length >= n ? a : '0'.repeat(n - a.length) + a;
      const [ni, nf = ''] = txt.split(','), [pi, pf = ''] = prevTxt.split(',');
      const prevAligned = pad(pi, ni.length).slice(-ni.length) + (nf ? ',' + (pf + '0').slice(0, nf.length) : '');
      el.classList.add('odo');
      el.innerHTML = `<span class="ghost">${txt}</span><span class="roll">` + [...txt].map(ch => /\d/.test(ch) ? `<span class="od"><span class="odr">${cells}</span></span>` : `<span class="sep">${ch}</span>`).join('') + '</span>';
      el.style.setProperty('--gw', el.querySelector('.ghost').offsetWidth + 'px');
      el.querySelectorAll('.roll > span').forEach(s => s.style.setProperty('--gx', s.offsetLeft + 'px'));
      const rolls = [...el.querySelectorAll('.odr')], digits = [...txt].filter(c => /\d/.test(c)), prevD = [...prevAligned].filter(c => /\d/.test(c));
      const intro = from != null, n = rolls.length, dur = intro ? 1100 : 520;
      rolls.forEach((r, k) => {
        const d = +digits[k], p = +(prevD[k] || 0), fromRight = n - 1 - k;
        const loops = d === p && !intro ? 0 : intro ? (fromRight === 0 ? 2 : 1) : 1;
        const end = d + (d > p || loops === 0 ? (loops ? loops - 1 : 0) * 10 : loops * 10);
        r.style.transform = `translateY(${-.1 - p * 1.3}em)`;
        r.style.transition = 'none';
        if (end === p) return;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          r.style.transition = `transform ${dur + fromRight * 90}ms cubic-bezier(.18,.8,.22,1) ${k * 40}ms`;
          r.style.transform = `translateY(${-.1 - end * 1.3}em)`;
        }));
      });
    }

    // путь к цели — тонкая шёлковая нить до текущего процента (дальше — тихая дорожка); при открытии нить протягивается
    function fillTicks(pct) {
      const box = $('ticks'), k = Math.max(0, Math.min(1, pct / 100)), anim = intro && !calm(), xe = 2 + 296 * k;
      const pts = [...Array(25)].map((_, i) => [2 + (xe - 2) * i / 24, 8]);
      box.innerHTML = `<svg viewBox="0 0 300 16" preserveAspectRatio="none"><defs>${silkGrad('tkG', 300)}</defs><line class="tk-rest" x1="${xe.toFixed(1)}" y1="8" x2="298" y2="8"/>${k > .01 ? silkRaw(pts, { ...LINE_SILK, gid: 'tkG', full: !anim }) : ''}</svg>
        ${k > .01 ? `<i class="tk-end${anim ? ' in' : ''}" style="left:${(xe / 3).toFixed(2)}%"></i>` : ''}`;
      if (k > .01) silkStart(box);
    }

    // Крупный белый (тёмная тема) и чёрный (светлая) текст — заголовки и большие цифры — переливом лайм → мята → бирюза,
    // как фраза заставки. Мелкий текст (подписи, значения в строке) остаётся белым/чёрным: так читается лучше.
    // Метка .gt не меняет color (только заливку букв), поэтому «родной» цвет всегда можно перечитать.
    // Не трогаем: цветной и серый текст, текст на ярких/инвертированных подложках (лаймовые кнопки, выбранная плашка), svg и canvas.
    const inkGradient = (() => {
      const rgb = c => { const m = /rgba?\(([^)]+)\)/.exec(c); if (!m) return null; const v = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return { r: v[0], g: v[1], b: v[2], a: v.length > 3 ? v[3] : 1 }; };
      const lum = c => (.2126 * c.r + .7152 * c.g + .0722 * c.b) / 255, sat = c => (Math.max(c.r, c.g, c.b) - Math.min(c.r, c.g, c.b)) / 255;
      let timer = 0;
      function run() {
        timer = 0;
        const dark = !document.documentElement.classList.contains('light'), bgMemo = new Map(), plan = [];
        // подложка под текстом: первый предок со своим фоном; картинка-фон — считаем яркой подложкой
        const under = el => {
          const path = [];
          for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
            if (bgMemo.has(e)) { const v = bgMemo.get(e); path.forEach(x => bgMemo.set(x, v)); return v; }
            path.push(e);
            const cs = getComputedStyle(e), c = rgb(cs.backgroundColor);
            if (cs.backgroundImage !== 'none' && !e.classList.contains('gt') && !e.matches('.big b, .odo *')) { path.forEach(x => bgMemo.set(x, false)); return false; }
            if (c && c.a > .5) { const ok = sat(c) < .3 && (dark ? lum(c) < .45 : lum(c) > .55); path.forEach(x => bgMemo.set(x, ok)); return ok; }
          }
          return true;
        };
        const tw = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), seen = new Set();
        for (let n; (n = tw.nextNode());) {
          const el = n.parentElement;
          if (!el || seen.has(el) || !n.nodeValue.trim()) continue;
          seen.add(el);
          if (el.closest('svg, canvas, script, style, #splash, .odo, .big, textarea, input')) continue;
          const cs = getComputedStyle(el), c = rgb(cs.color);
          const ink = c && parseFloat(cs.fontSize) >= 24 && c.a > .85 && sat(c) < .12 && (dark ? lum(c) > .8 : lum(c) < .25);
          plan.push([el, !!ink && under(el)]);
        }
        document.querySelectorAll('.gt').forEach(el => { if (!seen.has(el)) plan.push([el, false]); });
        plan.forEach(([el, on]) => { if (el.classList.contains('gt') !== on) el.classList.toggle('gt', on); });
      }
      const soon = () => { if (!timer) timer = setTimeout(run, 120); };
      const mo = new MutationObserver(soon);
      mo.observe(document.body, { childList: true, subtree: true, characterData: true });
      new MutationObserver(soon).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      soon();
      return { run };
    })();

    const GOAL_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--down)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px" aria-label="цель взята"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>`;
  </script>
</body>
</html>
