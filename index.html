<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weight Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Golos+Text:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =====================================================================
       Стиль «Спорт-ночь»: один лаймовый акцент, узкие жирные цифры.
       Тёмный или светлый — как в телефоне (светлый: html.light, цвета ниже).
       Тёмный — мягкий сине-серый, как ночная тема Telegram, а не чёрный; лайм чуть приглушён.
       ===================================================================== */
    :root {
      --bg:      #17212B;   /* ночной сине-серый */
      --panel:   #1F2B38;   /* карточки */
      --panel2:  #293746;
      --ink:     #E9EEF3;
      --muted:   #8C9BAB;
      --rule:    #2A3644;
      --volt:    #BDEB5B;   /* лайм, мягче */
      --volt-dim: rgba(189, 235, 91, .13);
      --pt-a: #BDEB5B; --pt-b: #76E2A8; --pt-c: #5CC8E8;   /* перелив частиц и графика: лайм → мята → бирюза */
      --volt-ink:#121315;
      --down:    #BDEB5B;   /* вес ушёл */
      --up:      #FF8C7A;   /* вес прибавился */
      --story-bg:#131C25;
      --lime-btn:#BDEB5B;   /* кнопки и кружки в сторис */
      --num:     'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
      --display: 'Golos Text', system-ui, -apple-system, sans-serif;
      --text:    'Golos Text', system-ui, -apple-system, sans-serif;
      color-scheme: dark;
    }
    /* светлый режим телефона: «тёплый песок» — кремовый фон, мягкий лайм; зелень темнее, чтобы читалась на светлом */
    html.light {
      --bg:      #F4F1EA;
      --panel:   #FFFDF8;
      --panel2:  #ECE7DC;
      --ink:     #26231E;
      --muted:   #857D70;
      --rule:    #E6E0D4;
      --volt:    #64951C;
      --volt-dim: rgba(100, 149, 28, .12);
      --pt-a: #64951C; --pt-b: #13926E; --pt-c: #1F74B8;
      --volt-ink:#121315;
      --down:    #5E8F1A;
      --up:      #E0503A;
      --lime-btn:#D3E88F;
      color-scheme: light;
    }
    html.light #story { background: var(--bg); }
    html.light .day.empty .dn { color: #A6A9AE; }
    html.light #mtView { background: #4E9BD6; }
    html.light .mt-top { color: #15171A; }
    html.light .mt-top .k, html.light .mt-stats .v small, html.light .mt-next { color: rgba(21,23,26,.62); }
    html.light .mt-hint { color: rgba(21,23,26,.6); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      touch-action: pan-y;
      overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
    .hidden { display: none !important; }
    .num { font-family: var(--num); font-variant-numeric: tabular-nums; }

    /* ---------- ЗАСТАВКА ---------- */
    #splash {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #splash.gone { opacity: 0; visibility: hidden; }
    /* заставка из частиц: фраза дня из потока точек, внизу маленький логотип; старая заставка — запасная */
    #splash .sp-pt { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #splash.pt .sp-mark, #splash.pt .sp-bars, #splash.pt .splash-note { display: none; }
    .sp-small { display: none; position: absolute; left: 0; right: 0; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); text-align: center;
      font-family: var(--num); font-weight: 800; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
    .sp-small span { color: var(--volt); }
    #splash.pt .sp-small { display: block; }
    /* заставка из прядей: в светлой теме она тёмная (пряди светятся только на тёмном), а при входе разливается песок */
    /* светлая заставка — песок, как само приложение днём */
    html.light #splash.sl { background: #F4F1EA; }
    html.light #splash.sl .sp-small span { color: #5E8F17; }
    /* мягкая подсветка снизу: лайм и бирюза медленно дышат и переливаются под логотипом */
    #splash.sl::before { content: ""; position: absolute; left: -20%; right: -20%; bottom: 0; height: 46%; pointer-events: none;
      background: radial-gradient(48% 62% at 34% 100%, rgba(189,235,91,.30), rgba(189,235,91,0) 70%), radial-gradient(52% 70% at 68% 100%, rgba(92,200,232,.26), rgba(92,200,232,0) 72%), radial-gradient(40% 46% at 50% 100%, rgba(118,226,168,.24), rgba(118,226,168,0) 70%);
      filter: blur(18px); animation: spAurora 7s ease-in-out infinite alternate; transition: opacity .4s ease; }
    @keyframes spAurora { 0% { transform: translateX(-4%) scaleY(.9); opacity: .75; } 50% { opacity: 1; } 100% { transform: translateX(4%) scaleY(1.08); opacity: .8; } }
    #splash.sl-out::before { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #splash.sl::before { animation: none; } }
    #goalSl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
    #splash.sl-out .sp-small { opacity: 0; transition: opacity .3s ease; }
    #splash.sl.leaving { background: transparent; transition: opacity .4s ease, visibility .4s ease; }
    /* уход: фон заставки тает, под ней уже приложение, а частицы разлетаются поверх */
    #splash.leaving { background: transparent; pointer-events: none; transition: background .45s ease, opacity .4s ease, visibility .4s ease; }
    #splash.leaving .sp-small { opacity: 0; transition: opacity .3s ease; }
    .sp-mark {
      font-family: var(--num); font-weight: 800; text-transform: uppercase;
      font-size: clamp(64px, 21vw, 86px); line-height: .84; letter-spacing: .01em;
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }
    .sp-mark span { display: block; }
    .sp-mark span:last-child { color: var(--volt); animation: spIn .7s cubic-bezier(.2, .8, .2, 1) .1s both; }
    .sp-mark span:first-child { animation: spIn .7s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes spIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    /* ритм-полоски: волна бежит слева направо, один проход = минимум показа */
    .sp-bars { display: flex; gap: 5px; align-items: flex-end; height: 34px; margin-top: 26px; }
    .sp-bars i { width: 7px; height: 100%; border-radius: 2px; background: var(--rule); transform-origin: bottom; transform: scaleY(.25);
      animation: spBar 1.5s ease-in-out infinite; animation-delay: calc(var(--k) * 50ms); }
    @keyframes spBar {
      0%, 100% { transform: scaleY(.25); background: var(--rule); }
      25% { transform: scaleY(1); background: var(--volt); }
      50%, 99% { transform: scaleY(.25); background: var(--rule); }
    }
    .splash-note {
      position: absolute; left: 24px; right: 24px; bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      text-align: center; font-size: 15px; line-height: 1.35; color: var(--muted);
      animation: spNote .6s ease .35s both;
      transition: opacity .3s ease, transform .4s ease;
    }
    @keyframes spNote { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #splash.gone .sp-mark { transform: scale(1.06); }
    #splash.gone .splash-note { opacity: 0; transform: translateY(6px); }
    @media (prefers-reduced-motion: reduce) {
      .sp-bars i { animation: none; transform: none; }
      .sp-bars i:nth-child(-n+4) { background: var(--volt); }
    }

    /* ---------- КАРКАС ---------- */
    /* Вся страница = ровно высота окна Telegram; график забирает остаток */
    main {
      max-width: 440px; margin: 0 auto;
      min-height: var(--tg-viewport-stable-height, 100dvh);
      height: var(--tg-viewport-stable-height, 100dvh);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
    }
    #dashboard { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #dashboard > * { flex-shrink: 0; }
    #dashboard > .chart-panel { flex: 1 1 auto; }

    /* Переключатель людей: по центру, две «таблетки» */
    .who { display: flex; justify-content: center; gap: 8px; margin-bottom: 4px; }
    #dashboard { position: relative; }

    /* ===== Итоги месяца: кружок и «сторис» по неделям ===== */
    #storyRing { position: absolute; left: 0; top: -2px; width: 38px; height: 38px; border-radius: 50%; padding: 2px; z-index: 2;
      background: conic-gradient(var(--volt), #6FE0B8, var(--volt)); }
    #storyRing.seen { background: var(--rule); }
    #storyRing.silky:not(.seen) { background: none; }
    #storyRing .ring-silk { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    #storyRing.seen .ring-silk { display: none; }
    #storyRing span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--bg); border: 2px solid var(--bg);
      font-family: var(--text); font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--ink); letter-spacing: .02em; }
    #story { position: fixed; inset: 0; z-index: 45; background: var(--story-bg); color: var(--ink); display: flex; flex-direction: column;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      opacity: 0; pointer-events: none; transform: scale(.96); transition: opacity .25s ease, transform .3s cubic-bezier(.3,.8,.3,1); user-select: none; -webkit-user-select: none; overflow: hidden; }
    #story.open { opacity: 1; pointer-events: auto; transform: none; }
    .st-head { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
    .st-head .t { font-size: 17px; font-weight: 600; color: var(--muted); }
    .st-head .t b { color: var(--ink); }
    .st-x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: inherit; font-size: 24px; line-height: 1; }
    /* переключатель: недели, месяц, прошлый месяц */
    .st-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 10px -16px 0; padding: 0 16px 12px; flex: none; }
    .st-tabs::-webkit-scrollbar { display: none; }
    .st-tabs button { flex: none; padding: 8px 13px; border-radius: 12px; background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .st-tabs button.on { background: var(--volt); color: var(--volt-ink); }
    html.light .st-tabs button.on { background: var(--lime-btn); }
    /* карточка: всё видно сразу, листается вниз */
    .st-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -16px; padding: 0 16px 8px; scrollbar-width: none; touch-action: pan-y; }
    .st-scroll::-webkit-scrollbar { display: none; }
    .st-card { display: flex; flex-direction: column; gap: 10px; }
    /* неделя — сторис из экранов: полоски сверху, на экране одна мысль, всё по центру, в стиле заставки */
    .st-deck { min-height: 100%; display: flex; flex-direction: column; }
    .st-segs { display: flex; gap: 4px; margin: 0 0 6px; flex: none; }
    .st-segs i { flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; }
    .st-segs b { display: block; width: 100%; height: 3px; border-radius: 2px; background: var(--rule); transition: background .25s; }
    .st-segs i.on b { background: var(--volt); }
    .st-pn { display: flex; align-items: center; justify-content: center; gap: 22px; flex: none; padding-top: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .st-pn button { width: 44px; height: 36px; border-radius: 14px; background: var(--panel); color: var(--ink); font-size: 24px; line-height: 1; }
    .st-pn button:disabled { opacity: .3; }
    .st-beads .bd { z-index: 1; }
    .st-slide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 12px 0 18px; }
    .st-slide.in-r { animation: stInR .35s cubic-bezier(.3,.8,.3,1) both; } .st-slide.in-l { animation: stInL .35s cubic-bezier(.3,.8,.3,1) both; }
    .st-slide > .st-k { letter-spacing: .18em; }
    .st-huge { font-family: var(--num); font-weight: 800; font-size: clamp(84px, 30vw, 128px); line-height: .85; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
      background-image: linear-gradient(90deg, var(--pt-a), var(--pt-b) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
    .st-huge small { font-size: .34em; letter-spacing: 0; }
    .st-unit { font-family: var(--num); font-weight: 700; font-size: 20px; color: var(--muted); letter-spacing: .02em; margin-top: -4px; }
    .st-say { font-family: Montserrat, var(--text); font-weight: 600; font-size: 15px; line-height: 1.4; text-transform: uppercase; letter-spacing: .02em; max-width: 30ch; margin-top: 6px; }
    .st-say.g { font-size: 17px; background-image: linear-gradient(90deg, var(--pt-a), var(--pt-b) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
    .st-slide .st-tiles, .st-slide .st-plan, .st-wos { width: 100%; text-align: left; }
    .st-wos { background: var(--panel); border-radius: 20px; padding: 14px 16px; }
    .st-slide .st-close { width: 100%; margin-top: 10px; }
    .st-slide > .st-chart:not(.st-beads) { position: relative; width: 100%; margin-top: 10px; }
    .st-slide .st-chips { justify-content: center; margin-top: 4px; }
    .st-wks { width: 100%; }
    .st-slide .st-sleep.big { width: 100%; height: 130px; }
    .st-slide .st-sleep.big i { border-radius: 10px; }
    .st-mw { position: relative; display: block; }
    .st-mw > svg.live { position: absolute; left: 0; top: 0; filter: none; }
    .st-medal1 svg, .st-medal1 img { width: 170px; height: 170px; display: block; filter: drop-shadow(0 10px 40px color-mix(in srgb, var(--pt-a) 35%, transparent)); }
    .st-mt { font-family: var(--num); font-weight: 800; font-size: 36px; line-height: 1; max-width: 16ch;
      background-image: linear-gradient(90deg, var(--pt-a), var(--pt-b) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
    .st-slide .st-medals { justify-content: center; }
    /* дни — бусины на шёлковой нити */
    .st-beads { position: relative; width: 100%; aspect-ratio: 300 / 170; margin-top: 4px; }
    .st-beads.st-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .st-beads .bd { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .st-beads .bd b { font-family: var(--num); font-size: 16px; font-weight: 700; }
    .st-beads .bd small { font-size: 11px; font-weight: 600; color: var(--muted); }
    .st-beads .bd i { width: 14px; height: 14px; border-radius: 50%; background: var(--volt); box-shadow: 0 0 0 4px color-mix(in srgb, var(--volt) 22%, transparent); display: grid; place-items: center; }
    .st-beads .bd.wo i { width: 28px; height: 28px; box-shadow: none; }
    .st-beads .bd.wo i svg { width: 18px; height: 18px; position: static; }
    .st-beads .bd.off b { color: var(--muted); } .st-beads .bd.off i { background: var(--panel2); box-shadow: none; }
    .st-card.in-l { animation: stInL .35s cubic-bezier(.3,.8,.3,1) both; } .st-card.in-r { animation: stInR .35s cubic-bezier(.3,.8,.3,1) both; }
    @keyframes stInL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
    @keyframes stInR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    .st-box { background: var(--panel); border-radius: 22px; padding: 16px; }
    .st-k { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .st-hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .st-hero .side { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.65; margin-top: 2px; white-space: nowrap; }
    .st-month { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: -.01em; margin-top: 6px; }
    .st-big { font-family: var(--num); font-weight: 800; font-size: 76px; line-height: .9; font-variant-numeric: tabular-nums; margin-top: 8px; }
    .st-big small { font-size: 24px; color: var(--muted); font-weight: 700; margin-left: 2px; }
    .st-big.down { color: var(--down); } .st-big.up { color: var(--up); }
    .st-sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
    .st-chart { margin-top: 26px; }   /* запятая крупной цифры свисает ниже строки — график не должен на неё залезать */
    .st-chart svg { display: block; width: 100%; height: 96px; overflow: visible; }
    .st-chart .ln { fill: none; stroke: var(--volt); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    /* график рисуется, когда карточку видно (после обложки): линия идёт слева направо, под ней проявляется заливка,
       в конце «выскакивает» точка с волной и подписи веса */
    .st-chart .ar { fill: var(--volt); opacity: .13; }
    /* после отрисовки график живёт: цвета линии бегут лайм → мята → бирюза, по линии пробегает искра, точка дышит */
    .gs0, .gs2 { stop-color: var(--pt-a); } .gs1 { stop-color: var(--pt-c); } .gsm { stop-color: var(--pt-b); }
    .gsh { stop-color: #F2FFD8; } html.light .gsh { stop-color: #9CD13C; }
    .st-chart .silk path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .silk .au { stroke: #F2C35B; }
    html.light .silk .au { stroke: #B9831A; }
    .silk .sg { stroke-width: 7; opacity: .28; filter: blur(3px); }
    .silk.thin path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .silk.px path { vector-effect: non-scaling-stroke; }
    .silk .sg.sh { stroke: var(--volt); opacity: .22; filter: blur(4px); }
    .silk .sl-a { stroke: var(--volt); } .silk .sl-b { stroke: #4FD1B5; }
    html.light .silk .sl-b { stroke: #12937A; }
    html.light .silk .sg { opacity: .16; }
    .st-chart.go .ln { animation: stDraw 1.2s .1s cubic-bezier(.45,0,.2,1) both; }
    .st-chart.go .ar { animation: stArea .7s .8s ease both; }
    .st-chart.go .dt { animation: stPop .45s 1.2s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
    .st-chart.go .rp { animation: stRipple 2.2s 1.3s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
    .st-chart .rp { fill: none; stroke: var(--volt); stroke-width: 2; opacity: 0; }
    .st-chart.go .wl { animation: stFadeUp .4s 1.15s ease both; }
    @keyframes stArea { from { opacity: 0; } to { opacity: .13; } }
    @keyframes stPop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes stRipple { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(3.2); } }
    @keyframes stFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes stDraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
    .st-chart text { fill: var(--muted); font-size: 11px; font-family: var(--text); }
    .st-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .st-chip { background: var(--panel2); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); }
    .st-chip b { display: block; font-family: var(--num); font-size: 24px; color: var(--ink); font-weight: 700; line-height: 1.05; }
    /* виды спорта: у каждого свой цвет и значок */
    .st-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .st-tile { position: relative; border-radius: 20px; padding: 14px; min-height: 120px; color: #121315; display: flex; flex-direction: column; }
    .st-tile .si { width: 30px; height: 30px; }

    /* яркая обложка недели при открытии: тап или 4 секунды — и под ней карточка */
    .st-poster { position: absolute; inset: 0; z-index: 3; background: #C6FF3D; color: #121315; display: flex; flex-direction: column;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); transition: transform .45s cubic-bezier(.5,0,.3,1), opacity .45s; }
    .st-poster.gone { transform: translateY(-100%); opacity: .6; pointer-events: none; }
    .st-poster.off { display: none; }
    .st-poster .bar { visibility: hidden; height: 3px; border-radius: 2px; background: rgba(0,0,0,.18); overflow: hidden; }
    .st-poster .bar b { display: block; height: 100%; width: 0; background: #121315; }
    .st-poster .bar.wait { animation: stBarWait 1.1s ease-in-out infinite alternate; }
    @keyframes stBarWait { from { opacity: 1; } to { opacity: .35; } }
    .st-poster .st-head { margin: 10px -2px 0; } .st-poster .st-head .t { color: rgba(18,19,21,.7); font-size: 14px; }
    .st-poster .st-k { color: rgba(18,19,21,.6); margin-top: auto; letter-spacing: .18em; }
    /* тёмная тема: обложка не слепит — тёмный фон с мягким зелёным отсветом, лайм только в цифрах */
    /* обложка — тот же мир, что заставка: фон приложения, всё по центру, мягкий отсвет за цифрой */
    html:not(.light) .st-poster { background: radial-gradient(70% 38% at 50% 44%, rgba(118,226,168,.10), rgba(118,226,168,0) 70%), #17212B; color: var(--ink); }
    html:not(.light) .st-poster .bar { background: rgba(255,255,255,.14); } html:not(.light) .st-poster .bar b { background: var(--volt); }
    html:not(.light) .st-poster .st-head .t, html:not(.light) .st-poster .st-k { color: var(--muted); }
    /* светлая обложка тоже мягкая: светло-оливковый перелив в кремовый вместо яркого лайма */
    html.light .st-poster { background: radial-gradient(70% 38% at 50% 44%, rgba(100,149,28,.10), rgba(100,149,28,0) 70%), #F4F1EA; color: var(--ink); }
    html.light .st-poster .bar { background: rgba(0,0,0,.1); } html.light .st-poster .bar b { background: var(--volt); }
    html.light .st-poster .st-head .t, html.light .st-poster .st-k { color: var(--muted); }
    html:not(.light) .st-poster .st-x { color: var(--ink); }
    /* цифра недели — как фраза заставки: чистый перелив лайм → мята, без свечения */
    .st-poster .huge { background-image: linear-gradient(90deg, var(--pt-a), var(--pt-b) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
    html:not(.light) .st-poster svg.sp path, html:not(.light) .st-poster svg.sp circle { stroke: var(--volt); }
    html:not(.light) .st-poster svg.sp circle { fill: var(--volt); }
    .st-poster .huge { font-family: var(--num); font-weight: 800; font-size: clamp(110px, 40vw, 190px); line-height: .85; letter-spacing: -.02em; margin-top: 12px; font-variant-numeric: tabular-nums; }
    .st-poster .huge.sm { font-size: clamp(60px, 22vw, 92px); text-transform: uppercase; font-family: var(--display); letter-spacing: -.02em; }
    /* на обложке график — часть фона: во всю ширину, без подписей дней и заливки, только текущие пряди и вес в начале и в конце */
    .st-poster .st-chart.bare { margin: 26px -24px 0; }
    .st-chart.bare { margin-top: 14px; }
    .st-slide > .st-chart.bare svg { height: auto; aspect-ratio: 300 / 120; }
    .st-poster .st-chart.bare svg { height: 120px; }
    .st-poster .unit { font-family: var(--num); font-weight: 700; font-size: 22px; margin-top: 14px; color: var(--muted); letter-spacing: .02em; }
    .st-poster .st-k, .st-poster .huge, .st-poster .unit, .st-poster .say { text-align: center; }
    .st-poster .stats { justify-content: center; text-align: center; }
    .st-poster svg.sp { width: 100%; height: 90px; margin-top: 26px; overflow: visible; }
    .st-poster .stats { display: flex; gap: 40px; margin-top: 30px; }
    .st-poster .stats b { display: block; font-family: var(--num); font-weight: 800; font-size: 46px; line-height: 1; }
    .st-poster .stats span { font-size: 13px; font-weight: 600; opacity: .7; }
    .st-poster .say { margin-top: 26px; font-size: 17px; font-weight: 600; line-height: 1.35; min-height: 46px; }
    .st-poster .hint { margin-top: auto; padding-top: 18px; text-align: center; font-size: 13px; font-weight: 600; opacity: .55; }
    .st-poster.in .huge, .st-poster.in .unit, .st-poster.in .stats, .st-poster.in .say { animation: stIn .55s cubic-bezier(.3,.8,.3,1) both; }
    .st-poster.in .unit { animation-delay: .08s; } .st-poster.in .stats { animation-delay: .16s; } .st-poster.in .say { animation-delay: .24s; }
    .st-poster.in svg.sp path { animation: stDraw 1.1s .2s ease-out both; }
    @keyframes stIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    .who-name {

    /* Вес */
    .hero { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 12px; gap: 10px; }
    .cap { font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }

    .big b { font-family: var(--num); font-weight: 700; font-size: clamp(70px, 23vw, 92px); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    /* вес как табло: каждая цифра — барабан 0–9 (три круга), крутится вверх к своей цифре */
    /* невидимая копия числа держит место и строку текста, барабаны лежат поверх неё */
    /* весь белый/чёрный текст — переливом заставки (метку .gt ставит inkGradient); вложенный текст своего цвета остаётся своим */
    .gt * { -webkit-text-fill-color: currentColor; }
    .gt { background-image: linear-gradient(90deg, var(--pt-a), var(--pt-b) 50%, var(--pt-c)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    /* текущий вес — тем же переливом, что фраза заставки: лайм → мята → бирюза */
    .big b, .odo .c, .odo .sep { background-image: linear-gradient(90deg, var(--pt-a), var(--pt-b) 50%, var(--pt-c)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
    .big b.odo { background-image: none; }
    /* в табло каждая цифра красится своим куском общей полосы (--gx — где цифра, --gw — ширина числа) */
    .odo .c, .odo .sep { background-size: var(--gw, 100%) 100%; background-position: calc(-1 * var(--gx, 0px)) 0; background-repeat: no-repeat; }
    .odo { position: relative; }

    .odo .od { display: block; height: 1.1em; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); }
    .odo .odr { display: block; will-change: transform; }
    .odo .odr .c { display: block; height: 1.3em; line-height: 1.3; }
    .odo .sep { display: block; height: 1.1em; line-height: 1.3; margin-top: -.1em; }

    #mtSvg .mt-fogd.b { animation-duration: 7s; animation-direction: alternate-reverse; }
    #mtSvg .mt-glow { animation: mtGlowP 5s ease-in-out infinite alternate; }
    #mtSvg .mt-shoot { opacity: 0; animation: mtShoot 11s linear 2s infinite; }
    @keyframes mtDrop { from { transform: translateY(-4px); opacity: 0; } 20% { opacity: .9; } to { transform: translateY(46px); opacity: 0; } }
    @keyframes mtFlake { from { transform: translate(0, -2px); opacity: 0; } 15% { opacity: 1; } to { transform: translate(6px, 46px); opacity: 0; } }
    @keyframes mtFogD { from { transform: translateX(-7px); } to { transform: translateX(7px); } }
    @keyframes mtGlowP { from { opacity: .6; } to { opacity: 1; } }
    @keyframes mtShoot { 0%, 90% { opacity: 0; transform: translate(0, 0); } 91% { opacity: 1; } 97% { opacity: 0; transform: translate(-150px, 70px); } 100% { opacity: 0; transform: translate(-150px, 70px); } }
    .mt-wx { font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .mt-wx:empty { display: none; }
    .mt-wx div { display: flex; align-items: center; gap: 7px; opacity: .72; transition: opacity .2s; }
    .mt-wx div.on { opacity: 1; }
    .mt-wx div b { font-weight: 700; }
    .mt-wx svg { width: 18px; height: 18px; flex: none; }
    html.light .mt-wx { color: #15171A; }
    @media (prefers-reduced-motion: reduce) { #mtSvg .mt-flame, #mtSvg .mt-drop, #mtSvg .mt-flake, #mtSvg .mt-fogd, #mtSvg .mt-glow, #mtSvg .mt-shoot { animation: none; } #mtSvg .mt-shoot { display: none; } }
    /* гора на весь экран под шапкой; в колонке flex Safari считал ширину по пропорциям картинки, и справа оставалась полоса фона */
    #mtSvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; touch-action: pan-y; }
    .day {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 7px 0 6px; border-radius: 12px; background: var(--panel);
      transition: background .2s ease, color .2s ease;
    }
    .day .dw { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .day .dn { font-family: var(--num); font-weight: 600; font-size: 20px; line-height: 1.1; }
    .day .dd { font-family: var(--num); font-size: 13px; font-weight: 600; min-height: 15px; color: var(--muted); }
    .day.empty { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }
    .day.empty .dn { color: #55585E; }
    .day.future { opacity: .4; }
    .day.today .dw { color: var(--ink); }
    .day.today .dw::after { content: ""; display: inline-block; width: 4px; height: 4px; margin-left: 3px; border-radius: 50%; background: var(--volt); vertical-align: 2px; }
    .day.sel { background: var(--volt); color: var(--volt-ink); box-shadow: none; }
    .day.sel .dw, .day.sel .dd { color: var(--volt-ink); opacity: .7; }
    .day.sel.today .dw::after { background: var(--volt-ink); }
    .dd.down { color: var(--down); } .dd.up { color: var(--up); }
    .days { will-change: transform; }
    #emptyWeekNote { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }

    /* Плашки: тренировки и серия */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .st { background: var(--panel); border-radius: 16px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; text-align: left; }
    .st .k { font-size: 12px; color: var(--muted); }
    .st .v { font-family: var(--num); font-size: 28px; font-weight: 700; line-height: 1; margin-top: 3px; }
    .st .v small { font-size: 16px; color: var(--muted); font-weight: 600; }
    .st svg { width: 22px; height: 22px; color: var(--volt); flex-shrink: 0; }
    .st:active { opacity: .7; }

    /* Кнопка достижений */
    .achbtn { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 6px 6px 6px 16px; min-height: 56px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--rule); text-align: left; width: 100%; }
    .achbtn .l { min-width: 0; }
    .achbtn .l b { display: block; font-size: 15px; font-weight: 600; }
    .achbtn .l small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .achbtn .r { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .achbtn .n { font-family: var(--num); font-size: 20px; color: var(--muted); }
    .achbtn .pill { width: 42px; height: 42px; border-radius: 12px; background: var(--volt); color: var(--volt-ink); display: grid; place-items: center; }
    .achbtn:active { opacity: .75; }

    /* Нижняя карточка с описанием медали */
    #sheetBack {
      position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 18, .45);
      opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease;
    }
    #sheetBack.open { opacity: 1; visibility: visible; }
    #sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      max-width: 460px; margin: 0 auto;
      background: var(--bg); border-radius: 16px 16px 0 0;
      padding: 8px 20px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
      touch-action: none;
    }
    #sheet.open { transform: translateY(0); }
    #sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto 14px; }
    #sheet h3 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; }
    #sheet .s-desc { font-size: 15px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    #sheet .s-lane { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; margin: 14px 0 4px; }
    #sheet .s-lane i { display: block; height: 100%; background: var(--volt); }
    #sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin-top: 12px; font-size: 15px; }
    #sheet dt { color: var(--muted); }
    #sheet dd { text-align: right; font-weight: 600; }
    #sheet dd.need { color: var(--ink); font-weight: 700; }
    /* ===== Экран достижений ===== */
    .ach-head { cursor: pointer; }
    .ach-head:active { opacity: .6; }
    .ach-head span::after { content: " ›"; color: var(--muted); }
    .screen {
      position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateX(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }
    .screen.open { transform: translateX(0); }
    /* открытие витрины: заголовки проявляются, нить бьёт по медалям — они переворачиваются из серых в цветные */
    #achScreen.enter .m-sec h3 { animation: achIn .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms + 120ms); }
    @keyframes achIn { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
    #achScreen .m-tile .mw::after { content: ""; position: absolute; inset: 7%; border-radius: 50%; pointer-events: none; opacity: 0;
      background: linear-gradient(105deg, transparent 36%, rgba(255,255,255,.7) 50%, transparent 64%) no-repeat; background-size: 260% 100%; }
    @keyframes achGlint { 0% { opacity: 1; background-position: 120% 0; } 85% { opacity: 1; } 100% { opacity: 0; background-position: -20% 0; } }
    #achScreen .m-tile.dim .mw > img, #achScreen .m-tile.dim .mw > svg { filter: grayscale(1) brightness(.55); opacity: .45; }
    #achScreen .m-tile.lit .mw > img, #achScreen .m-tile.lit .mw > svg { transition: filter .2s ease .22s, opacity .2s ease .22s, transform .15s ease; }
    #achScreen .m-tile.lit .mw { animation: achFlip .65s cubic-bezier(.3,1.25,.5,1) both; }
    /* толщина на время переворота: слои той же картинки за лицом — ребро повторяет силуэт медали (у звёздных — лучи) */
    #achScreen .m-tile .mw.thick { transform-style: preserve-3d; }
    .mw > .th { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1; transform-style: preserve-3d; pointer-events: none; }
    .mw > .th > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    #achScreen .m-tile .mw.thick > img { opacity: 1; }
    /* живая медаль: тень не фильтром (он перерисовывался бы каждый кадр), а у обёртки */
    .m-tile .mw > svg.live { position: absolute; left: 0; top: 0; filter: none; }
    #achScreen .m-tile.lit .mw::after { animation: achGlint .6s ease .45s both; }
    @keyframes achFlip { 0% { transform: perspective(520px) rotateY(0) scale(.96); } 45% { transform: perspective(520px) rotateY(90deg) scale(1.04); } 100% { transform: perspective(520px) rotateY(360deg); } }
    #shotSl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 46; }
    #achShots { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 31; }
    .screen-inner { position: relative; }
    .screen-inner { max-width: 460px; margin: 0 auto; padding: 14px 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
    .screen-top { display: flex; align-items: baseline; justify-content: space-between; }
    .screen-top h2 { font-family: var(--display); font-weight: 700; font-size: 30px; }
    .screen-top span { color: var(--muted); font-size: 14px; }
    .back-btn { font-size: 15px; font-weight: 600; padding: 4px 0 10px; color: var(--ink); }
    html.in-tg .back-btn { display: none; }               /* в Telegram — системная «Назад» */
    .m-sec h3 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 20px 0 8px; display: flex; gap: 8px; align-items: center; }
    .m-sec h3 small { font-family: var(--text); font-weight: 500; font-size: 13px; color: var(--muted); }
    .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 6px; }
    .m-tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
    .m-tile .mw > svg, .m-tile .mw > img { width: 100%; aspect-ratio: 1; filter: drop-shadow(0 5px 7px rgba(23,33,43,.22)); transition: transform .15s ease; }
    .m-tile:active .mw > svg, .m-tile:active .mw > img { transform: scale(.94); }
    /* блик от наклона телефона на полученных медалях витрины (включается, только когда есть данные датчика).
       Полоса блика — отдельный слой, который только сдвигается: сама медаль при наклоне не перерисовывается */
    .m-tile .mw { position: relative; display: block; width: 100%; max-width: 104px; }
    .m-tile .gl { display: none; position: absolute; inset: 7%; border-radius: 50%; overflow: hidden; pointer-events: none; }
    .tilt-on .m-tile:not(.locked) .gl { display: block; }
    .m-tile .gl::before { content: ""; position: absolute; left: -80%; top: -80%; width: 260%; height: 260%; will-change: transform;
      background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.34) 48%, rgba(255,255,255,.08) 53%, transparent 62%);
      transform: translate3d(calc(var(--tiltX, 0) * 25.85%), calc(var(--tiltY, 0) * 25.85%), 0); }
    .m-tile.locked .mw > svg, .m-tile.locked .mw > img { opacity: .8; filter: none; }
    .m-tile b { font-size: 13.5px; line-height: 1.15; }
    .m-tile small { font-size: 12px; color: var(--muted); }
    .m-tile .mini { width: 74px; height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; }
    .m-tile .mini i { display: block; height: 100%; background: var(--volt); }

    /* ===== Медаль крупно (3D-монета) ===== */
    #coinView { z-index: 35; display: flex; flex-direction: column; }
    #coinView .screen-inner { flex: 1; display: flex; flex-direction: column; width: 100%; }
    .stage { flex: 1; min-height: 300px; display: flex; align-items: center; justify-content: center; perspective: 1200px; touch-action: none; position: relative; }
    .coin { position: relative; width: 240px; height: 240px; transform-style: preserve-3d; will-change: transform; }
    .coin .face, .coin .edge { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .coin .face { width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; overflow: hidden; }
    .coin .face svg { width: 100%; height: 100%; display: block; }
    .coin .face img { position: absolute; left: -4px; top: -4px; width: 248px; height: 248px; display: block; }
    .coin .edge { backface-visibility: visible; -webkit-backface-visibility: visible; }
    .sheen-mask { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none; }
    /* лучистый ободок: лучи не обрезаем кругом, блик — только внутри */
    .coin .face.grand { border-radius: 0; overflow: visible; }
    .coin .face.grand svg { overflow: visible; }
    .coin .face.grand .sheen-mask { inset: 12px; }
    /* по лучам особых медалей бежит отблеск: лучи вспыхивают по очереди, вслед за наклоном и поворотом */
    /* отблеск заранее нарисован по форме лучей и только поворачивается (CSS-маска пересчитывалась на каждом кадре вращения) */
    .ray-glint { position: absolute; left: -4px; top: -4px; width: 248px; height: 248px; pointer-events: none; will-change: transform; }
    .ray-glint canvas { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
    .sheen { position: absolute; top: 0; bottom: 0; left: -100%; width: 300%; will-change: transform;
      background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.28) 48%, rgba(255,255,255,.08) 52%, transparent 60%); }
    .coin-shadow { position: absolute; left: 50%; bottom: 4%; width: 170px; height: 22px; margin-left: -85px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(23,33,43,.28), rgba(23,33,43,0) 70%); }
    html.dark .coin-shadow { background: radial-gradient(ellipse, rgba(0,0,0,.65), rgba(0,0,0,0) 70%); }
    .coin-info { text-align: center; padding-bottom: 6px; }
    .coin-info h3 { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; }
    .coin-info p { color: var(--muted); font-size: 15px; margin-top: 6px; line-height: 1.4; }
    .coin-info .when { color: var(--ink); font-weight: 600; }
    .coin-info .hint { font-size: 13px; margin-top: 10px; }

    /* ===== Вручение новой медали ===== */
    #coinView.award-mode { transform: none; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
    #coinView.award-mode.open { opacity: 1; pointer-events: auto; }
    .coin-info .award-tag { display: none; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--volt-ink); background: var(--volt); padding: 3px 10px 2px; border-radius: 4px;
      margin: 0 auto 10px; width: max-content; }
    .award-btn { display: none; margin: 18px auto 0; min-width: 200px; padding: 13px 22px; border-radius: 10px; border: 0;
      background: var(--volt); color: var(--volt-ink); font: 600 16px var(--text); }
    .award-btn:active { opacity: .8; }
    #coinView.award-mode .coin-info .award-tag, #coinView.award-mode .award-btn { display: block; }
    #coinView.award-mode .back-btn { visibility: hidden; }
    .award-info { opacity: 1; transition: opacity .4s ease, transform .4s ease; }
    #coinView.award-mode .award-info.wait { opacity: 0; transform: translateY(10px); }
    .burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
    #coinView > .coin-pt { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    #coinView > .screen-inner { position: relative; z-index: 1; }
    .burst .glow { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,194,26,.55), rgba(255,194,26,0) 65%); opacity: 0; }
    .burst .ray { position: absolute; left: -2px; top: -150px; width: 4px; height: 44px; border-radius: 2px; background: var(--volt);
      transform-origin: 2px 150px; opacity: 0; }
    .burst.go .glow { animation: awGlow 1.1s ease-out forwards; }
    .burst.go .ray { animation: awRay .8s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
    @keyframes awGlow { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
    @keyframes awRay { 0% { opacity: 0; transform: rotate(var(--a)) translateY(60px) scaleY(.3); }
                       30% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-26px) scaleY(1); } }

    #sheet .s-note { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.35; border-top: 1px solid var(--rule); padding-top: 10px; }

    /* График */
    .chart-panel {
      margin-top: 14px; background: var(--panel); border-radius: 20px; padding: 10px 12px 8px;
      min-height: 0; display: flex; flex-direction: column;
    }
    .periods { display: flex; gap: 2px; margin-bottom: 4px; flex-shrink: 0; }
    .period-btn { flex: 1; padding: 6px 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background .2s ease, color .2s ease; }
    .period-btn.active { background: var(--volt-dim); color: var(--volt); }
    .chart-box { position: relative; flex: 1; min-height: 130px; }
    .chart-box .ms-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
    #chartNote { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 14px; color: var(--muted); padding: 0 12px; }

    /* Невысокие экраны: ужимаем, чтобы график сохранил место */
    @media (max-height: 760px) {
      .hero { margin-top: 8px; }
      .big b { font-size: clamp(60px, 19vw, 76px); }
      .goal { margin-top: 12px; }
      .chart-panel { margin-top: 10px; }
      .day { padding: 5px 0 4px; }
      .st { padding: 8px 12px; }
      .st .v { font-size: 24px; }
      .achbtn { min-height: 48px; }
      .achbtn .pill { width: 36px; height: 36px; }
    }
    @media (max-height: 660px) {
      .eta { display: none; }
      .chart-box { min-height: 100px; }
    }
    /* Очень низкие экраны: график фиксированной высоты, страница прокручивается */
    @media (max-height: 600px) {
      main { height: auto; }
      .chart-box { flex: none; height: 150px; min-height: 0; }
    }

    /* Появление экрана после заставки: блоки поднимаются по очереди */
    #dashboard.enter > * { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
    #dashboard.enter > *:nth-child(2) { animation-delay: .05s; }
    #dashboard.enter > *:nth-child(3) { animation-delay: .1s; }
    #dashboard.enter > *:nth-child(4) { animation-delay: .15s; }
    #dashboard.enter > *:nth-child(5) { animation-delay: .2s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Обновление потягиванием вниз */
    #ptr {
      position: fixed; left: 50%; top: 0; z-index: 20; width: 36px; height: 36px; margin-left: -18px;
      border-radius: 50%; background: var(--panel); color: var(--ink);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .16), inset 0 0 0 1px var(--rule);
      display: grid; place-items: center;
      transform: translateY(-48px); opacity: 0; pointer-events: none;
    }
    #ptr svg { width: 18px; height: 18px; }
    #ptr.silk-on svg { width: 30px; height: 30px; overflow: visible; }
    #ptr.back { transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s ease; }
    #ptr.spin svg { animation: ptrSpin .8s linear infinite; }
    @keyframes ptrSpin { to { transform: rotate(360deg); } }
    main.pulling { transition: none; }
    main.settle { transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
    #toast {
      position: fixed; left: 50%; top: 12px; z-index: 60; transform: translate(-50%, -70px);
      max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 10px;
      background: var(--ink); color: var(--bg); font-size: 14px; text-align: center;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }
    #toast.show { transform: translate(-50%, 0); }

    /* Сцена медали: свечение цвета медали за монетой и конфетти у особых */
    .stage .coin-shadow { bottom: auto; top: calc(50% + 150px); }
    .coin-zoom { position: relative; transform-style: preserve-3d; transform: scale(1.18); }
    @media (max-width: 370px) { .coin-zoom { transform: scale(1.06); } }
    @media (max-height: 640px) { .coin-zoom { transform: scale(1); } }
    .halo {
      position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; margin: -200px 0 0 -200px;
      border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, var(--halo, rgba(255, 194, 26, .4)) 0%, transparent 62%);
      animation: haloBreath 4s ease-in-out infinite;
    }
    @keyframes haloBreath { 0%, 100% { opacity: .75; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
    #confetti { position: fixed; inset: 0; z-index: 36; pointer-events: none; overflow: hidden; }
    #confetti i {
      position: absolute; top: -16px; width: 8px; height: 13px; border-radius: 2px;
      animation: fall var(--t) cubic-bezier(.25, .4, .5, 1) var(--d) forwards;
      opacity: 0;
    }
    @keyframes fall {
      0% { opacity: 1; transform: translate(0, 0) rotate(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--x), 105vh) rotate(var(--r)); }
    }
    @media (prefers-reduced-motion: reduce) {
      #dashboard.enter > * { animation: none; }
      .halo { animation: none; }
      #confetti { display: none; }
    }

    /* Ошибка */
    #errorBox { margin: 40px 0; border-left: 4px solid var(--up); padding: 4px 0 4px 14px; }
    #errorText { font-size: 15px; line-height: 1.4; }
    #retryBtn { margin-top: 12px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 7px; }
  </style>
</head>
<body>

  <!-- ЗАСТАВКА: узкий логотип, ритм-полоски и каждый раз новая фраза -->
  <div id="splash">
    <div class="sp-mark" aria-label="Weight Tracker"><span>Weight</span><span>Tracker</span></div>
    <div class="sp-bars" aria-hidden="true"><i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i><i style="--k:4"></i><i style="--k:5"></i><i style="--k:6"></i><i style="--k:7"></i><i style="--k:8"></i></div>
    <p class="splash-note" id="splashNote"></p>
    <canvas class="sp-pt" id="spPt" role="img"></canvas>
    <div class="sp-small" aria-hidden="true">Weight <span>Tracker</span></div>
  </div>

  <div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></div>
  <div id="toast" role="status"></div>
  <div id="confetti" aria-hidden="true"></div>
  <div id="story" role="dialog" aria-label="Итоги" aria-hidden="true">
    <div class="st-head"><span class="t" id="stTitle"></span><button class="st-x" onclick="closeStory()" aria-label="Закрыть">×</button></div>
    <div class="st-tabs" id="stTabs"></div>
    <div class="st-scroll" id="stPage"></div>
    <div class="st-poster off" id="stPoster"></div>
  </div>

  <main>
    <div id="errorBox" class="hidden">
      <p id="errorText"></p>
      <button id="retryBtn" onclick="retryFetch()">Повторить попытку</button>
    </div>

    <div id="dashboard" class="hidden">
      <button id="storyRing" class="hidden" onclick="openStory()" aria-label="Итоги месяца"><span id="storyRingTxt">сен</span></button>
      <nav id="userTabs" class="who hidden"></nav>

      <section class="hero">
        <div>
          <p class="cap" id="currWeightLabel">Вес сегодня</p>
          <div class="big"><b id="currWeight">—</b><i>кг</i></div>
        </div>
        <div class="chg">
          <div id="currDiffBadge" class="flat">—</div>
          <span id="diffGap"></span>
        </div>
      </section>

      <section class="goal">
        <div class="goal-top">
          <span>Путь к цели <b id="laneGoal">—</b></span>
          <span><b id="progressText">—</b> · тренд <b id="trendWeight">—</b></span>
        </div>
        <div class="ticks" id="ticks"></div>
        <p class="eta"><span id="goalEtaLabel">Цель будет взята:</span> <b id="goalEtaText">—</b></p>
      </section>

      <section class="chart-panel">
        <div class="periods">
          <button class="period-btn" data-p="14" onclick="setPeriod('14')">14 дн</button>
          <button class="period-btn" data-p="30" onclick="setPeriod('30')">Месяц</button>
          <button class="period-btn" data-p="90" onclick="setPeriod('90')">3 мес</button>
          <button class="period-btn" data-p="180" onclick="setPeriod('180')">Полгода</button>
          <button class="period-btn" data-p="365" onclick="setPeriod('365')">Год</button>
          <button class="period-btn active" data-p="all" onclick="setPeriod('all')">Всё</button>
        </div>
        <div class="chart-box"><canvas id="weightChart"></canvas><p id="chartNote" class="hidden">График не загрузился. Закройте и откройте приложение ещё раз.</p></div>
      </section>

      <section class="week-block">
        <div class="week-head">
          <button id="mtBtn" onclick="openMountain()" aria-controls="mtView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6.5-11 4 6.5 2.5-4L21 20z"/><path d="M9.5 9l1.8 3"/></svg>Гора</button>
          <button id="todayBtn" class="hidden" onclick="resetToToday()">К этой неделе ›</button>
        </div>
        <div id="days" class="days"></div>
        <p id="emptyWeekNote" class="hidden">На этой неделе замеров нет</p>
      </section>

      <section class="stats" id="statsRow">
        <button class="st" onclick="explainStat('wo')">
          <span><span class="k">Тренировки</span><span class="v" style="display:block"><span id="woWeek">0</span><small>/3 в нед.</small></span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        </button>
        <button class="st" onclick="explainStat('streak')">
          <span><span class="k">Серия замеров</span><span class="v" style="display:block"><span id="streakN">0</span><small> дн</small></span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2.5 3.2 5 5.6 5 9.5A5 5 0 0 1 7 12.5c0-1.9.8-3.3 1.8-4.5.3 1.6 1.2 2.6 2.4 2.8C10.9 8.3 11 5.6 12 3z"/></svg>
        </button>
      </section>

      <button class="achbtn" id="achRow" onclick="openAchScreen()">
        <span class="l"><b>Достижения</b><small id="achNextLine"></small></span>
        <span class="r"><span class="n" id="achCount">0</span><span class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></span>
      </button>
    </div>
  </main>

  <!-- Восхождение: гора на весь экран -->
  <div id="mtView" role="dialog" aria-label="Восхождение к цели">
    <div class="mt-top">
      <button class="back-btn" onclick="navBack()">‹ Назад</button>
      <h2>Восхождение</h2>
      <div class="mt-stats">
        <div><div class="k">Поднялся</div><div class="v" id="mtUp">—</div></div>
        <div class="r"><div class="k">До вершины</div><div class="v" id="mtLeft">—</div></div>
      </div>
      <p class="mt-next" id="mtNext"></p>
      <div class="mt-wx" id="mtWx"></div>
    </div>
    <svg id="mtSvg" viewBox="0 560 410 650" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Гора: тропа от стартового веса к цели"></svg>
  </div>

  <!-- Экран всех медалей -->
  <div id="achScreen" class="screen" role="dialog" aria-label="Достижения">
    <div class="screen-inner">
      <button class="back-btn" onclick="navBack()">‹ Назад</button>
      <div class="screen-top"><h2>Достижения</h2><span id="achScreenCount"></span></div>
      <div id="achSections"></div>
    </div>
  </div>

  <!-- Одна медаль крупно: 3D-монета, которую можно крутить -->
  <div id="coinView" class="screen" role="dialog" aria-label="Медаль">
    <div class="screen-inner">
      <button class="back-btn" onclick="navBack()">‹ Назад</button>
      <div class="stage" id="coinStage"><div class="halo" id="coinHalo"></div><div class="burst" id="coinBurst"></div><div class="coin-shadow"></div><div class="coin-zoom"><div class="coin" id="coin"></div></div></div>
      <div class="coin-info award-info" id="cInfo">
        <p class="award-tag" id="cTag">Новая медаль</p>
        <h3 id="cTitle"></h3>
        <p id="cDesc"></p>
        <p class="when" id="cWhen"></p>
        <p class="hint">Покрути пальцем, на обороте твой путь</p>
        <button class="award-btn" id="cNext" onclick="navBack()">Забрать</button>
      </div>
    </div>
  </div>

  <div id="sheetBack" onclick="closeMedalSheet()"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="grip"></div>
    <h3 id="sTitle"></h3>
    <p class="s-desc" id="sDesc"></p>
    <div class="s-lane"><i id="sLane"></i></div>
    <dl id="sList"></dl>
    <p class="s-note" id="sNote"></p>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    // Запрос данных уходит сразу, не дожидаясь библиотеки графика и шрифтов
    const dataUrl = () => `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(window.Telegram?.WebApp?.initData || "")}`;
    let earlyRequest = fetch(dataUrl()).then(r => r.text());
    earlyRequest.catch(() => {});

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;
    let currentPeriod = 'all';
    let selectedDateTimestamp = null;
    let currentWeekOffset = 0;
    let intro = false;          // первая отрисовка после заставки: вес и дорожка набегают с нуля
    let chartReveal = false;    // график рисуется слева направо (открытие, смена периода, человека)
    const calm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    const $ = id => document.getElementById(id);
    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const fmt = n => String(n).replace('.', ',');

    function safeHaptic(type = 'light') {
      try {
        const hf = window.Telegram?.WebApp?.HapticFeedback;
        if (!hf) return;
        if (type === 'selection') hf.selectionChanged();
        else if (['light', 'medium', 'heavy', 'rigid', 'soft'].includes(type)) hf.impactOccurred(type);
        else hf.notificationOccurred(type);
      } catch (e) {}
    }

    // Тема Telegram: тёмная или светлая
    function applyTelegramTheme() {
      // тема как в телефоне: Telegram сообщает свою, вне Telegram — настройка системы
      const tgScheme = window.Telegram?.WebApp?.colorScheme;
      const dark = tgScheme ? tgScheme !== 'light' : !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      const root = document.documentElement, changed = root.classList.contains('dark') !== dark;
      root.classList.toggle('dark', dark); root.classList.toggle('light', !dark);
      // гора перерисуется в новых цветах при следующем открытии (или сразу, если открыта)
      if (changed && $('mtSvg').dataset.built) { delete $('mtSvg').dataset.built; if (MT.open && MT.last) { MT.t = null; renderMountain(...MT.last); } }
      // шапка и фон Telegram в цвет приложения, без белой полосы сверху
      try {
        const tg = window.Telegram?.WebApp, bg = cssVar('--bg');
        if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
        if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('7.10')) tg.setBottomBarColor(bg);
      } catch (e) {}
      if (chartInstance) renderDashboard();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        // Свайп вниз по карточке медали или экрану достижений не должен сворачивать приложение
        try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
        try { tg.onEvent('themeChanged', applyTelegramTheme); } catch (e) {}
      }
      applyTelegramTheme();
      try { if (!tg) matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTelegramTheme); } catch (e) {}
      initSwipe();
      initPullToRefresh();
      fetchData();
    });

    // Неделя листается за пальцем: тянешь — дни едут следом, отпустил — неделя
    // уезжает, а новая въезжает с другой стороны. В будущее не листается (пружинит).
    let weekAnim = false;
    function initSwipe() {
      const el = $('days');
      let x0 = 0, y0 = 0, dx = 0, mode = null, moved = false;
      el.addEventListener('touchstart', e => {
        if (weekAnim) { mode = 'skip'; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = null; moved = false;
        el.style.transition = 'none';
      }, { passive: true });
      el.addEventListener('touchmove', e => {
        if (mode === 'skip') return;
        const ddx = e.touches[0].clientX - x0, ddy = e.touches[0].clientY - y0;
        if (!mode) {
          if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
          mode = Math.abs(ddx) > Math.abs(ddy) ? 'x' : 'skip';
          if (mode !== 'x') return;
        }
        moved = true;
        dx = ddx < 0 && currentWeekOffset >= 0 ? ddx * .25 : ddx;
        el.style.transform = `translateX(${dx}px)`;
        el.style.opacity = String(1 - Math.min(.5, Math.abs(dx) / el.offsetWidth));
      }, { passive: true });
      const end = () => {
        if (mode !== 'x') return;
        mode = null;
        const go = Math.abs(dx) > 50 && !(dx < 0 && currentWeekOffset >= 0);
        if (go) { turnWeek(dx > 0 ? -1 : 1); return; }
        el.style.transition = 'transform .28s cubic-bezier(.2, .8, .2, 1), opacity .28s ease';
        el.style.transform = ''; el.style.opacity = '';
      };
      el.addEventListener('touchend', end, { passive: true });
      el.addEventListener('touchcancel', end, { passive: true });
      // после перетаскивания отпущенный палец не должен «нажать» на день
      el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    }

    // dir: -1 — прошлая неделя (старая уезжает вправо), +1 — следующая
    function turnWeek(dir, apply) {
      apply = apply || (() => { currentWeekOffset += dir; selectedDateTimestamp = null; });
      const el = $('days');
      safeHaptic('light');
      if (calm()) { apply(); renderDashboard(); el.style.transform = ''; el.style.opacity = ''; return; }
      weekAnim = true;
      const w = el.offsetWidth + 24;
      el.style.transition = 'transform .17s cubic-bezier(.4, 0, 1, 1), opacity .17s ease';
      el.style.transform = `translateX(${dir < 0 ? w : -w}px)`; el.style.opacity = '0';
      setTimeout(() => {
        apply();
        renderDashboard();
        el.style.transition = 'none';
        el.style.transform = `translateX(${dir < 0 ? -w : w}px)`;
        el.offsetWidth;
        el.style.transition = 'transform .32s cubic-bezier(.2, .8, .2, 1), opacity .32s ease';
        el.style.transform = ''; el.style.opacity = '';
        setTimeout(() => { weekAnim = false; }, 320);
      }, 170);
    }

    // Потянуть вниз — обновить. Закрытие свайпом выключено через disableVerticalSwipes.
    function initPullToRefresh() {
      const main = document.querySelector('main'), ptr = $('ptr'), LIMIT = 70;
      // вместо стрелки — кольцо из шёлковых прядей: тянешь — оно дорисовывается, обновляется — крутится
      let ring = null;
      if (!calm()) { ptr.innerHTML = `<svg viewBox="0 0 24 24">${silkRaw(silkCircle(12, 12, 7.5), { n: 6, a: .3, loop: true })}</svg>`; ring = ptr.querySelector('.silk'); ptr.classList.add('silk-on'); }
      let y0 = null, x0 = 0, dy = 0, mode = null, busy = false;
      const blocked = () => busy || $('dashboard').classList.contains('hidden') ||
        document.querySelector('.screen.open, #sheet.open') || window.scrollY > 0;
      const place = (d) => {
        const k = Math.min(1, d / LIMIT);
        main.style.transform = d ? `translateY(${d * .5}px)` : '';
        ptr.style.opacity = k;
        if (ring) { ring.__u = k; if (!d) SILK.list.delete(ring); else if (!SILK.list.has(ring)) silkStart(ring); }
        ptr.style.transform = `translateY(${Math.min(d, LIMIT * 1.3) - 40}px) rotate(${d * 3}deg)`;
      };
      main.addEventListener('touchstart', e => {
        if (blocked()) { y0 = null; return; }
        y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; mode = null;
      }, { passive: true });
      main.addEventListener('touchmove', e => {
        if (y0 === null) return;
        const ddy = e.touches[0].clientY - y0, ddx = e.touches[0].clientX - x0;
        if (!mode) {
          if (Math.abs(ddy) < 8 && Math.abs(ddx) < 8) return;
          mode = ddy > 0 && Math.abs(ddy) > Math.abs(ddx) * 1.2 ? 'pull' : 'skip';
          if (mode === 'pull') { main.classList.remove('settle'); ptr.classList.remove('back'); main.classList.add('pulling'); }
        }
        if (mode !== 'pull') return;
        const was = dy >= LIMIT;
        dy = Math.max(0, ddy) * .9;
        if (!was && dy >= LIMIT) safeHaptic('light');
        place(dy);
      }, { passive: true });
      const end = () => {
        if (y0 === null || mode !== 'pull') { y0 = null; return; }
        y0 = null;
        main.classList.remove('pulling'); main.classList.add('settle'); ptr.classList.add('back');
        if (dy < LIMIT) { place(0); return; }
        busy = true;
        safeHaptic('medium');
        main.style.transform = '';
        ptr.style.opacity = 1; ptr.style.transform = 'translateY(14px)';
        if (ring) ring.__u = 1;
        ptr.classList.add('spin');
        const t0 = performance.now();
        fetchData(true).finally(() => {
          setTimeout(() => {                                   // крутилка видна хотя бы полсекунды
            ptr.classList.remove('spin'); place(0); busy = false;
          }, Math.max(0, 500 - (performance.now() - t0)));
        });
      };
      main.addEventListener('touchend', end, { passive: true });
      main.addEventListener('touchcancel', end, { passive: true });
    }

    function changeWeek(dir) {
      if (dir === 1 && currentWeekOffset >= 0) return;
      turnWeek(dir);
    }

    function resetToToday() {
      if (currentWeekOffset >= 0) return;
      turnWeek(1, () => { currentWeekOffset = 0; selectedDateTimestamp = null; });
    }

    async function fetchData(refresh) {
      try {
        const req = !refresh && earlyRequest ? earlyRequest : fetch(dataUrl()).then(r => r.text());
        earlyRequest = null;
        const text = await req;
        let data;
        try { data = JSON.parse(text); }
        catch (e) { throw new Error("Сервер Google ещё просыпается. Нажмите «Повторить попытку» через несколько секунд."); }
        if (refresh) { refreshData(data); return; }
        hideSplash(() => handleData(data));
      } catch (err) {
        // Сбой сети приходит как TypeError с английским текстом — показываем по-русски
        const netFail = err instanceof TypeError || !err.message;
        if (refresh) { toast(netFail ? "Нет связи, данные не обновились" : "Не удалось обновить, попробуйте ещё раз"); return; }
        const msg = netFail ? "Не удалось подключиться к серверу. Проверьте интернет и повторите попытку." : err.message;
        hideSplash(() => showError(msg));
      }
    }

    function retryFetch() {
      safeHaptic('light');
      $('errorBox').classList.add('hidden');
      $('splash').classList.remove('gone', 'leaving', 'sl-out');
      if (SP.s) { SP.exitAt = null; SP.left = null; SP.loaded = false; SP.s.start(); }
      fetchData();
    }

    // =====================================================================
    // ЧАСТИЦЫ (как у Gemini): тысячи тонких точек текут по плавным потокам,
    // оставляют короткий след и мягко собираются в форму. Цвет — перелив
    // лайм → мята → бирюза в цветах темы. Используются на заставке,
    // обложке недели и при вручении медали.
    // =====================================================================
    const PT = (() => {
      const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isDark = () => !document.documentElement.classList.contains('light');
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const NB = 24;
      const STOPS = { dark: [[189, 235, 91], [118, 226, 168], [92, 200, 232]], light: [[100, 149, 28], [19, 146, 110], [31, 116, 184]] };
      const RAMP = {};
      for (const k in STOPS) {
        const s = STOPS[k];
        RAMP[k] = Array.from({ length: NB }, (_, i) => {
          const u = i / (NB - 1), a = u < .5 ? s[0] : s[1], b = u < .5 ? s[1] : s[2], v = u < .5 ? u * 2 : u * 2 - 1;
          return `rgb(${a.map((x, j) => Math.round(x + (b[j] - x) * v)).join(',')})`;
        });
      }
      const ramp = () => RAMP[isDark() ? 'dark' : 'light'];
      // плавное поле направлений, как дым
      const flow = (x, y, t) => (Math.sin(x * .0105 + t * .21) + Math.sin(y * .0127 - t * .17) + Math.sin((x - y) * .0071 + t * .13) + Math.sin((x + y * .6) * .0043 - t * .09)) * 1.6;

      // точки фигуры: рисуем на скрытом холсте; по краю гуще, внутри реже. withColor — брать цвет пикселя
      function sample(W, H, draw, n, withColor, edgeShare = .42) {
        W = Math.max(1, Math.round(W)); H = Math.max(1, Math.round(H));
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const g = c.getContext('2d', { willReadFrequently: true }); draw(g, W, H);
        const d = g.getImageData(0, 0, W, H).data, edge = [], inner = [];
        // за краем холста считаем «то же самое»: фигура, уходящая за край, не получает там ложной кромки
        const on = (x, y) => x < 0 || y < 0 || x >= W || y >= H || d[(y * W + x) * 4 + 3] > 128;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          if (d[(y * W + x) * 4 + 3] <= 128) continue;

        const words = line.toUpperCase().split(' '); let fs = Math.min(W * .085, 46), lines = [];

          lines.push(cur); if (lines.length <= 3) break;

      // Запасной вариант — ID из Telegram на телефоне, затем первый в списке.
      let def = ids.find(id => globalData[id].isMe);
      if (!def) {
        const tgId = String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id || '').trim();
        def = ids.find(id => String(id).trim() === tgId) || ids[0];
      }
      activeUserId = String(def);

      renderUserTabs();
      const dash = $('dashboard');
      dash.classList.remove('hidden');
      dash.classList.add('enter');
      setTimeout(() => dash.classList.remove('enter'), 900);
      intro = true; chartReveal = true;
      renderDashboard();

      checkNewMedals();
      prebuildAchScreen();

      globalData = response;
      if (!globalData[activeUserId]) activeUserId = String(Object.keys(globalData)[0]);
      medalCache = {};

      for (const k in ST_CACHE) delete ST_CACHE[k]; // после обновления сторис тоже грузятся заново

    function calculateSMA(entries, w = 7) {
      return entries.map((_, i, arr) => {
        const sub = arr.slice(Math.max(0, i - w + 1), i + 1);
        return parseFloat((sub.reduce((s, e) => s + (parseFloat(e.weight) || 0), 0) / sub.length).toFixed(1));
      });
    }

    // Прогноз через линейную регрессию по всем замерам.
    // Нужно минимум 5 записей и 7 дней разброса, иначе прогноз не строится.
    function calculateGoalETA(entries, target, current) {
      if (!target) return "цель не задана";
      const win = entries;
      if (win.length < 5) return "нужно больше замеров";
      const t0 = win[0].timestamp, DAY = 86400000;
      if ((win[win.length - 1].timestamp - t0) / DAY < 7) return "нужна неделя замеров";
      let n = win.length, sx = 0, sy = 0, sxy = 0, sxx = 0;
      win.forEach(e => { const x = (e.timestamp - t0) / DAY, y = e.weight; sx += x; sy += y; sxy += x * y; sxx += x * x; });
      const den = n * sxx - sx * sx;
      if (den === 0) return "вес стабилен";
      const slope = (n * sxy - sx * sy) / den;
      const left = current - target;
      if (Math.abs(slope) < 0.005) return "вес стабилен";
      if (left > 0 && slope >= 0) return "нужен дефицит калорий";
      if (left < 0 && slope <= 0) return "нужен профицит калорий";
      const days = Math.abs(left / slope);
      if (!isFinite(days)) return "недоступно";
      return new Date(Date.now() + days * DAY).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Точки графика по календарным дням от первого до последнего замера периода
    function buildDailySeries(entries, smaByTs) {
      const dayStart = ts => new Date(ts).setHours(0, 0, 0, 0);
      const byDay = new Map(entries.map(e => [dayStart(e.timestamp), e]));
      const out = [];
      if (!entries.length) return out;
      const last = dayStart(entries[entries.length - 1].timestamp);
      for (let d = new Date(dayStart(entries[0].timestamp)); d.getTime() <= last; d.setDate(d.getDate() + 1)) {
        const e = byDay.get(d.getTime());
        out.push({
          label: `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`,
          weight: e ? e.weight : null,
          sma: e ? smaByTs.get(e.timestamp) : null,
          ts: e ? e.timestamp : null
        });
      }
      return out;
    }

    function renderWeek(all) {
      const box = $('days');
      box.innerHTML = '';
      const names = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const dow = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() + (dow === 0 ? -6 : 1 - dow) + currentWeekOffset * 7);
      const days = [...Array(7)].map((_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });

      $('todayBtn').classList.toggle('hidden', currentWeekOffset >= 0);

      const ws = days[0].getTime(), we = days[6].getTime() + 86400000 - 1;
      const inWeek = all.filter(e => e.timestamp >= ws && e.timestamp <= we);
      $('emptyWeekNote').classList.toggle('hidden', inWeek.length > 0);

      if (!inWeek.some(e => e.timestamp === selectedDateTimestamp)) {
        if (inWeek.length) selectedDateTimestamp = inWeek[inWeek.length - 1].timestamp;
        else if (currentWeekOffset === 0 && all.length) selectedDateTimestamp = all[all.length - 1].timestamp;
      }

      days.forEach((d, i) => {
        const idx = all.findIndex(e => { const x = new Date(e.timestamp); return x.toDateString() === d.toDateString(); });
        const entry = idx !== -1 ? all[idx] : null;
        let delta = '', cls = '';
        if (entry && idx > 0) {
          const diff = parseFloat((entry.weight - all[idx - 1].weight).toFixed(1));
          delta = diff > 0 ? `+${fmt(diff)}` : diff < 0 ? `−${fmt(Math.abs(diff))}` : '0';
          cls = diff < 0 ? 'down' : diff > 0 ? 'up' : '';
        }
        const isFuture = d.getTime() > today.getTime();
        const b = document.createElement('button');
        b.className = 'day' +
          (entry ? ' has' : ' empty') +
          (d.toDateString() === new Date().toDateString() ? ' today' : '') +
          (isFuture ? ' future' : '') +
          (entry && entry.timestamp === selectedDateTimestamp ? ' sel' : '');
        b.innerHTML = `<span class="dw">${names[i]}</span><span class="dn">${d.getDate()}</span><span class="dd ${cls}">${delta}</span>`;
        if (entry) b.onclick = () => { selectedDateTimestamp = entry.timestamp; safeHaptic('light'); renderDashboard(); };
        else b.disabled = true;
        box.appendChild(b);
      });
    }

    const HABIT_ENAMEL = { fire: '#167C8C', steps: '#5E43A8', sunmoon: '#245F9E', scale: '#7B5E3B', bird: '#C9577E' };

    // =====================================================================
    // МЕДАЛИ В СТИЛЕ Б (Вадим, 24.10): яркое поле в цвет семьи, шёлковые нити в поле
