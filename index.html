<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Tracker</title>
  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-[#f3f6fc] text-slate-900 font-sans antialiased min-h-screen pb-16 selection:bg-blue-600 selection:text-white relative overflow-x-hidden">

  <!-- Атмосферные фоновые свечения (Mesh Gradient vibe) -->
  <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-blue-400/15 rounded-full blur-[140px] pointer-events-none"></div>
  <div class="absolute top-1/4 right-10 w-[450px] h-[450px] bg-purple-400/15 rounded-full blur-[140px] pointer-events-none"></div>

  <!-- Шапка в стиле Leadly AI -->
  <header class="sticky top-0 z-50 bg-white/70 backdrop-blur-2xl border-b border-slate-200/60 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-base shadow-md shadow-blue-500/20 text-white">🏆</div>
      <h1 class="font-bold text-base tracking-tight text-slate-900">Weight Tracker</h1>
    </div>
    <!-- Переключатель пользователей в виде капсульных табов (как на референсе) -->
    <div id="userSelectorContainer" class="hidden">
      <div id="userTabs" class="flex items-center space-x-1 bg-slate-200/70 p-1 rounded-full border border-slate-300/40 shadow-inner">
        <!-- Заполняется динамически -->
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-5 relative z-10">

    <!-- Лоадер -->
    <div id="loader" class="flex flex-col items-center justify-center py-32">
      <div class="animate-spin rounded-full h-10 w-10 border-2 border-blue-600 border-t-transparent mb-3 shadow-md shadow-blue-500/20"></div>
      <p class="text-slate-500 text-xs font-medium tracking-wide">Загрузка данных...</p>
    </div>

    <!-- Ошибка -->
    <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-2xl text-xs font-medium backdrop-blur-xl"></div>

    <!-- Основной дашборд (Bento Grid) -->
    <div id="dashboardContent" class="hidden space-y-5">

      <!-- Карточка 1: Главная синяя градиентная карточка (в стиле Performance Overview) -->
      <div class="bg-gradient-to-br from-[#1d4ed8] via-[#2563eb] to-[#0284c7] text-white rounded-[32px] p-6 relative overflow-hidden shadow-[0_20px_40px_rgba(37,99,235,0.25)]">
        <!-- Внутренний блик -->
        <div class="absolute -right-10 -top-10 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="flex justify-between items-start relative z-10">
          <div>
            <p class="text-[11px] font-bold uppercase tracking-widest text-blue-100/80">Текущий вес</p>
            <p id="currWeight" class="text-4xl font-extrabold tracking-tight mt-1 text-white">-</p>
          </div>
          <span id="currDiffBadge" class="text-xs font-semibold px-3.5 py-1.5 rounded-full border backdrop-blur-md">--</span>
        </div>

        <div class="grid grid-cols-3 gap-3 mt-8 pt-5 border-t border-white/15 relative z-10">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-blue-100/70">Тренд (SMA 7)</p>
            <p id="trendWeight" class="text-sm font-extrabold text-white mt-1">-</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-blue-100/70">Старт</p>
            <p id="startWeight" class="text-sm font-extrabold text-white/90 mt-1">-</p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-wider text-blue-100/70">Цель</p>
            <p id="targetWeight" class="text-sm font-extrabold text-emerald-300 mt-1">-</p>
          </div>
        </div>
      </div>

      <!-- Карточка 2: Белая карточка с графиком и прогнозом (в стиле Overview графика) -->
      <div class="bg-white/90 backdrop-blur-xl border border-slate-200/80 rounded-[32px] p-6 shadow-[0_15px_35px_rgba(0,0,0,0.05)] relative overflow-hidden">
        <div class="flex justify-between items-center mb-5">
          <div>
            <h2 class="text-sm font-bold tracking-tight text-slate-900">Динамика и тренд</h2>
            <p class="text-[11px] text-slate-500 mt-0.5">Фактические замеры и линия скользящего среднего</p>
          </div>
          <div class="flex items-center space-x-3 text-[11px] font-medium text-slate-500">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-600 inline-block shadow-sm"></span> Факт</span>
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block shadow-sm"></span> Тренд</span>
          </div>
        </div>

        <!-- Область графика -->
        <div class="relative w-full h-[260px]">
          <canvas id="weightChart"></canvas>
        </div>

        <!-- Подвал карточки: Прогресс и дата достижения цели -->
        <div class="mt-5 pt-4 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs">
          <div id="progressText" class="font-medium text-slate-500">
            Выполнение цели: <span class="text-slate-900 font-bold">--%</span>
          </div>
          <div id="goalEtaText" class="font-medium text-slate-600 bg-slate-50 px-3.5 py-2 rounded-2xl border border-slate-200/60 shadow-sm">
            🎯 Прогноз цели: <span class="text-emerald-600 font-bold">--</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // ⚠️ Вставьте ссылку на ваше развернутое веб-приложение Google Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
      fetchData();
    });

    function fetchData() {
      const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "";
      const url = `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(initData)}&callback=handleData`;

      const script = document.createElement('script');
      script.src = url;
      script.onerror = () => {
        showError("Не удалось подключиться к серверу скрипта.");
      };
      document.body.appendChild(script);
    }

    window.handleData = function(response) {
      document.getElementById('loader').classList.add('hidden');

      if (response.error) {
        showError(response.message || "Ошибка авторизации.");
        return;
      }

      globalData = response;
      const userIds = Object.keys(globalData);

      if (userIds.length === 0) {
        showError("В базе данных нет записей.");
        return;
      }

      let defaultUid = userIds[0];
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        const tgId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        if (globalData[tgId]) defaultUid = tgId;
      }

      activeUserId = defaultUid;

      // Рендерим красивые капсульные табы для переключения пользователей
      const userTabs = document.getElementById('userTabs');
      userTabs.innerHTML = '';

      if (userIds.length > 1) {
        document.getElementById('userSelectorContainer').classList.remove('hidden');
        userIds.forEach(uid => {
          const user = globalData[uid];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `px-4 py-1.5 text-xs font-semibold rounded-full transition-all ${uid === activeUserId ? 'bg-blue-600 text-white shadow-md shadow-blue-500/25' : 'text-slate-600 hover:text-slate-900'}`;
          btn.textContent = user.name;
          btn.addEventListener('click', () => {
            activeUserId = uid;
            updateTabsUI(userIds);
            renderDashboard(globalData[activeUserId]);
          });
          userTabs.appendChild(btn);
        });
      }

      document.getElementById('dashboardContent').classList.remove('hidden');
      renderDashboard(globalData[activeUserId]);
    };

    function updateTabsUI(userIds) {
      const userTabs = document.getElementById('userTabs');
      const buttons = userTabs.children;
      userIds.forEach((uid, index) => {
        if (buttons[index]) {
          if (uid === activeUserId) {
            buttons[index].className = "px-4 py-1.5 text-xs font-semibold rounded-full transition-all bg-blue-600 text-white shadow-md shadow-blue-500/25";
          } else {
            buttons[index].className = "px-4 py-1.5 text-xs font-semibold rounded-full transition-all text-slate-600 hover:text-slate-900";
          }
        }
      });
    }

    function showError(msg) {
      document.getElementById('loader').classList.add('hidden');
      const errBox = document.getElementById('errorBox');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    function calculateSMA(entries, windowSize = 7) {
      return entries.map((entry, index, arr) => {
        const start = Math.max(0, index - windowSize + 1);
        const subset = arr.slice(start, index + 1);
        const sum = subset.reduce((acc, curr) => acc + curr.weight, 0);
        return parseFloat((sum / subset.length).toFixed(1));
      });
    }

    function calculateGoalETA(entries, target, currentWeight) {
      if (!target || entries.length < 2) return "Не задана цель";
      
      const recent = entries.slice(-14);
      const first = recent[0];
      const last = recent[recent.length - 1];
      const daysDiff = (last.timestamp - first.timestamp) / (1000 * 60 * 60 * 24);
      
      if (daysDiff <= 0) return "Расчет...";
      const weightDiff = last.weight - first.weight;
      const ratePerDay = weightDiff / daysDiff;
      
      if (ratePerDay >= 0 && currentWeight > target) return "Нужен дефицит веса";
      if (ratePerDay <= 0 && currentWeight < target) return "Нужен профицит веса";
      if (ratePerDay === 0) return "Вес стабилен";

      const remainingWeight = target - currentWeight;
      const daysToTarget = remainingWeight / ratePerDay;
      
      if (daysToTarget < 0 || isNaN(daysToTarget) || !isFinite(daysToTarget)) return "Недоступно";
      
      const targetDate = new Date(Date.now() + daysToTarget * 24 * 60 * 60 * 1000);
      return targetDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderDashboard(userData) {
      if (!userData || !userData.entries || userData.entries.length === 0) {
        showError("У пользователя нет данных о весе.");
        return;
      }

      const entries = userData.entries;
      const latest = entries[entries.length - 1];
      const prev = entries.length > 1 ? entries[entries.length - 2] : latest;
      const start = userData.start || entries[0].weight;
      const target = userData.target;

      document.getElementById('currWeight').textContent = `${latest.weight} кг`;
      document.getElementById('startWeight').textContent = `${start} кг`;
      document.getElementById('targetWeight').textContent = target ? `${target} кг` : "—";

      // Изменение за сутки
      const diffDay = parseFloat((latest.weight - prev.weight).toFixed(1));
      const badge = document.getElementById('currDiffBadge');
      if (diffDay < 0) {
        badge.textContent = `${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-3.5 py-1.5 rounded-full bg-emerald-500/20 text-emerald-100 border border-emerald-400/30 backdrop-blur-md";
      } else if (diffDay > 0) {
        badge.textContent = `+${diffDay} кг за сутки`;
        badge.className = "text-xs font-semibold px-3.5 py-1.5 rounded-full bg-red-500/20 text-red-100 border border-red-400/30 backdrop-blur-md";
      } else {
        badge.textContent = `Без изменений`;
        badge.className = "text-xs font-semibold px-3.5 py-1.5 rounded-full bg-white/15 text-white/90 border border-white/20 backdrop-blur-md";
      }

      const smaValues = calculateSMA(entries);
      document.getElementById('trendWeight').textContent = `${smaValues[smaValues.length - 1]} кг`;

      if (target) {
        const totalDist = Math.abs(target - start);
        const currentDist = Math.abs(latest.weight - start);
        let pct = totalDist > 0 ? Math.round((currentDist / totalDist) * 100) : 100;
        pct = Math.max(0, Math.min(100, pct));
        document.getElementById('progressText').innerHTML = `Выполнение цели: <span class="text-slate-900 font-bold">${pct}%</span>`;
        
        const etaDateStr = calculateGoalETA(entries, target, latest.weight);
        document.getElementById('goalEtaText').innerHTML = `🎯 Прогноз цели: <span class="text-emerald-600 font-bold">${etaDateStr}</span>`;
      } else {
        document.getElementById('progressText').innerHTML = `Цель не установлена (<code class="text-blue-600">/goal</code>)`;
        document.getElementById('goalEtaText').innerHTML = `🎯 Прогноз цели: <span class="text-slate-400">нет цели</span>`;
      }

      const labels = entries.map(e => e.dateStr);
      const weights = entries.map(e => e.weight);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('weightChart').getContext('2d');
      
      const gradient = ctx.createLinearGradient(0, 0, 0, 260);
      gradient.addColorStop(0, 'rgba(37, 99, 235, 0.15)');
      gradient.addColorStop(1, 'rgba(37, 99, 235, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Факт',
              data: weights,
              borderColor: '#2563eb',
              backgroundColor: gradient,
              borderWidth: 3,
              pointRadius: 0,
              pointHoverRadius: 6,
              pointHoverBackgroundColor: '#2563eb',
              pointHoverBorderColor: '#ffffff',
              pointHoverBorderWidth: 2,
              tension: 0.4,
              fill: true
            },
            {
              label: 'Тренд',
              data: smaValues,
              borderColor: '#059669',
              borderWidth: 2.5,
              pointRadius: 0,
              pointHoverRadius: 0,
              borderDash: [5, 5],
              tension: 0.4,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              titleColor: '#ffffff',
              bodyColor: '#cbd5e1',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              padding: 12,
              cornerRadius: 14,
              boxPadding: 4
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#64748b', font: { size: 10, family: 'Inter' } }
            },
            y: {
              grid: { color: 'rgba(0, 0, 0, 0.04)' },
              ticks: { color: '#64748b', font: { size: 10, family: 'Inter' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
