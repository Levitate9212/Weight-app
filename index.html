<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Прогресс веса</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #181818);
      color: var(--tg-theme-text-color, #ffffff);
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #242424);
      border-radius: 12px; padding: 14px; margin-bottom: 16px;
    }
    #status-msg {
      text-align: center; margin-top: 50px; font-size: 15px; color: #aaa;
      line-height: 1.5; padding: 0 16px;
    }
    .error-icon { font-size: 38px; margin-bottom: 10px; display: block; }
    .debug-box {
      font-family: monospace; font-size: 11px; color: #ff6b6b;
      margin-top: 14px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="status-msg">Загрузка данных... ⏳</div>

  <div id="content" style="display: none;">
    <div class="card">
      <canvas id="weightChart"></canvas>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    async function loadData() {
      const statusEl = document.getElementById('status-msg');
      const userId = tg?.initDataUnsafe?.user?.id;

      if (!userId) {
        statusEl.innerHTML = `
          <span class="error-icon">🔒</span>
          <b>Приватное приложение</b><br>
          Откройте график через Telegram-бота.
        `;
        return;
      }

      try {
        const response = await fetch(`${API_URL}?userId=${userId}`, {
          method: 'GET',
          redirect: 'follow'
        });

        const rawText = await response.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (e) {
          statusEl.innerHTML = `
            <span class="error-icon">⚠️</span>
            <b>Ошибка формата данных</b><br>
            Google Apps Script вернул HTML вместо JSON.<br>
            <div class="debug-box">${rawText.substring(0, 150)}...</div>
          `;
          return;
        }

        if (data.error === "unauthorized") {
          statusEl.innerHTML = `
            <span class="error-icon">⛔️</span>
            <b>Доступ запрещен</b><br>
            Ваш ID (<code>${userId}</code>) не найден в списке участников.
          `;
          return;
        }

        if (data.error) {
          statusEl.innerHTML = `
            <span class="error-icon">⚠️</span>
            Ошибка сервера: ${data.message}
          `;
          return;
        }

        statusEl.style.display = 'none';
        document.getElementById('content').style.display = 'block';
        renderChart(data);

      } catch (err) {
        statusEl.innerHTML = `
          <span class="error-icon">⚠️</span>
          Ошибка подключения к базе данных.<br>
          <div class="debug-box">${err.toString()}</div>
        `;
      }
    }

    function renderChart(users) {
      const ctx = document.getElementById('weightChart').getContext('2d');
      const datasets = [];
      let labels = [];

      const colors = ['#10b981', '#3b82f6', '#f59e0b'];
      let cIdx = 0;

      for (const uid in users) {
        const u = users[uid];
        if (labels.length === 0) {
          labels = u.entries.map(e => e.dateStr);
        }
        datasets.push({
          label: u.name,
          data: u.entries.map(e => e.weight),
          borderColor: colors[cIdx % colors.length],
          backgroundColor: colors[cIdx % colors.length],
          tension: 0.3,
          borderWidth: 2
        });
        cIdx++;
      }

      new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#aaa' } } },
          scales: {
            x: { ticks: { color: '#888' }, grid: { display: false } },
            y: { ticks: { color: '#888' }, grid: { color: '#333' } }
          }
        }
      });
    }

    loadData();
  </script>
</body>
</html>
