<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Weight Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    /* =====================================================================
       Стиль «взвешивание перед боем»: бетонный фон, графит, сигнальный жёлтый.
       Сжатый курсивный шрифт как на спортивном табло.
       ===================================================================== */
    :root {
      --bg:      #E6E9EC;   /* бетон */
      --panel:   #F5F6F7;
      --ink:     #17212B;   /* графит */
      --muted:   #6A7581;
      --rule:    #CBD1D7;
      --volt:    #FFC21A;   /* сигнальный жёлтый */
      --volt-ink:#1A1400;
      --down:    #0E9E89;   /* вес ушёл */
      --up:      #E0484D;   /* вес прибавился */
      --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
      --text:    'Barlow', system-ui, -apple-system, sans-serif;
    }
    html.dark {
      --bg:    #14181D;
      --panel: #1D232A;
      --ink:   #ECEFF2;
      --muted: #8A949F;
      --rule:  #2E363F;
      --down:  #2CC3AC;
      --up:    #FF6B6F;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      touch-action: pan-y;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
    .hidden { display: none !important; }

    /* ---------- ЗАСТАВКА: «спортивный эфир» ---------- */
    #splash {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #splash.gone { opacity: 0; visibility: hidden; }
    .sting {
      position: relative;
      width: 100%;
      height: 170px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    /* Косые плашки пролетают ЗА надписью, как в заставке спортивной трансляции */
    /* Плашки движутся через всю ширину экрана (left в %, а не translate от
       собственной ширины) и в конце полностью улетают за правый край */
    .sting-slab {
      position: absolute; top: 18px; bottom: 18px;
      width: 62%;
      left: -80%;
      background: var(--volt);
      transform: skewX(-18deg);
      animation: slab 1.7s cubic-bezier(.7, 0, .25, 1) infinite;
    }
    .sting-slab.thin {
      width: 7%;
      top: 30px; bottom: 30px;
      opacity: .55;
      animation-delay: .14s;
    }
    @keyframes slab {
      0%   { left: -80%; }
      60%  { left: 120%; }
      100% { left: 120%; }
    }
    .sting-word {
      position: relative; z-index: 2;
      font-family: var(--display);
      font-style: italic; font-weight: 800;
      font-size: clamp(48px, 15vw, 66px); line-height: .84;
      letter-spacing: -.5px;
      text-transform: uppercase;
      text-align: left;
      color: var(--ink);
    }
    .sting-word span { display: block; padding-left: .5em; }
    .splash-note { margin-top: 18px; font-size: 14px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .sting-slab { animation: none; left: 20%; }
      .sting-slab.thin { display: none; }
    }

    /* ---------- КАРКАС ---------- */
    /* Вся страница = ровно высота окна Telegram; график забирает остаток */
    main {
      max-width: 440px; margin: 0 auto;
      min-height: var(--tg-viewport-stable-height, 100dvh);
      height: var(--tg-viewport-stable-height, 100dvh);
      padding: 10px 18px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
    }
    #dashboard { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    /* Низкие экраны (iPhone SE, mini): ужимаем ещё, а если всё равно
       не помещается — график получает фиксированную высоту и страница
       прокручивается, вместо того чтобы сплющить график */
    @media (max-height: 700px) {
      .duel-name { font-size: 20px; }
      .big { font-size: clamp(50px, 16vw, 64px); }
      .day .dw { font-size: 11px; }
      .day .dn { font-size: 17px; }
      .board { margin-top: 8px; }
      .chart-panel { margin-top: 10px; }
      .lane-block { margin-top: 8px; }
    }
    @media (max-height: 600px) {
      main { height: auto; }
      .chart-box { flex: none; height: 170px; }
    }
    #dashboard.hidden { display: none !important; }

    /* Имена атлетов — как в карде боя */
    .duel {
      display: flex; align-items: baseline; justify-content: center;
      gap: 22px; margin-bottom: 8px;
    }
    .duel-name {
      font-family: var(--display); font-style: italic; font-weight: 800;
      font-size: 23px; text-transform: uppercase; letter-spacing: .2px;
      color: var(--muted);
      padding: 0 2px 3px;
      position: relative;
      transition: color .2s ease;
    }
    .duel-name.active { color: var(--ink); }
    .duel-name.active::after {
      content: ""; position: absolute; left: -2px; right: -2px; bottom: 0;
      height: 5px; background: var(--volt); transform: skewX(-18deg);
    }

    /* Неделя */
    .week-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 14px; color: var(--muted); margin-bottom: 4px;
    }
    .week-nav { display: flex; align-items: center; gap: 4px; }
    .week-nav button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
    .week-nav button:disabled { opacity: .3; pointer-events: none; }
    #weekPeriodLabel { font-weight: 600; color: var(--ink); min-width: 118px; text-align: center; }
    #todayBtn { font-size: 13px; font-weight: 600; color: var(--ink); border-bottom: 2px solid var(--volt); padding-bottom: 1px; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; touch-action: pan-y; }
    .day {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 4px 0 3px; border-radius: 8px;
      border: 1.5px solid transparent;
    }
    .day .dw { font-size: 12px; color: var(--muted); }
    .day .dn { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.05; }
    .day .dd { font-size: 11px; font-weight: 600; min-height: 14px; color: var(--muted); }
    .day.has { background: var(--panel); }
    .day.empty .dn { color: var(--muted); opacity: .6; }
    .day.today { border-color: var(--ink); }
    .day.future { opacity: .35; }
    .day.sel { background: var(--volt); color: var(--volt-ink); }
    .day.sel .dw, .day.sel .dd { color: var(--volt-ink); }
    .dd.down { color: var(--down); } .dd.up { color: var(--up); }
    #emptyWeekNote { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* Табло веса */
    .board { margin-top: 12px; }
    .board-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    #currWeightLabel { font-size: 14px; color: var(--muted); }
    .big {
      margin-top: 4px;
      font-family: var(--display); font-style: italic; font-weight: 800;
      font-size: clamp(52px, 16.5vw, 76px); line-height: .82; letter-spacing: -1.5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .big small { font-size: 26px; font-weight: 700; letter-spacing: 0; margin-left: 4px; color: var(--muted); }
    #currDiffBadge {
      font-family: var(--display); font-weight: 700; font-size: 19px;
      white-space: nowrap;
    }
    #currDiffBadge i { display: block; font-style: normal; font-family: var(--text); font-weight: 500; font-size: 12.5px; color: var(--muted); line-height: 1.1; }
    #currDiffBadge.down { color: var(--down); } #currDiffBadge.up { color: var(--up); } #currDiffBadge.flat { color: var(--muted); }
    .big-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .side { text-align: right; padding-bottom: 2px; flex-shrink: 0; }
    #trendLine { font-size: 12.5px; color: var(--muted); margin-top: 5px; white-space: nowrap; }
    #trendLine b { font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--ink); }
    .ach { margin-top: 10px; border-top: 1.5px solid var(--ink); padding-top: 7px; }
    .ach-head { display: flex; justify-content: space-between; align-items: baseline; }
    .ach-head span { font-family: var(--display); font-weight: 700; font-size: 18px; }
    .ach-head b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 20px; }
    .ach-next { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-top: 3px; font-size: 13px; color: var(--muted); }
    #achNextTitle { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
    .ach-lane { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
    .ach-lane i { display: block; height: 100%; width: 0; background: var(--volt); transition: width .6s ease; }
    #achNextText { white-space: nowrap; }

    /* График */
    .chart-panel {
      margin-top: 14px; background: var(--panel); border-radius: 10px; padding: 10px 12px 8px;
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .chart-head h2 { font-family: var(--display); font-weight: 700; font-size: 19px; }
    .legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
    .periods { display: grid; grid-template-columns: repeat(6, 1fr); border: 1.5px solid var(--rule); border-radius: 7px; overflow: hidden; margin-bottom: 6px; flex-shrink: 0; }
    .period-btn { padding: 4px 0; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); }
    .period-btn.active { background: var(--ink); color: var(--bg); }
    .chart-box { position: relative; flex: 1; min-height: 120px; }

    /* Путь к цели — беговая дорожка */
    .lane-block { margin-top: 12px; flex-shrink: 0; }
    .lane-top { display: flex; justify-content: space-between; align-items: baseline; }
    .lane-top h2 { font-family: var(--display); font-weight: 700; font-size: 19px; }
    #progressText { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 28px; line-height: 1; }
    .lane {
      position: relative; height: 13px; margin-top: 5px; border-radius: 3px;
      background:
        repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--rule) calc(10% - 1px) 10%),
        var(--panel);
      overflow: hidden;
    }
    #laneFill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: var(--volt);
      transition: width .7s cubic-bezier(.2, .8, .2, 1);
    }
    #laneFill::after {
      content: ""; position: absolute; right: -4px; top: -2px; bottom: -2px; width: 8px;
      background: var(--ink); transform: skewX(-18deg);
    }
    .lane-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 3px; }
    .lane-ends span:first-child { color: var(--ink); font-weight: 600; }
    .forecast { margin-top: 6px; font-size: 14px; }
    .forecast b { font-family: var(--display); font-weight: 700; font-size: 18px; }

    /* Невысокие экраны: ужимаем крупные элементы, чтобы график сохранил место */
    @media (max-height: 640px) {
      main { padding-top: 6px; }
      .duel { margin-bottom: 4px; }
      .duel-name { font-size: 20px; }
      .week-head { margin-bottom: 2px; }
      .day { padding: 3px 0 2px; }
      .day .dw { font-size: 11px; }
      .day .dn { font-size: 17px; }
      .board { margin-top: 8px; }
      .big { font-size: clamp(46px, 15vw, 60px); }
      .big small { font-size: 21px; }
      .ach { margin-top: 7px; padding-top: 5px; }
      .chart-panel { margin-top: 10px; padding: 8px 10px 6px; }
      .chart-head h2, .lane-top h2 { font-size: 17px; }
      .chart-box { min-height: 100px; }
      .lane-block { margin-top: 8px; }
      #progressText { font-size: 23px; }
      .forecast { margin-top: 4px; font-size: 13px; }
      .forecast b { font-size: 16px; }
    }
    @media (max-height: 540px) {
      .legend { display: none; }
      .chart-box { min-height: 80px; }
    }

    /* Маленькие экраны (iPhone SE, mini): ужимаем вертикальные отступы */
    @media (max-height: 640px) {
      .duel { margin-bottom: 4px; }
      .duel-name { font-size: 20px; }
      .board { margin-top: 8px; }
      .big { font-size: clamp(48px, 16vw, 64px); }
      .ach { margin-top: 7px; padding-top: 5px; }
      .chart-panel { margin-top: 10px; }
      .lane-block { margin-top: 8px; }
      .forecast { margin-top: 4px; }
    }

    /* Ошибка */
    #errorBox { margin: 40px 0; border-left: 4px solid var(--up); padding: 4px 0 4px 14px; }
    #errorText { font-size: 15px; line-height: 1.4; }
    #retryBtn { margin-top: 12px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 7px; }
  </style>
</head>
<body>

  <!-- ЗАСТАВКА: жёлтая косая плашка пролетает за надписью, как в спортивном эфире -->
  <div id="splash">
    <div class="sting" aria-hidden="true">
      <div class="sting-slab"></div>
      <div class="sting-slab thin"></div>
      <div class="sting-word">Weight<span>Tracker</span></div>
    </div>
    <p class="splash-note">Загружаем ваш прогресс</p>
  </div>

  <main>
    <div id="errorBox" class="hidden">
      <p id="errorText"></p>
      <button id="retryBtn" onclick="retryFetch()">Повторить попытку</button>
    </div>

    <div id="dashboard" class="hidden">
      <nav id="userTabs" class="duel hidden" style="flex-shrink:0"></nav>

      <section style="flex-shrink:0">
        <div class="week-head">
          <div class="week-nav">
            <button onclick="changeWeek(-1)" aria-label="Прошлая неделя">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span id="weekPeriodLabel">Неделя</span>
            <button id="nextWeekBtn" onclick="changeWeek(1)" aria-label="Следующая неделя">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <button id="todayBtn" class="hidden" onclick="resetToToday()">К этой неделе</button>
        </div>
        <div id="days" class="days"></div>
        <p id="emptyWeekNote" class="hidden">На этой неделе замеров нет</p>
      </section>

      <section class="board" style="flex-shrink:0">
        <p id="currWeightLabel">Текущий вес</p>
        <div class="big-row">
          <div class="big"><span id="currWeight">—</span><small>кг</small></div>
          <div class="side">
            <div id="currDiffBadge" class="flat">—</div>
            <div id="trendLine">тренд <b id="trendWeight">—</b></div>
          </div>
        </div>
        <!-- Достижения: сколько медалей получено и ближайшая с прогрессом -->
        <div class="ach" id="achRow">
          <div class="ach-head"><span>Достижения</span><b id="achCount">0</b></div>
          <div class="ach-next" id="achNext">
            <span id="achNextTitle">—</span>
            <span class="ach-lane"><i id="achNextFill"></i></span>
            <span id="achNextText"></span>
          </div>
        </div>
      </section>

      <section class="chart-panel">
        <div class="chart-head">
          <h2>Динамика</h2>
          <div class="legend">
            <span><i style="background:var(--ink)"></i>Факт</span>
            <span><i style="background:var(--volt)"></i>Тренд</span>
          </div>
        </div>
        <div class="periods">
          <button class="period-btn" data-p="14" onclick="setPeriod('14')">14д</button>
          <button class="period-btn" data-p="30" onclick="setPeriod('30')">30д</button>
          <button class="period-btn" data-p="90" onclick="setPeriod('90')">90д</button>
          <button class="period-btn" data-p="180" onclick="setPeriod('180')">180д</button>
          <button class="period-btn" data-p="365" onclick="setPeriod('365')">Год</button>
          <button class="period-btn active" data-p="all" onclick="setPeriod('all')">Все</button>
        </div>
        <div class="chart-box"><canvas id="weightChart"></canvas></div>
      </section>

      <section class="lane-block">
        <div class="lane-top">
          <h2>Путь к цели</h2>
          <span id="progressText">—</span>
        </div>
        <div class="lane"><div id="laneFill"></div></div>
        <div class="lane-ends"><span id="laneStart"></span><span id="laneGoal"></span></div>
        <p class="forecast">Цель будет взята: <b id="goalEtaText">—</b></p>
      </section>
    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;
    let currentPeriod = 'all';
    let selectedDateTimestamp = null;
    let currentWeekOffset = 0;

    const $ = id => document.getElementById(id);
    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const fmt = n => String(n).replace('.', ',');

    function safeHaptic(type = 'light') {
      try {
        const hf = window.Telegram?.WebApp?.HapticFeedback;
        if (!hf) return;
        if (type === 'selection') hf.selectionChanged();
        else if (['light', 'medium', 'heavy', 'rigid', 'soft'].includes(type)) hf.impactOccurred(type);
        else hf.notificationOccurred(type);
      } catch (e) {}
    }

    // Тема Telegram: тёмная или светлая
    function applyTelegramTheme() {
      let isDark = false;
      try { isDark = window.Telegram?.WebApp?.colorScheme === 'dark'; } catch (e) {}
      document.documentElement.classList.toggle('dark', isDark);
      if (chartInstance) renderDashboard();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        try { tg.onEvent('themeChanged', applyTelegramTheme); } catch (e) {}
      }
      applyTelegramTheme();
      initSwipe();
      fetchData();
    });

    function initSwipe() {
      const el = $('days');
      let x0 = 0;
      el.addEventListener('touchstart', e => { x0 = e.changedTouches[0].screenX; }, { passive: true });
      el.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - x0;
        if (dx > 40) changeWeek(-1);
        else if (dx < -40) changeWeek(1);
      }, { passive: true });
    }

    function changeWeek(dir) {
      if (dir === 1 && currentWeekOffset >= 0) return;
      currentWeekOffset += dir;
      selectedDateTimestamp = null;
      safeHaptic('light');
      renderDashboard();
    }

    function resetToToday() {
      currentWeekOffset = 0;
      selectedDateTimestamp = null;
      safeHaptic('medium');
      renderDashboard();
    }

    async function fetchData() {
      const initData = window.Telegram?.WebApp?.initData || "";
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?initData=${encodeURIComponent(initData)}`);
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); }
        catch (e) { throw new Error("Сервер Google ещё просыпается. Нажмите «Повторить попытку» через несколько секунд."); }
        handleData(data);
      } catch (err) {
        showError(err.message || "Не удалось подключиться к серверу. Проверьте интернет и повторите попытку.");
      }
    }

    function retryFetch() {
      safeHaptic('light');
      $('errorBox').classList.add('hidden');
      $('splash').classList.remove('gone');
      fetchData();
    }

    function hideSplash() { $('splash').classList.add('gone'); }

    function showError(msg) {
      hideSplash();
      $('errorText').textContent = msg;
      $('errorBox').classList.remove('hidden');
    }

    function handleData(response) {
      hideSplash();
      if (response.error) { showError(response.message || "Нет доступа. Откройте приложение через бота."); return; }

      globalData = response;
      const ids = Object.keys(globalData);
      if (ids.length === 0) { showError("Замеров пока нет. Отправьте вес боту, и он появится здесь."); return; }

      // Сервер по проверенной подписи Telegram помечает, кто открыл приложение (isMe).
      // Запасной вариант — ID из Telegram на телефоне, затем первый в списке.
      let def = ids.find(id => globalData[id].isMe);
      if (!def) {
        const tgId = String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id || '').trim();
        def = ids.find(id => String(id).trim() === tgId) || ids[0];
      }
      activeUserId = String(def);

      renderUserTabs();
      $('dashboard').classList.remove('hidden');
      renderDashboard();
    }

    function renderUserTabs() {
      const nav = $('userTabs');
      const ids = Object.keys(globalData);
      if (ids.length <= 1) { nav.classList.add('hidden'); return; }
      nav.classList.remove('hidden');
      nav.innerHTML = '';
      ids.forEach((uid, i) => {
        const b = document.createElement('button');
        b.className = 'duel-name' + (String(uid) === activeUserId ? ' active' : '');
        b.textContent = globalData[uid].name || uid;
        b.onclick = () => selectUser(uid);
        nav.appendChild(b);
      });
    }

    function selectUser(uid) {
      if (String(uid) === activeUserId) return;
      activeUserId = String(uid);
      selectedDateTimestamp = null;
      currentWeekOffset = 0;
      safeHaptic('selection');
      renderUserTabs();
      renderDashboard();
    }

    function setPeriod(p) {
      currentPeriod = p;
      safeHaptic('light');
      document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b.dataset.p === p));
      renderDashboard();
    }

    function calculateSMA(entries, w = 7) {
      return entries.map((_, i, arr) => {
        const sub = arr.slice(Math.max(0, i - w + 1), i + 1);
        return parseFloat((sub.reduce((s, e) => s + (parseFloat(e.weight) || 0), 0) / sub.length).toFixed(1));
      });
    }

    // Прогноз через линейную регрессию по последним 30 замерам.
    // Нужно минимум 5 записей и 7 дней разброса, иначе прогноз не строится.
    function calculateGoalETA(entries, target, current) {
      if (!target) return "цель не задана";
      const win = entries.slice(-30);
      if (win.length < 5) return "нужно больше замеров";
      const t0 = win[0].timestamp, DAY = 86400000;
      if ((win[win.length - 1].timestamp - t0) / DAY < 7) return "нужна неделя замеров";
      let n = win.length, sx = 0, sy = 0, sxy = 0, sxx = 0;
      win.forEach(e => { const x = (e.timestamp - t0) / DAY, y = e.weight; sx += x; sy += y; sxy += x * y; sxx += x * x; });
      const den = n * sxx - sx * sx;
      if (den === 0) return "вес стабилен";
      const slope = (n * sxy - sx * sy) / den;
      const left = current - target;
      if (Math.abs(slope) < 0.005) return "вес стабилен";
      if (left > 0 && slope >= 0) return "нужен дефицит калорий";
      if (left < 0 && slope <= 0) return "нужен профицит калорий";
      const days = Math.abs(left / slope);
      if (!isFinite(days)) return "недоступно";
      return new Date(Date.now() + days * DAY).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function renderWeek(all) {
      const box = $('days');
      box.innerHTML = '';
      const names = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const dow = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() + (dow === 0 ? -6 : 1 - dow) + currentWeekOffset * 7);
      const days = [...Array(7)].map((_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });

      $('weekPeriodLabel').textContent =
        `${days[0].getDate()} ${months[days[0].getMonth()]} – ${days[6].getDate()} ${months[days[6].getMonth()]}`;
      $('nextWeekBtn').disabled = currentWeekOffset >= 0;
      $('todayBtn').classList.toggle('hidden', currentWeekOffset >= 0);

      const ws = days[0].getTime(), we = days[6].getTime() + 86400000 - 1;
      const inWeek = all.filter(e => e.timestamp >= ws && e.timestamp <= we);
      $('emptyWeekNote').classList.toggle('hidden', inWeek.length > 0);

      if (!inWeek.some(e => e.timestamp === selectedDateTimestamp)) {
        if (inWeek.length) selectedDateTimestamp = inWeek[inWeek.length - 1].timestamp;
        else if (currentWeekOffset === 0 && all.length) selectedDateTimestamp = all[all.length - 1].timestamp;
      }

      days.forEach((d, i) => {
        const idx = all.findIndex(e => { const x = new Date(e.timestamp); return x.toDateString() === d.toDateString(); });
        const entry = idx !== -1 ? all[idx] : null;
        let delta = '', cls = '';
        if (entry && idx > 0) {
          const diff = parseFloat((entry.weight - all[idx - 1].weight).toFixed(1));
          delta = diff > 0 ? `+${fmt(diff)}` : diff < 0 ? `−${fmt(Math.abs(diff))}` : '0';
          cls = diff < 0 ? 'down' : diff > 0 ? 'up' : '';
        }
        const isFuture = d.getTime() > today.getTime();
        const b = document.createElement('button');
        b.className = 'day' +
          (entry ? ' has' : ' empty') +
          (d.toDateString() === new Date().toDateString() ? ' today' : '') +
          (isFuture ? ' future' : '') +
          (entry && entry.timestamp === selectedDateTimestamp ? ' sel' : '');
        b.innerHTML = `<span class="dw">${names[i]}</span><span class="dn">${d.getDate()}</span><span class="dd ${cls}">${delta}</span>`;
        if (entry) b.onclick = () => { selectedDateTimestamp = entry.timestamp; safeHaptic('light'); renderDashboard(); };
        else b.disabled = true;
        box.appendChild(b);
      });
    }

    const DAY_MS = 86400000;
    const dayKey = ts => { const d = new Date(ts); return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate(); };

    const plural = (n, one, few, many) => {
      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return one;
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
      return many;
    };

    // Строка достижений: число полученных медалей и ближайшая с прогрессом
    function renderAchievements(u) {
      const row = $('achRow');
      const m = u.medals;
      if (!m) { row.classList.add('hidden'); return; }       // сервер ещё без медалей
      row.classList.remove('hidden');
      const n = m.earned.length;
      $('achCount').textContent = `${n} ${plural(n, 'медаль', 'медали', 'медалей')}`;
      const nx = m.next && m.next[0];
      if (nx) {
        $('achNextTitle').textContent = nx.title;
        $('achNextFill').style.width = Math.round(nx.progress * 100) + '%';
        $('achNextText').textContent = nx.progressText;
      } else {
        $('achNextTitle').textContent = 'Все доступные медали получены';
        $('achNextFill').style.width = '100%';
        $('achNextText').textContent = '';
      }
    }

    function renderDashboard() {
      $('errorBox').classList.add('hidden');
      const u = globalData[activeUserId];
      if (!u || !u.entries || !u.entries.length) {
        showError(`У ${u ? u.name : 'атлета'} пока нет замеров. Отправьте вес боту, и он появится здесь.`);
        return;
      }

      const all = u.entries;
      renderWeek(all);

      let target = all[all.length - 1], past = false;
      if (selectedDateTimestamp) {
        const f = all.find(e => e.timestamp === selectedDateTimestamp);
        if (f) { target = f; past = f.timestamp !== all[all.length - 1].timestamp; }
      }
      const ti = all.findIndex(e => e.timestamp === target.timestamp);
      const prev = ti > 0 ? all[ti - 1] : target;
      const start = u.start || all[0].weight;
      const goal = u.target;

      $('currWeightLabel').textContent = past ? `Замер за ${target.dateStr}` : 'Текущий вес';
      $('currWeight').textContent = fmt(target.weight);
      renderAchievements(u);
      $('trendWeight').textContent = `${fmt(calculateSMA(all)[ti])} кг`;

      const diff = parseFloat((target.weight - prev.weight).toFixed(1));
      const badge = $('currDiffBadge');
      if (ti === 0) { badge.className = 'flat'; badge.innerHTML = '—<i>первый замер</i>'; }
      else if (diff < 0) { badge.className = 'down'; badge.innerHTML = `−${fmt(Math.abs(diff))} кг<i>за сутки</i>`; }
      else if (diff > 0) { badge.className = 'up'; badge.innerHTML = `+${fmt(diff)} кг<i>за сутки</i>`; }
      else { badge.className = 'flat'; badge.innerHTML = `0 кг<i>за сутки</i>`; }


      if (goal) {
        const total = Math.abs(goal - start);
        const done = (start >= goal) ? start - target.weight : target.weight - start;
        const pct = Math.max(0, Math.min(100, total > 0 ? Math.round(done / total * 100) : 100));
        $('progressText').textContent = `${pct}%`;
        $('laneFill').style.width = pct + '%';
        const leftKg = parseFloat(Math.abs(target.weight - goal).toFixed(1));
        // Края дорожки — только старт и цель; сброшено/осталось уже есть строкой выше
        $('laneStart').textContent = `Старт ${fmt(start)} кг`;
        $('laneGoal').textContent = `Цель ${fmt(goal)} кг`;
        $('goalEtaText').textContent = leftKg > 0 ? calculateGoalETA(all, goal, target.weight) : 'уже взята';
      } else {
        $('progressText').textContent = '—';
        $('laneFill').style.width = '0%';
        $('laneStart').textContent = `Старт ${fmt(start)} кг`;
        $('laneGoal').textContent = 'Цель: команда /цель 80';
        $('goalEtaText').textContent = 'цель не задана';
      }

      let chartEntries = all;
      if (currentPeriod !== 'all') {
        const cut = all[all.length - 1].timestamp - parseInt(currentPeriod) * 86400000;
        chartEntries = all.filter(e => e.timestamp >= cut);
      }

      if (chartInstance) chartInstance.destroy();
      if (typeof Chart === 'undefined') return;

      const ink = cssVar('--ink'), volt = cssVar('--volt'), muted = cssVar('--muted'), rule = cssVar('--rule'), panel = cssVar('--panel');

      chartInstance = new Chart($('weightChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: chartEntries.map(e => e.dateStr),
          datasets: [
            {
              label: 'Тренд',
              data: calculateSMA(chartEntries),
              borderColor: volt,
              borderWidth: 5,
              pointRadius: 0,
              tension: 0.4,
              order: 2
            },
            {
              label: 'Факт',
              data: chartEntries.map(e => e.weight),
              borderColor: ink,
              borderWidth: 2,
              pointRadius: chartEntries.map(e => e.timestamp === target.timestamp ? 5 : 2),
              pointBackgroundColor: chartEntries.map(e => e.timestamp === target.timestamp ? volt : ink),
              pointBorderColor: ink,
              pointBorderWidth: chartEntries.map(e => e.timestamp === target.timestamp ? 2 : 0),
              tension: 0.25,
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: ink,
              titleColor: panel,
              bodyColor: panel,
              titleFont: { family: 'Barlow Condensed', weight: '700', size: 15 },
              bodyFont: { family: 'Barlow', size: 13 },
              padding: 10,
              cornerRadius: 6,
              displayColors: false,
              callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)} кг` }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              border: { color: rule },
              ticks: { color: muted, font: { family: 'Barlow', size: 11 }, maxTicksLimit: 6, maxRotation: 0 }
            },
            y: {
              grid: { color: rule, drawTicks: false },
              border: { display: false },
              ticks: { color: muted, font: { family: 'Barlow', size: 11 }, padding: 6, maxTicksLimit: 5, callback: v => fmt(Number(v.toFixed(1))) }
            }
          }
        }
      });
    }
  </script>
</body>
