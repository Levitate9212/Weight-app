<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Weight Tracker</title>
  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
      background-color: #f3f6fc;
      touch-action: pan-y;
      margin: 0;
      padding: 0;
      position: fixed;
    }
    #splashScreen {
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes stepn-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .stepn-bar {
      animation: stepn-shimmer 1.6s infinite linear;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .neon-pulse {
      animation: pulse-glow 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="text-slate-900 font-sans antialiased selection:bg-blue-600 selection:text-white flex flex-col justify-between items-center px-4 pt-safe pb-safe">

  <!-- ПОЛНОЭКРАННАЯ АТМОСФЕРНАЯ ЗАСТАВКА В СТИЛЕ STEPN (С БЕГУЩИМ ПАРНЕМ) -->
  <div id="splashScreen" class="fixed inset-0 w-screen h-screen z-[99999] bg-[#070913] flex flex-col justify-between items-center py-12 px-6 text-white text-center overflow-hidden">
    
    <!-- Фонуай пейзаж: Градиентное небо и неоновые холмы -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#141b33] via-[#090c17] to-[#040609] pointer-events-none"></div>
    
    <!-- Стилизованные горы в фоне (SVG векторный пейзаж) -->
    <div class="absolute bottom-0 left-0 right-0 h-[65%] opacity-80 pointer-events-none flex items-end justify-center">
      <svg class="w-full h-full object-cover" viewBox="0 0 400 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Дальние горы -->
        <polygon points="0,400 120,220 250,380 400,180 400,600 0,600" fill="#1b1238"/>
        <!-- Ближние горы / холмы с розово-фиолетовым отливом -->
        <polygon points="0,450 80,320 190,460 310,290 400,420 400,600 0,600" fill="#2d1d4f"/>
        <polygon points="0,500 150,380 280,480 400,350 400,600 0,600" fill="#3b2260"/>
        
        <!-- Извилистая неоново-лаймовая дорога (трек) -->
        <path d="M 200,600 Q 210,480 160,420 T 230,300 T 190,200 L 210,180 Q 250,280 180,380 T 220,600 Z" fill="#00ff87" opacity="0.85" filter="drop-shadow(0 0 15px #00ff87)"/>
      </svg>
    </div>

    <!-- Верхняя энергия и молния в стиле STEPN -->
    <div class="relative z-10 flex flex-col items-center pt-2">
      <div class="w-10 h-10 rounded-2xl bg-[#00ff87]/20 border border-[#00ff87]/50 flex items-center justify-center shadow-[0_0_20px_#00ff87] mb-2 neon-pulse">
        <svg class="w-6 h-6 text-[#00ff87]" fill="currentColor" viewBox="0 0 24 24">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-white/10 border border-white/15 backdrop-blur-md">
        <span class="w-1.5 h-1.5 rounded-full bg-[#00ff87] animate-ping"></span>
        <span class="text-[9px] font-extrabold tracking-widest uppercase text-[#00ff87]">Web3 Running Engine</span>
      </div>
    </div>

    <!-- Центральный персонаж: Бегущий парень со спины -->
    <div class="relative z-10 flex flex-col items-center my-auto">
      <div class="relative flex items-center justify-center w-36 h-36">
        <!-- Неоновый ореол вокруг бегуна -->
        <div class="absolute inset-0 rounded-full bg-[#00ff87]/20 blur-2xl neon-pulse"></div>
        
        <!-- Силуэт бегущего парня (атлет со спины в капюшоне / спортивной форме) -->
        <svg class="w-28 h-28 text-[#00ff87] filter drop-shadow-[0_0_12px_#00ff87]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <!-- Голова и капюшон -->
          <circle cx="12" cy="5" r="2.2" fill="currentColor"/>
          <!-- Торс и плечи (мощная мужская спина) -->
          <path d="M9 8h6l1 5h-8z"/>
          <!-- Руки в динамичном беге -->
          <path d="M15 10l3 3-1.5 1.5"/>
          <path d="M9 10l-3 3 1.5 1.5"/>
          <!-- Ноги в шаге -->
          <path d="M11 13l-1.5 5.5 2.5 1.5"/>
          <path d="M13 13l2 5-2 2"/>
        </svg>
      </div>
      
      <h2 class="font-extrabold text-white text-base tracking-[0.25em] uppercase mt-2">WEIGHT TRACKER <span class="text-[#00ff87]">AI</span></h2>
    </div>

    <!-- Нижняя часть: Прогресс-бар загрузки -->
    <div class="relative z-10 w-full max-w-[220px] flex flex-col items-center pb-2">
      <div class="w-full h-2 bg-[#151c2e] rounded-full overflow-hidden relative border border-white/10 shadow-inner">
        <div class="absolute top-0 left-0 bottom-0 w-1/2 bg-gradient-to-r from-[#00ff87] to-[#60efff] rounded-full stepn-bar shadow-[0_0_15px_#00ff87]"></div>
      </div>
      <p class="text-slate-400 text-[10px] mt-3 font-bold tracking-[0.2em] uppercase">Синхронизация данных...</p>
    </div>

  </div>

  <!-- Фоновые сферы для дашборда -->
  <div class="fixed top-[-10%] left-[-10%] w-[350px] h-[350px] bg-blue-400/20 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[350px] h-[350px] bg-purple-400/15 rounded-full blur-[100px] pointer-events-none"></div>

  <main class="w-full max-w-md h-full flex flex-col justify-center space-y-3 relative z-15 overflow-y-auto no-scrollbar py-2">

    <!-- Переключатель пользователей -->
    <div id="userSelectorContainer" class="hidden flex justify-center flex-shrink-0">
      <div id="userTabs" class="flex items-center space-x-1 bg-white/85 backdrop-blur-md p-1 rounded-full border border-slate-200/80 shadow-sm"></div>
    </div>

    <!-- Ошибка -->
    <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-2xl text-xs font-medium shadow-sm"></div>

    <!-- Основной контент -->
    <div id="dashboardContent" class="hidden space-y-3 flex-shrink-0">

      <!-- Карточка 1: Главная градиентная карточка -->
      <div class="bg-gradient-to-br from-[#1d4ed8] via-[#2563eb] to-[#0284c7] text-white rounded-[28px] p-4.5 relative overflow-hidden shadow-[0_15px_30px_rgba(37,99,235,0.25)]">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/15 rounded-full blur-2xl pointer-events-none"></div>

        <div class="flex justify-between items-start relative z-10">
          <div>
            <p class="text-[10px] font-bold uppercase tracking-widest text-blue-100/80">Текущий вес</p>
            <p id="currWeight" class="text-3xl font-extrabold tracking-tight mt-1 text-white">-</p>
          </div>
          <span id="currDiffBadge" class="text-[11px] font-semibold px-3.5 py-1 rounded-full border backdrop-blur-md">--</span>
        </div>

        <div class="grid grid-cols-3 gap-2 mt-4 pt-3.5 border-t border-white/15 relative z-10">
          <div>
            <p class="text-[9px] font-bold uppercase tracking-wider text-blue-100/70">Тренд (SMA 7)</p>
            <p id="trendWeight" class="text-xs font-extrabold text-white mt-0.5">-</p>
          </div>
          <div>
            <p class="text-[9px] font-bold uppercase tracking-wider text-blue-100/70">Старт</p>
            <p id="startWeight" class="text-xs font-extrabold text-white/90 mt-0.5">-</p>
          </div>
          <div>
            <p class="text-[9px] font-bold uppercase tracking-wider text-blue-100/70">Цель</p>
            <p id="targetWeight" class="text-xs font-extrabold text-emerald-300 mt-0.5">-</p>
          </div>
        </div>
      </div>

      <!-- Карточка 2: График и периоды -->
      <div class="bg-white/90 backdrop-blur-2xl border border-white/80 rounded-[28px] p-4.5 shadow-[0_10px_25px_rgba(0,0,0,0.04)] relative overflow-hidden">
        
        <div class="flex flex-col gap-2 mb-2.5">
          <div class="flex flex-wrap justify-between items-start gap-2">
            <div>
              <h2 class="text-xs font-bold tracking-tight text-slate-900">Прогресс</h2>
            </div>
            <div class="flex items-center space-x-2 text-[10px] font-medium text-slate-500">
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span> Факт</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Тренд</span>
            </div>
          </div>

          <!-- Выбор периода -->
          <div class="grid grid-cols-6 gap-1 bg-slate-100/80 p-1 rounded-xl border border-slate-200/60 text-center">
            <button onclick="setPeriod('14')" id="btn-14" class="period-btn py-1 rounded-lg transition text-slate-600 text-[11px] font-medium">14д</button>
            <button onclick="setPeriod('30')" id="btn-30" class="period-btn py-1 rounded-lg transition text-slate-600 text-[11px] font-medium">30д</button>
            <button onclick="setPeriod('90')" id="btn-90" class="period-btn py-1 rounded-lg transition text-slate-600 text-[11px] font-medium">90д</button>
            <button onclick="setPeriod('180')" id="btn-180" class="period-btn py-1 rounded-lg transition text-slate-600 text-[11px] font-medium">180д</button>
            <button onclick="setPeriod('365')" id="btn-365" class="period-btn py-1 rounded-lg transition text-slate-600 text-[11px] font-medium">Год</button>
            <button onclick="setPeriod('all')" id="btn-all" class="period-btn py-1 rounded-lg transition bg-white text-blue-600 shadow-sm font-semibold text-[11px]">Все</button>
          </div>
        </div>

        <!-- График -->
        <div class="relative w-full h-[180px]">
          <canvas id="weightChart"></canvas>
        </div>
      </div>

      <!-- Премиальные плашки снизу -->
      <div class="grid grid-cols-2 gap-3 pb-2">
        <div class="bg-gradient-to-br from-purple-600 via-indigo-600 to-pink-600 text-white rounded-[24px] p-3.5 shadow-lg shadow-purple-500/20 relative overflow-hidden flex flex-col justify-between">
          <div class="absolute -right-6 -bottom-6 w-16 h-16 bg-white/15 rounded-full blur-xl pointer-events-none"></div>
          <p class="text-[10px] font-bold uppercase tracking-wider text-purple-100/80">Выполнение цели</p>
          <div id="progressText" class="text-xl font-extrabold tracking-tight mt-1 text-white">--%</div>
        </div>

        <div class="bg-gradient-to-br from-blue-600 via-cyan-600 to-teal-600 text-white rounded-[24px] p-3.5 shadow-lg shadow-blue-500/20 relative overflow-hidden flex flex-col justify-between">
          <div class="absolute -right-6 -bottom-6 w-16 h-16 bg-white/15 rounded-full blur-xl pointer-events-none"></div>
          <p class="text-[10px] font-bold uppercase tracking-wider text-cyan-100/80">🎯 Прогноз цели</p>
          <div id="goalEtaText" class="text-xs font-extrabold tracking-tight mt-1 text-white truncate">--</div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3eYPedBPTxSl83O8NuajX-h0sopO4MV3S30nQfyvfXbSnPd3vKsckGl2ibuggxrFDaQ/exec";

    let chartInstance = null;
    let globalData = {};
    let activeUserId = null;
    let currentPeriod = 'all';

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.requestFullscreen) {
          window.Telegram.WebApp.requestFullscreen();
        }
      }
      fetchData();
    });

    async function fetchData() {
      const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "";
      const url = `${APPS_SCRIPT_URL}?initData=${encodeURIComponent(initData)}`;

      try {
        const response = await fetch(url);
        const text = await response.text();
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("Сервер вернул некорректный ответ (проверьте URL Web App и права доступа «Все»).");
        }

        handleData(data);
      } catch (err) {
        hideSplash();
        showError("Ошибка подключения: " + err.message);
      }
    }

    function hideSplash() {
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.visibility = 'hidden';
      }
    }

    function handleData(response) {
      hideSplash();

      if (response.error) {
        showError(response.message || "Ошибка авторизации.");
        return;
      }

      globalData = response;
      const userIds = Object.keys(globalData);

      if (userIds.length === 0) {
        showError("В базе данных нет записей.");
        return;
      }

      let defaultUid = userIds[0];
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        const tgId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        if (globalData[tgId]) defaultUid = tgId;
      }

      activeUserId = defaultUid;

      const userTabs = document.getElementById('userTabs');
      userTabs.innerHTML = '';

      if (userIds.length > 1) {
        document.getElementById('userSelectorContainer').classList.remove('hidden');
        userIds.forEach(uid => {
          const user = globalData[uid];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `px-3.5 py-1 text-xs font-semibold rounded-full transition-all ${uid === activeUserId ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`;
          btn.textContent = user.name;
          btn.addEventListener('click', () => {
            activeUserId = uid;
            updateTabsUI(userIds);
            renderDashboard(globalData[activeUserId]);
          });
          userTabs.appendChild(btn);
        });
      }

      document.getElementById('dashboardContent').classList.remove('hidden');
      renderDashboard(globalData[activeUserId]);
    };

    function updateTabsUI(userIds) {
      const userTabs = document.getElementById('userTabs');
      const buttons = userTabs.children;
      userIds.forEach((uid, index) => {
        if (buttons[index]) {
          if (uid === activeUserId) {
            buttons[index].className = "px-3.5 py-1 text-xs font-semibold rounded-full transition-all bg-blue-600 text-white shadow-sm";
          } else {
            buttons[index].className = "px-3.5 py-1 text-xs font-semibold rounded-full transition-all text-slate-600 hover:text-slate-900";
          }
        }
      });
    }

    function showError(msg) {
      hideSplash();
      const errBox = document.getElementById('errorBox');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    function setPeriod(period) {
      currentPeriod = period;
      document.querySelectorAll('.period-btn').forEach(btn => {
        btn.className = "period-btn py-1 rounded-lg transition text-slate-600 text-[11px] font-medium";
      });
      const activeBtn = document.getElementById(`btn-${period}`);
      if (activeBtn) {
        activeBtn.className = "period-btn py-1 rounded-lg transition bg-white text-blue-600 shadow-sm font-semibold text-[11px]";
      }
      if (globalData[activeUserId]) {
        renderDashboard(globalData[activeUserId]);
      }
    }

    function calculateSMA(entries, windowSize = 7) {
      return entries.map((entry, index, arr) => {
        const start = Math.max(0, index - windowSize + 1);
        const subset = arr.slice(start, index + 1);
        const sum = subset.reduce((acc, curr) => acc + curr.weight, 0);
        return parseFloat((sum / subset.length).toFixed(1));
      });
    }

    function calculateGoalETA(entries, target, currentWeight) {
      if (!target || entries.length < 2) return "Не задана цель";
      
      const recent = entries.slice(-14);
      const first = recent[0];
      const last = recent[recent.length - 1];
      const daysDiff = (last.timestamp - first.timestamp) / (1000 * 60 * 60 * 24);
      
      if (daysDiff <= 0) return "Расчет...";
      const weightDiff = last.weight - first.weight;
      const ratePerDay = weightDiff / daysDiff;
      
      if (ratePerDay >= 0 && currentWeight > target) return "Нужен дефицит";
      if (ratePerDay <= 0 && currentWeight < target) return "Нужен профицит";
      if (ratePerDay === 0) return "Вес стабилен";

      const remainingWeight = target - currentWeight;
      const daysToTarget = remainingWeight / ratePerDay;
      
      if (daysToTarget < 0 || isNaN(daysToTarget) || !isFinite(daysToTarget)) return "Недоступно";
      
      const targetDate = new Date(Date.now() + daysToTarget * 24 * 60 * 60 * 1000);
      return targetDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderDashboard(userData) {
      if (!userData || !userData.entries || userData.entries.length === 0) {
        showError("У пользователя нет данных о весе.");
        return;
      }

      let entries = userData.entries;
      
      if (currentPeriod !== 'all') {
        const daysLimit = parseInt(currentPeriod);
        const latestTimestamp = entries[entries.length - 1].timestamp;
        const cutoffTime = latestTimestamp - (daysLimit * 24 * 60 * 60 * 1000);
        entries = entries.filter(e => e.timestamp >= cutoffTime);
      }

      const allEntries = userData.entries;
      const latest = allEntries[allEntries.length - 1];
      const prev = allEntries.length > 1 ? allEntries[allEntries.length - 2] : latest;
      const start = userData.start || allEntries[0].weight;
      const target = userData.target;

      document.getElementById('currWeight').textContent = `${latest.weight} кг`;
      document.getElementById('startWeight').textContent = `${start} кг`;
      document.getElementById('targetWeight').textContent = target ? `${target} кг` : "—";

      const diffDay = parseFloat((latest.weight - prev.weight).toFixed(1));
      const badge = document.getElementById('currDiffBadge');
      if (diffDay < 0) {
        badge.textContent = `${diffDay} кг за сутки`;
        badge.className = "text-[11px] font-semibold px-3.5 py-1.5 rounded-full bg-emerald-500/20 text-emerald-100 border border-emerald-400/30 backdrop-blur-md";
      } else if (diffDay > 0) {
        badge.textContent = `+${diffDay} кг за сутки`;
        badge.className = "text-[11px] font-semibold px-3.5 py-1.5 rounded-full bg-red-500/20 text-red-100 border border-red-400/30 backdrop-blur-md";
      } else {
        badge.textContent = `Без изменений`;
        badge.className = "text-[11px] font-semibold px-3.5 py-1.5 rounded-full bg-white/15 text-white/90 border border-white/20 backdrop-blur-md";
      }

      const smaValuesAll = calculateSMA(allEntries);
      document.getElementById('trendWeight').textContent = `${smaValuesAll[smaValuesAll.length - 1]} кг`;

      if (target) {
        const totalDist = Math.abs(target - start);
        const currentDist = Math.abs(latest.weight - start);
        let pct = totalDist > 0 ? Math.round((currentDist / totalDist) * 100) : 100;
        pct = Math.max(0, Math.min(100, pct));
        document.getElementById('progressText').textContent = `${pct}%`;
        
        const etaDateStr = calculateGoalETA(allEntries, target, latest.weight);
        document.getElementById('goalEtaText').textContent = etaDateStr;
      } else {
        document.getElementById('progressText').textContent = `0%`;
        document.getElementById('goalEtaText').textContent = `Нет цели`;
      }

      const labels = entries.map(e => e.dateStr);
      const weights = entries.map(e => e.weight);
      const smaValues = calculateSMA(entries);

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('weightChart').getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 160);
      gradient.addColorStop(0, 'rgba(37, 99, 235, 0.15)');
      gradient.addColorStop(1, 'rgba(37, 99, 235, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Факт',
              data: weights,
              borderColor: '#2563eb',
              backgroundColor: gradient,
              borderWidth: 2.5,
              pointRadius: 0,
              pointHoverRadius: 5,
              pointHoverBackgroundColor: '#2563eb',
              pointHoverBorderColor: '#ffffff',
              pointHoverBorderWidth: 2,
              tension: 0.35,
              fill: true
            },
            {
              label: 'Тренд',
              data: smaValues,
              borderColor: '#059669',
              borderWidth: 2,
              pointRadius: 0,
              pointHoverRadius: 0,
              borderDash: [4, 4],
              tension: 0.35,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              titleColor: '#ffffff',
              bodyColor: '#cbd5e1',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              padding: 10,
              cornerRadius: 12,
              boxPadding: 3,
              usePointStyle: true,
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#64748b', font: { size: 9, family: 'Inter' }, maxTicksLimit: 6 }
            },
            y: {
              grid: { color: 'rgba(0, 0, 0, 0.03)' },
              ticks: { color: '#64748b', font: { size: 9, family: 'Inter' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
